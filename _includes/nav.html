<nav class="site-nav">
  <div class="wrap">
    <a class="nav-brand" href="{{ site.baseurl }}/">{{ site.title }}</a>
    <div class="nav-links">
      {% assign main_pages = site.pages | where: "is_main", true | sort: "title" %}
      {% for item in main_pages %}
        <a href="{{ site.baseurl }}{{ item.url }}"{% if item.url == page.url %} class="is-active"{% endif %}>{{ item.title }}</a>
      {% endfor %}
      <a href="{{ site.guitehub }}" target="_blank" rel="noopener noreferrer"><i class="bi bi-github"></i>guitehub</a>
      <button id="theme-toggle" type="button" aria-label="Changer de thème"><i class="bi bi-moon-stars"></i></button>
    </div>
  </div>
</nav>
