# Configuration Jekyll du site « Le Hub de la Guite ».
# GitHub Pages le construit en mode classique (Jekyll 3.10, plugins de la liste blanche) :
# rester compatible, sans plugin supplémentaire. Relancer `jekyll serve` après modification.

title: Le Hub de la Guite
description: /dev/null

baseurl: ""                        # sous-chemin du site (vide : servi à la racine)
url: "https://guitehub.github.io"  # adresse complète, utilisée pour les liens absolus (flux RSS)

plugins:
  - jekyll-feed

# Liens utilisés dans la navigation et le pied de page
github: https://github.com/
githubpages: https://pages.github.com/
guitehub: https://github.com/guitehub

# Non publiés : outillage de développement (gueathub).
# Les exclusions par défaut de Jekyll sont reprises explicitement, car sous
# Jekyll 3.10 (build classique de GitHub Pages) cette liste peut les remplacer.
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - package.json
  - package-lock.json
  - scripts
  - outils/gueathub/src
  - outils/gueathub/tests
  - outils/gueathub/README.md
  - outils/gueathub/DECISIONS.md
