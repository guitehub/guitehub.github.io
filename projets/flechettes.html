<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#111318">
<title>Fléchettes — Scoreur</title>
<style>
  /* ---------- Base ---------- */
  :root {
    --bg: #111318;
    --panel: #1b1f27;
    --panel2: #262c38;
    --text: #e8eaf0;
    --muted: #8b93a7;
    --border: #2f3746;
    --accent: #4f8cff;
    --danger: #ef4444;
    --ok: #22c55e;
    --warn: #f59e0b;
    --radius: 12px;
    --largeur-libelle: 64px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  body { min-height: 100vh; min-height: 100dvh; overscroll-behavior: none; }
  button, .tactile, label.toggle, .emplacement, .selectionnable {
    touch-action: manipulation;
    user-select: none; -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  button {
    font: inherit; color: inherit;
    background: var(--panel2); border: 1px solid var(--border); border-radius: var(--radius);
    min-height: 44px; min-width: 44px; padding: 0 14px; cursor: pointer;
    line-height: 1.2;
  }
  button:active { filter: brightness(1.2); }
  button:disabled { opacity: .45; cursor: default; filter: none; }
  button.primaire { background: var(--accent); border-color: transparent; color: #fff; font-weight: 600; }
  button.danger { color: var(--danger); border-color: rgba(239, 68, 68, .45); }
  button.discret { background: transparent; border-color: transparent; color: var(--muted); }
  button.icone { padding: 0; width: 44px; font-size: 1.2rem; }
  input[type="text"], select {
    font: inherit; color: inherit; background: var(--panel2);
    border: 1px solid var(--border); border-radius: var(--radius);
    min-height: 44px; padding: 0 12px; width: 100%;
  }
  input[type="text"]:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .num { font-variant-numeric: tabular-nums; }
  h1 { font-size: 1.5rem; margin: 6px 0 14px; }
  h2 { font-size: .8rem; color: var(--muted); font-weight: 700; margin: 22px 0 8px; text-transform: uppercase; letter-spacing: .06em; }
  p { margin: 6px 0; }
  .muted { color: var(--muted); }
  .petit { font-size: .8rem; }
  .ecran {
    max-width: 640px; margin: 0 auto;
    padding: calc(12px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
  }
  .entete-app { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .entete-app h1 { margin: 0; }
  .carte { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 12px; }
  .pastille { display: inline-block; width: 12px; height: 12px; border-radius: 50%; vertical-align: -1px; margin-right: 6px; flex: none; }
  .ligne { display: flex; align-items: center; gap: 10px; min-height: 44px; }
  .ligne .etire { flex: 1; min-width: 0; }
  .rangee-boutons { display: flex; gap: 10px; flex-wrap: wrap; margin: 10px 0; }
  .rangee-boutons button { flex: 1; min-height: 50px; }
  .vide { text-align: center; color: var(--muted); padding: 24px 12px; }
  .vide .gros { font-size: 2.4rem; }
  table.stats { width: 100%; border-collapse: collapse; }
  table.stats th, table.stats td { padding: 8px 6px; text-align: left; border-bottom: 1px solid var(--border); }
  table.stats th { color: var(--muted); font-weight: 600; font-size: .8rem; }
  table.stats td.num, table.stats th.num { text-align: right; }
  table.stats tr:last-child td { border-bottom: none; }
  .ligne-partie { display: flex; align-items: center; gap: 10px; padding: 10px 6px; border-bottom: 1px solid var(--border); cursor: pointer; }
  .ligne-partie:last-child { border-bottom: none; }
  .ligne-partie .info { flex: 1; min-width: 0; }
  .ligne-partie .date { color: var(--muted); font-size: .8rem; }
  .pastilles .pastille { margin-right: 3px; }
  .bandeau-stockage {
    background: var(--warn); color: #111; font-size: .8rem; text-align: center; padding: 6px 12px;
    padding-top: calc(6px + env(safe-area-inset-top)); font-weight: 600;
  }
  .selftest {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    padding: calc(8px + env(safe-area-inset-top)) 12px 8px; font-weight: 700; text-align: center; color: #fff;
    font-size: .9rem; white-space: pre-wrap;
  }
  .selftest.ok { background: #15803d; }
  .selftest.ko { background: #b91c1c; }

  /* ---------- Toggles ---------- */
  label.toggle {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    min-height: 48px; padding: 4px 0; cursor: pointer;
  }
  label.toggle.desactive { opacity: .45; }
  label.toggle input { position: absolute; opacity: 0; width: 0; height: 0; }
  label.toggle .interrupteur {
    flex: none; width: 48px; height: 28px; border-radius: 14px; background: var(--border); position: relative; transition: background .15s;
  }
  label.toggle .interrupteur::after {
    content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: transform .15s;
  }
  label.toggle input:checked + .interrupteur { background: var(--accent); }
  label.toggle input:checked + .interrupteur::after { transform: translateX(20px); }
  .explication { font-size: .8rem; color: var(--muted); margin: -4px 0 8px; }

  /* ---------- Joueurs ---------- */
  .liste-joueurs .ligne { border-bottom: 1px solid var(--border); padding: 4px 0; }
  .liste-joueurs .ligne:last-child { border-bottom: none; }
  .palette { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin: 10px 0; }
  .palette button {
    min-height: 48px; border-radius: 10px; border: 3px solid transparent; position: relative; padding: 0;
  }
  .palette button.actif { border-color: #fff; }
  .palette button.prise::after { content: "●"; position: absolute; right: 4px; bottom: 0; font-size: .7rem; color: rgba(0,0,0,.6); }
  .avertissement { color: var(--warn); font-size: .8rem; }
  .erreur { color: var(--danger); font-size: .85rem; min-height: 1.2em; }

  /* ---------- Configuration ---------- */
  .selection-joueurs { display: flex; flex-wrap: wrap; gap: 8px; }
  .selection-joueurs button { border-width: 2px; }
  .selection-joueurs button.actif { border-color: var(--c); background: var(--teinte); font-weight: 700; }
  .file-ordre { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 4px; min-height: 28px; }
  .file-ordre .puce { background: var(--panel2); border-radius: 999px; padding: 4px 10px; font-size: .85rem; display: inline-flex; align-items: center; }
  .file-ordre .puce b { margin-right: 4px; color: var(--muted); }

  /* ---------- Partie ---------- */
  .partie { display: flex; flex-direction: column; height: 100vh; height: 100dvh; max-width: 640px; margin: 0 auto; }
  .partie-haut {
    padding: calc(8px + env(safe-area-inset-top)) 12px 6px; display: flex; justify-content: space-between; align-items: center;
    font-size: .85rem; color: var(--muted); gap: 8px;
  }
  .bandeau-dernier-tour { background: var(--warn); color: #111; text-align: center; font-weight: 800; padding: 6px; font-size: .85rem; letter-spacing: .04em; }
  .grille-conteneur {
    flex: 1; overflow: auto; overscroll-behavior: contain; position: relative;
    scroll-snap-type: x mandatory; scroll-padding-left: var(--largeur-libelle);
    -webkit-overflow-scrolling: touch; border-top: 1px solid var(--border);
  }
  .grille { display: grid; position: relative; min-width: 100%; }
  .cell {
    border-bottom: 1px solid var(--border); border-right: 1px solid var(--border);
    padding: 6px 4px; min-height: 42px; display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; background: var(--bg); overflow: hidden;
  }
  .cell.libelle { position: sticky; left: 0; z-index: 2; background: var(--panel); font-weight: 700; color: var(--muted); font-size: .85rem; }
  .cell.entete { position: sticky; top: 0; z-index: 3; background: var(--panel); border-bottom: 2px solid var(--border); padding: 8px 4px; min-height: 64px; }
  .cell.libelle.entete { z-index: 4; }
  .cell.joueur { scroll-snap-align: start; }
  .cell.courant { background: var(--teinte); }
  .cell.entete.courant { box-shadow: inset 0 -3px 0 var(--c); }
  .cell.entete.courant .nom { font-weight: 800; }
  .cell.mort { opacity: .4; }
  .cell.mort .marque { text-decoration: line-through; }
  .cell .nom { font-size: .9rem; font-weight: 600; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cell .nom .pastille { width: 9px; height: 9px; margin-right: 4px; }
  .score-gros { font-size: 2rem; font-weight: 800; line-height: 1.1; }
  .score-moyen { font-size: 1.3rem; font-weight: 800; line-height: 1.1; }
  .moy { font-size: .72rem; color: var(--muted); }
  .finish { font-size: .74rem; color: var(--ok); margin-top: 3px; font-weight: 700; white-space: nowrap; }
  .finish.aucun { color: var(--muted); font-weight: 400; }
  .badge { font-size: .62rem; background: var(--panel2); border-radius: 6px; padding: 1px 6px; color: var(--warn); font-weight: 800; margin-top: 3px; letter-spacing: .04em; }
  .cell .pts { font-size: 1.05rem; font-weight: 700; }
  .cell .reste { font-size: .75rem; color: var(--muted); }
  .cell .details { font-size: .65rem; color: var(--muted); opacity: .8; }
  .cell .bust { color: var(--danger); font-weight: 800; font-size: .9rem; letter-spacing: .04em; }
  .cell .marque { font-size: 1.25rem; font-weight: 700; line-height: 1; }
  .cell .marque.ferme { color: var(--ok); }
  .cell .coche { color: var(--ok); font-weight: 800; font-size: 1.1rem; }
  .cell .vise { color: var(--warn); font-weight: 800; }
  .cell.ligne-total { font-weight: 800; background: var(--panel); }
  .cell.libelle.ligne-total { font-weight: 800; color: var(--text); }
  .points-indicateur { display: flex; justify-content: center; gap: 6px; padding: 4px 0 6px; }
  .points-indicateur .point { width: 7px; height: 7px; border-radius: 50%; background: var(--border); }
  .points-indicateur .point.actif { background: var(--text); }
  .actions {
    display: flex; gap: 8px; padding: 8px 12px calc(8px + env(safe-area-inset-bottom));
    background: var(--panel); border-top: 1px solid var(--border); align-items: stretch;
  }
  .actions .saisir { flex: 1; min-height: 54px; font-size: 1rem; font-weight: 800; color: #fff; border: none; text-shadow: 0 1px 2px rgba(0,0,0,.4); }
  .actions .saisir .qui { display: block; font-size: .8rem; font-weight: 600; opacity: .9; }
  .actions .secondaire { min-height: 54px; font-weight: 600; }
  .actions .quitter { min-width: 44px; padding: 0 8px; }

  /* ---------- Modale de saisie ---------- */
  .modal {
    position: fixed; inset: 0; z-index: 50; background: rgba(0, 0, 0, .6);
    display: flex; align-items: flex-end; justify-content: center;
  }
  .feuille {
    width: 100%; max-width: 640px; background: var(--panel);
    border-radius: 16px 16px 0 0; border: 1px solid var(--border); border-bottom: none;
    padding: 10px 12px calc(12px + env(safe-area-inset-bottom));
    max-height: 94vh; max-height: 94dvh; overflow-y: auto; overscroll-behavior: contain;
  }
  .feuille-entete { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 40px; }
  .feuille-entete .qui { font-weight: 800; font-size: 1.05rem; display: flex; align-items: center; }
  .feuille-entete .etat { font-size: .85rem; color: var(--muted); text-align: right; }
  .feuille-entete .etat b { color: var(--text); font-size: 1.1rem; }
  .onglets { display: flex; gap: 6px; margin: 6px 0; }
  .onglets button { flex: 1; min-height: 40px; background: transparent; }
  .onglets button.actif { background: var(--panel2); font-weight: 700; border-color: var(--accent); }
  .emplacements { display: flex; gap: 8px; margin: 8px 0; }
  .emplacement {
    flex: 1; min-height: 50px; border: 2px dashed var(--border); border-radius: 10px;
    display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 1.2rem;
    background: var(--panel2); color: var(--muted); cursor: pointer;
  }
  .emplacement.rempli { border-style: solid; color: var(--text); }
  .emplacement.actif { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .emplacement .indice { font-size: .7rem; font-weight: 500; }
  .mults { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 8px 0; }
  .mults button { min-height: 46px; font-weight: 600; }
  .mults button.actif { background: var(--accent); color: #fff; border-color: transparent; }
  .pave { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .pave button { min-height: 50px; font-size: 1.15rem; font-weight: 700; padding: 0; }
  .pave button.attenue { opacity: .35; }
  .pave button.cible { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .pave button.vise { border-color: var(--warn); box-shadow: inset 0 0 0 2px var(--warn); }
  .pave button.large { grid-column: span 2; }
  .pave button.rate { color: var(--muted); }
  .pave-total { grid-template-columns: repeat(3, 1fr); }
  .affichage-total { font-size: 2.4rem; text-align: center; font-weight: 800; min-height: 56px; line-height: 56px; }
  .indication { text-align: center; min-height: 1.4em; font-size: .85rem; margin: 6px 0; color: var(--muted); }
  .indication.finish { color: var(--ok); font-weight: 700; font-size: .95rem; }
  .indication.erreur { color: var(--danger); font-weight: 600; }
  .indication.avertissement { color: var(--warn); }
  .feuille .rangee-boutons { margin: 10px 0 0; }
  .feuille .rangee-boutons button { min-height: 52px; font-weight: 700; }
  .confirmation { text-align: center; padding: 14px 0; }
  .confirmation .question { font-size: 1.1rem; font-weight: 700; margin-bottom: 12px; }

  /* ---------- Overlays ---------- */
  .overlay { position: fixed; inset: 0; z-index: 60; display: flex; align-items: center; justify-content: center; pointer-events: none; }
  .overlay .boite {
    pointer-events: auto; background: rgba(20, 22, 28, .94); border: 2px solid var(--border); border-radius: 20px;
    padding: 22px 30px; text-align: center; animation: pop .22s ease-out; max-width: 85vw; box-shadow: 0 10px 40px rgba(0,0,0,.5);
  }
  .overlay.bust .boite { border-color: var(--danger); }
  .overlay.rencontre .boite { border-color: var(--warn); }
  .overlay .titre { font-size: 2rem; font-weight: 900; letter-spacing: .06em; }
  .overlay.bust .titre { color: var(--danger); }
  .overlay.rencontre .titre { color: var(--warn); }
  .overlay .sous { margin-top: 8px; font-size: 1rem; }
  .overlay .sous div { margin: 2px 0; }
  @keyframes pop { from { transform: scale(.85); opacity: 0; } to { transform: none; opacity: 1; } }
  .toast {
    position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    background: var(--panel2); border: 1px solid var(--border); color: var(--text); padding: 10px 16px; border-radius: 999px;
    font-size: .9rem; z-index: 70; pointer-events: none; max-width: 90vw; text-align: center;
  }

  /* ---------- Fin de partie ---------- */
  .classement .rang { display: flex; align-items: center; gap: 10px; padding: 10px 6px; border-bottom: 1px solid var(--border); }
  .classement .rang:last-child { border-bottom: none; }
  .classement .rang .position { width: 28px; font-weight: 800; color: var(--muted); }
  .classement .rang.vainqueur { background: var(--teinte); border-radius: 10px; }
  .classement .rang.vainqueur .position { color: var(--warn); }
  .classement .rang .nom { flex: 1; font-weight: 600; display: flex; align-items: center; }
  .classement .rang .detail { color: var(--muted); font-size: .85rem; }
  .table-scroll { overflow-x: auto; overscroll-behavior: contain; }
</style>
</head>
<body>
<div id="bandeau-stockage" class="bandeau-stockage" hidden>Stockage indisponible : la partie ne sera pas sauvegardée.</div>
<div id="selftest" class="selftest" hidden></div>
<main id="app"></main>
<div id="modal" class="modal" hidden></div>
<div id="overlay" class="overlay" hidden></div>
<div id="toast" class="toast" hidden></div>
<script>
'use strict';

/* =====================================================================
   1. CONSTANTES — modes de jeu, cibles, couleurs, libellés
   ===================================================================== */
const PREFIXE_STOCKAGE = 'dartsapp:';
const VERSION_SCHEMA = 1;
const MAX_HISTORIQUE = 200;
const MAX_JOUEURS_PARTIE = 8;
const DELAI_SAUVEGARDE = 300;

const MODES = {
  '501':     { libelle: '501',     type: 'x01',     depart: 501 },
  '301':     { libelle: '301',     type: 'x01',     depart: 301 },
  'cricket': { libelle: 'Cricket', type: 'cricket' },
  'horloge': { libelle: 'Horloge', type: 'horloge' },
};
const ORDRE_MODES = ['501', '301', 'cricket', 'horloge'];

// Cibles du cricket : 25 représente la bulle (demi-bulle = 1 marque, bulle centrale = 2 marques).
const CIBLES_CRICKET = [20, 19, 18, 17, 16, 15, 25];
const SEQUENCE_HORLOGE = [...Array.from({ length: 20 }, (_, i) => i + 1), 25, 50];
const NUMEROS_PAVE = Array.from({ length: 20 }, (_, i) => i + 1);

const PALETTE = [
  { hex: '#ef4444', nom: 'Rouge' },
  { hex: '#f97316', nom: 'Orange' },
  { hex: '#eab308', nom: 'Jaune' },
  { hex: '#22c55e', nom: 'Vert' },
  { hex: '#14b8a6', nom: 'Turquoise' },
  { hex: '#3b82f6', nom: 'Bleu' },
  { hex: '#a855f7', nom: 'Violet' },
  { hex: '#ec4899', nom: 'Rose' },
  { hex: '#a3e635', nom: 'Citron' },
  { hex: '#e7e5e4', nom: 'Blanc' },
];

// Totaux de volée inatteignables avec 3 fléchettes (en plus de tout ce qui dépasse 180).
const TOTAUX_IMPOSSIBLES = new Set([163, 166, 169, 172, 173, 175, 176, 178, 179]);

function optionsParDefaut(mode) {
  const type = MODES[mode].type;
  if (type === 'x01') return { doubleIn: false, doubleOut: false };
  if (type === 'cricket') return { avecPoints: true, cutThroat: false };
  return {};
}

function libelleOptions(mode, options) {
  const type = MODES[mode].type;
  const l = [];
  if (type === 'x01') {
    if (options.doubleIn) l.push('Double in');
    l.push(options.doubleOut ? 'Double out' : 'Straight out');
  } else if (type === 'cricket') {
    if (options.cutThroat) l.push('Cut throat');
    else l.push(options.avecPoints ? 'Avec points' : 'Sans points');
  }
  if (options.rencontre) l.push('Rencontre');
  return l.join(' · ');
}

/* ---- Utilitaires généraux ---- */
function h(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
let compteurId = 0;
function genererId() {
  try { if (typeof crypto !== 'undefined' && crypto.randomUUID) return crypto.randomUUID(); } catch (e) { /* repli */ }
  return 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8) + '-' + (++compteurId);
}
function hexVersRgba(hex, alpha) {
  const m = /^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(hex || '');
  if (!m) return `rgba(128,128,128,${alpha})`;
  return `rgba(${parseInt(m[1], 16)},${parseInt(m[2], 16)},${parseInt(m[3], 16)},${alpha})`;
}
function formaterDate(iso) {
  try {
    return new Date(iso).toLocaleString('fr-FR', { day: '2-digit', month: '2-digit', year: '2-digit', hour: '2-digit', minute: '2-digit' });
  } catch (e) { return String(iso || ''); }
}
function formaterNombre(n, decimales = 1) {
  return Number(n || 0).toLocaleString('fr-FR', { minimumFractionDigits: decimales, maximumFractionDigits: decimales });
}
function vibrer(motif) {
  try { if (typeof navigator !== 'undefined' && navigator.vibrate) navigator.vibrate(motif); } catch (e) { /* jamais bloquant */ }
}

/* ---- Modèle de la fléchette ---- */
// Une fléchette = { secteur, multiplicateur }. secteur ∈ 0 (raté), 1..20, 25, 50. multiplicateur ∈ 1..3 pour 1..20 uniquement.
function flechette(secteur, multiplicateur = 1) {
  const s = Number(secteur) || 0;
  const m = (s >= 1 && s <= 20) ? Math.min(3, Math.max(1, Number(multiplicateur) || 1)) : 1;
  return { secteur: s, multiplicateur: m };
}
function valeurFlechette(f) {
  if (!f || !f.secteur) return 0;
  if (f.secteur === 25 || f.secteur === 50) return f.secteur;
  return f.secteur * f.multiplicateur;
}
function estDouble(f) {
  return !!f && (f.secteur === 50 || (f.secteur >= 1 && f.secteur <= 20 && f.multiplicateur === 2));
}
function notation(f) {
  if (!f || !f.secteur) return '—';
  if (f.secteur === 25 || f.secteur === 50) return String(f.secteur);
  return (f.multiplicateur === 3 ? 'T' : f.multiplicateur === 2 ? 'D' : '') + f.secteur;
}
// Analyse une notation ("T20", "D16", "5", "25", "50", "—") ; utilisée par les tests.
function analyserNotation(txt) {
  const t = String(txt).trim().toUpperCase();
  if (t === '—' || t === '-' || t === 'X' || t === '0') return flechette(0);
  const m = /^([TD]?)(\d+)$/.exec(t);
  if (!m) return null;
  return flechette(Number(m[2]), m[1] === 'T' ? 3 : m[1] === 'D' ? 2 : 1);
}

/* =====================================================================
   2. STORAGE — load/save/migrate/export/import, tout en try/catch
   ===================================================================== */
const app = {
  ecran: 'accueil',
  joueurs: [],
  games: [],
  partie: null,
  stockageOk: true,
  config: null,
  saisie: null,
  edition: null,
  fin: null,
  minuteurSauvegarde: null,
};

function lireStockage(cle, defaut) {
  try {
    const brut = localStorage.getItem(PREFIXE_STOCKAGE + cle);
    return brut == null ? defaut : JSON.parse(brut);
  } catch (e) { return defaut; }
}
function ecrireStockage(cle, valeur) {
  try {
    localStorage.setItem(PREFIXE_STOCKAGE + cle, JSON.stringify(valeur));
    return true;
  } catch (e) { signalerStockageIndisponible(); return false; }
}
function supprimerStockage(cle) {
  try { localStorage.removeItem(PREFIXE_STOCKAGE + cle); } catch (e) { /* ignoré */ }
}
function signalerStockageIndisponible() {
  app.stockageOk = false;
  try {
    const b = document.getElementById('bandeau-stockage');
    if (b) b.hidden = false;
  } catch (e) { /* hors DOM */ }
}

function joueurValide(j) {
  return j && typeof j === 'object' && typeof j.id === 'string' && typeof j.nom === 'string' && typeof j.couleur === 'string';
}
function partieValide(p) {
  return p && typeof p === 'object' && MODES[p.mode] && Array.isArray(p.joueurs) && p.joueurs.length >= 1
    && p.joueurs.every(joueurValide) && Array.isArray(p.volees) && typeof p.options === 'object' && p.options;
}

function migrerStockage() {
  const v = lireStockage('v', null);
  if (v === VERSION_SCHEMA) return;
  try {
    // Aucun schéma antérieur : on marque simplement la version courante.
    // Les versions futures ajouteront ici leurs conversions successives.
    ecrireStockage('v', VERSION_SCHEMA);
  } catch (e) {
    supprimerStockage('players'); supprimerStockage('games'); supprimerStockage('current');
    ecrireStockage('v', VERSION_SCHEMA);
  }
}

function chargerTout() {
  try {
    const cleTest = PREFIXE_STOCKAGE + 'test';
    localStorage.setItem(cleTest, '1');
    localStorage.removeItem(cleTest);
  } catch (e) { signalerStockageIndisponible(); }
  migrerStockage();
  const joueurs = lireStockage('players', []);
  app.joueurs = Array.isArray(joueurs) ? joueurs.filter(joueurValide) : [];
  const games = lireStockage('games', []);
  app.games = Array.isArray(games) ? games.filter(partieValide) : [];
  const courante = lireStockage('current', null);
  app.partie = partieValide(courante) ? courante : null;
}

function sauvegarderMaintenant() {
  if (app.minuteurSauvegarde) { clearTimeout(app.minuteurSauvegarde); app.minuteurSauvegarde = null; }
  ecrireStockage('players', app.joueurs);
  ecrireStockage('games', app.games.slice(-MAX_HISTORIQUE));
  if (app.partie) ecrireStockage('current', app.partie);
  else supprimerStockage('current');
}
function sauvegarderDifferee() {
  if (app.minuteurSauvegarde) clearTimeout(app.minuteurSauvegarde);
  app.minuteurSauvegarde = setTimeout(sauvegarderMaintenant, DELAI_SAUVEGARDE);
}

function exporterJson() {
  const donnees = { app: 'dartsapp', v: VERSION_SCHEMA, exportedAt: new Date().toISOString(), players: app.joueurs, games: app.games };
  const blob = new Blob([JSON.stringify(donnees, null, 1)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'flechettes-' + new Date().toISOString().slice(0, 10) + '.json';
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { a.remove(); URL.revokeObjectURL(url); }, 1000);
}
// Fusion par id : on ajoute ce qui manque, on ne modifie pas ce qui existe déjà.
function fusionnerImport(donnees) {
  if (!donnees || typeof donnees !== 'object') throw new Error('format');
  const joueurs = Array.isArray(donnees.players) ? donnees.players.filter(joueurValide) : [];
  const games = Array.isArray(donnees.games) ? donnees.games.filter(partieValide) : [];
  const idsJoueurs = new Set(app.joueurs.map(j => j.id));
  const idsGames = new Set(app.games.map(g => g.id));
  let nj = 0, ng = 0;
  joueurs.forEach(j => { if (!idsJoueurs.has(j.id)) { app.joueurs.push(j); idsJoueurs.add(j.id); nj++; } });
  games.forEach(g => { if (!idsGames.has(g.id)) { app.games.push(g); idsGames.add(g.id); ng++; } });
  app.games.sort((a, b) => String(a.dateFin || a.dateDebut).localeCompare(String(b.dateFin || b.dateDebut)));
  app.games = app.games.slice(-MAX_HISTORIQUE);
  return { joueurs: nj, games: ng, candidats: { joueurs: joueurs.length, games: games.length } };
}

/* =====================================================================
   3. MOTEUR DE RÈGLES — pur, sans DOM
   calculerEtat(mode, options, joueurs, volees) rejoue toute la partie.
   Une volée = { joueurIndex, flechettes: [ {secteur, multiplicateur} | null ], totalDirect: number|null, finiSurDouble?: bool }
   ===================================================================== */
function nouvelEtatJoueur(mode, options, joueur, index) {
  const type = MODES[mode].type;
  const e = {
    index, id: joueur.id, nom: joueur.nom, couleur: joueur.couleur,
    score: type === 'x01' ? MODES[mode].depart : 0,   // x01 : reste ; cricket : points
    ouvert: !(type === 'x01' && options.doubleIn),      // x01 double in
    marques: {},                                         // cricket
    cible: 0,                                            // horloge : index dans SEQUENCE_HORLOGE
    flechettes: 0, nbVolees: 0, volees: [],
    pointsMarques: 0, meilleureVolee: 0, volees100: 0, volees180: 0, meilleurCheckout: 0,
    marquesTotal: 0, meilleureVoleeMarques: 0,
    progressionTotal: 0, meilleureVoleeProgression: 0,
  };
  if (type === 'cricket') CIBLES_CRICKET.forEach(c => { e.marques[c] = 0; });
  return e;
}

function nbFermees(j) { return CIBLES_CRICKET.filter(c => j.marques[c] >= 3).length; }
function totalMarques(j) { return CIBLES_CRICKET.reduce((s, c) => s + Math.min(3, j.marques[c] || 0), 0); }
function moyenneVolee(j) { return j.flechettes ? (j.pointsMarques / j.flechettes) * 3 : 0; }
function moyenneMarques(j) { return j.nbVolees ? j.marquesTotal / j.nbVolees : 0; }
function moyenneProgression(j) { return j.nbVolees ? j.progressionTotal / j.nbVolees : 0; }

function jouerVoleeX01(j, volee, options) {
  const scoreAvant = j.score, ouvertAvant = j.ouvert;
  let score = scoreAvant, ouvert = ouvertAvant, bust = false, fini = false;
  const jouees = [];
  if (volee.totalDirect != null) {
    // Total direct : compte pour 3 fléchettes, ne peut pas ouvrir un double in.
    j.flechettes += 3;
    const t = ouvert ? Math.max(0, Number(volee.totalDirect) || 0) : 0;
    score -= t;
    if (score < 0 || (options.doubleOut && (score === 1 || (score === 0 && !volee.finiSurDouble)))) bust = true;
    else if (score === 0) fini = true;
  } else {
    for (const f of volee.flechettes) {
      if (!f) continue;
      j.flechettes++;
      jouees.push(f);
      if (!ouvert) {
        if (estDouble(f)) ouvert = true;     // la fléchette d'ouverture compte déjà
        else continue;
      }
      score -= valeurFlechette(f);
      if (score < 0 || (options.doubleOut && (score === 1 || (score === 0 && !estDouble(f))))) { bust = true; break; }
      if (score === 0) { fini = true; break; }
    }
  }
  if (bust) { score = scoreAvant; ouvert = ouvertAvant; }
  const total = scoreAvant - score;
  j.score = score; j.ouvert = ouvert; j.pointsMarques += total;
  if (!bust) {
    if (total > j.meilleureVolee) j.meilleureVolee = total;
    if (total >= 100) j.volees100++;
    if (total === 180) j.volees180++;
  }
  if (fini && scoreAvant > j.meilleurCheckout) j.meilleurCheckout = scoreAvant;
  return { flechettes: jouees, totalDirect: volee.totalDirect ?? null, total, bust, fini, scoreAvant, scoreApres: score };
}

function jouerVoleeCricket(j, volee, options, J) {
  let marquesVolee = 0, pointsVolee = 0;
  const jouees = [];
  for (const f of volee.flechettes) {
    if (!f) continue;
    j.flechettes++;
    jouees.push(f);
    let cible = null, m = 0;
    if (f.secteur === 25) { cible = 25; m = 1; }
    else if (f.secteur === 50) { cible = 25; m = 2; }
    else if (CIBLES_CRICKET.includes(f.secteur)) { cible = f.secteur; m = f.multiplicateur; }
    if (cible === null) continue;
    const avant = j.marques[cible];
    const utiles = Math.min(m, Math.max(0, 3 - avant));
    const exces = m - utiles;
    j.marques[cible] = avant + utiles;
    const adversairesOuverts = J.filter(o => o !== j && o.marques[cible] < 3);
    // Marques comptées dans les stats : celles qui ferment ou qui rapportent.
    marquesVolee += utiles + (adversairesOuverts.length ? exces : 0);
    if (exces > 0 && options.avecPoints && adversairesOuverts.length) {
      const pts = exces * cible;
      if (options.cutThroat) adversairesOuverts.forEach(o => { o.score += pts; });
      else j.score += pts;
      pointsVolee += pts;
    }
  }
  j.marquesTotal += marquesVolee;
  if (marquesVolee > j.meilleureVoleeMarques) j.meilleureVoleeMarques = marquesVolee;
  return { flechettes: jouees, marques: marquesVolee, points: pointsVolee, scoreApres: j.score };
}

function jouerVoleeHorloge(j, volee) {
  let progression = 0;
  const jouees = [];
  for (const f of volee.flechettes) {
    if (!f) continue;
    j.flechettes++;
    jouees.push(f);
    if (j.cible < SEQUENCE_HORLOGE.length && f.secteur === SEQUENCE_HORLOGE[j.cible]) { j.cible++; progression++; }
  }
  j.progressionTotal += progression;
  if (progression > j.meilleureVoleeProgression) j.meilleureVoleeProgression = progression;
  return { flechettes: jouees, progression, cibleApres: j.cible };
}

function conditionVictoire(type, options, j, J) {
  if (type === 'x01') return j.score === 0;
  if (type === 'horloge') return j.cible >= SEQUENCE_HORLOGE.length;
  if (nbFermees(j) < CIBLES_CRICKET.length) return false;
  if (!options.avecPoints) return true;
  const autres = J.filter(o => o !== j);
  if (options.cutThroat) return autres.every(o => j.score <= o.score);
  return autres.every(o => j.score >= o.score);
}
// Clé de départage entre plusieurs vainqueurs du même tour (plus petit = meilleur).
function cleDepartage(type, options, j) {
  if (type === 'cricket') return options.cutThroat ? j.score : -j.score;
  return j.flechettes;
}
function comparerClassement(type, options, a, b) {
  if (type === 'x01') return (a.score - b.score) || (moyenneVolee(b) - moyenneVolee(a));
  if (type === 'cricket') {
    return (nbFermees(b) - nbFermees(a)) || (options.cutThroat ? a.score - b.score : b.score - a.score);
  }
  return (b.cible - a.cible) || (a.flechettes - b.flechettes);
}

// Rencontre : « même score » selon le mode.
function valeurRencontre(type, options, j) {
  if (type === 'x01') return j.score;
  if (type === 'cricket') return options.avecPoints ? j.score : totalMarques(j);
  return j.cible;
}
function groupesRencontre(type, options, J) {
  const m = new Map();
  J.forEach(j => {
    if (j.nbVolees < 1) return;     // chacun doit avoir joué au moins une volée
    const v = valeurRencontre(type, options, j);
    if (!m.has(v)) m.set(v, []);
    m.get(v).push(j.index);
  });
  return [...m.entries()].filter(([, ids]) => ids.length >= 2)
    .map(([valeur, indices]) => ({ valeur, indices })).sort((a, b) => a.indices[0] - b.indices[0]);
}
function signatureRencontre(groupes) {
  return groupes.map(g => g.valeur + ':' + g.indices.join('+')).join('|');
}

function calculerEtat(mode, options, joueurs, volees) {
  const type = MODES[mode].type;
  const n = joueurs.length;
  const J = joueurs.map((j, i) => nouvelEtatJoueur(mode, options, j, i));
  const details = [];
  let signaturePrec = '', rencontres = 0, rencontreVolee = -1, rencontreGroupes = [];

  volees.forEach((v, idx) => {
    const j = J[v.joueurIndex];
    if (!j) return;
    const fl = Array.isArray(v.flechettes) ? v.flechettes : [];
    const volee = { flechettes: fl, totalDirect: v.totalDirect ?? null, finiSurDouble: !!v.finiSurDouble };
    let d;
    if (type === 'x01') d = jouerVoleeX01(j, volee, options);
    else if (type === 'cricket') d = jouerVoleeCricket(j, volee, options, J);
    else d = jouerVoleeHorloge(j, volee);
    d.joueurIndex = v.joueurIndex; d.index = idx; d.tour = Math.floor(idx / n);
    details.push(d);
    j.volees.push(d);
    j.nbVolees++;

    const groupes = groupesRencontre(type, options, J);
    const sig = signatureRencontre(groupes);
    if (sig && sig !== signaturePrec) { rencontres++; rencontreVolee = idx; rencontreGroupes = groupes; }
    signaturePrec = sig;
  });

  const remplit = J.map(j => conditionVictoire(type, options, j, J));
  const finEnCours = remplit.some(Boolean);
  const termine = finEnCours && (volees.length % n === 0);
  const joueurCourant = termine ? null : volees.length % n;

  let vainqueurs = [];
  if (termine) {
    const candidats = J.filter((j, i) => remplit[i]);
    const meilleure = Math.min(...candidats.map(j => cleDepartage(type, options, j)));
    vainqueurs = candidats.filter(j => cleDepartage(type, options, j) === meilleure).map(j => j.index);
  }
  const estVainqueur = new Set(vainqueurs);
  const classement = J.map(j => j.index).sort((a, b) => {
    const va = estVainqueur.has(a) ? 0 : 1, vb = estVainqueur.has(b) ? 0 : 1;
    return (va - vb) || comparerClassement(type, options, J[a], J[b]) || (a - b);
  });

  return {
    mode, options, type, joueurs: J, volees: details, joueurCourant,
    dernierTour: finEnCours && !termine, termine, vainqueurs, classement,
    tour: Math.floor(volees.length / n) + 1, nbTours: Math.ceil(volees.length / n),
    rencontres, rencontreVolee, rencontreGroupes,
  };
}

/* =====================================================================
   4. CHECKOUT — calcul des finishes conseillés
   ===================================================================== */
const LANCERS = [];
for (let s = 1; s <= 20; s++) for (let m = 1; m <= 3; m++) LANCERS.push(flechette(s, m));
LANCERS.push(flechette(25), flechette(50));
LANCERS.forEach(l => { l.valeur = valeurFlechette(l); l.notation = notation(l); });

const PREF_PREMIER = ['T20', 'T19', 'T18'];
const PREF_DOUBLE = ['D20', 'D16', 'D8', 'D4', 'D2', 'D10', 'D12'];
const cacheCheckout = new Map();

function rangChemin(chemin, doubleOut) {
  const premier = chemin[0], dernier = chemin[chemin.length - 1];
  const total = chemin.reduce((s, l) => s + l.valeur, 0);
  let rangPremier = PREF_PREMIER.indexOf(premier.notation);
  if (rangPremier < 0) rangPremier = 3;
  let rangDernier = PREF_DOUBLE.indexOf(dernier.notation);
  if (rangDernier < 0) rangDernier = dernier.secteur === 50 ? 7 : estDouble(dernier) ? 8 : 9;
  const resteImpair = (doubleOut && chemin.length > 1 && ((total - premier.valeur) % 2 === 1)) ? 1 : 0;
  const milieu = chemin.slice(1, -1).reduce((s, l) => s + l.multiplicateur, 0);
  return [chemin.length, rangPremier, rangDernier, resteImpair, milieu, -premier.valeur];
}
function comparerRangs(a, b) {
  for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) return a[i] - b[i];
  return 0;
}

// Renvoie le meilleur chemin (tableau de lancers) ou null.
function checkout(score, nbFlechettes, doubleOut) {
  if (!(score > 0) || nbFlechettes < 1) return null;
  const cle = score + '/' + nbFlechettes + '/' + (doubleOut ? 1 : 0);
  if (cacheCheckout.has(cle)) return cacheCheckout.get(cle);

  const finisseurs = LANCERS.filter(l => !doubleOut || estDouble(l));
  const parValeur = new Map();
  finisseurs.forEach(l => { if (!parValeur.has(l.valeur)) parValeur.set(l.valeur, []); parValeur.get(l.valeur).push(l); });

  let meilleur = null, meilleurRang = null;
  const considerer = chemin => {
    const r = rangChemin(chemin, doubleOut);
    if (!meilleur || comparerRangs(r, meilleurRang) < 0) { meilleur = chemin; meilleurRang = r; }
  };
  (parValeur.get(score) || []).forEach(l => considerer([l]));
  if (!meilleur && nbFlechettes >= 2) {
    for (const l1 of LANCERS) {
      const reste = score - l1.valeur;
      if (reste <= 0) continue;
      (parValeur.get(reste) || []).forEach(l2 => considerer([l1, l2]));
    }
  }
  if (!meilleur && nbFlechettes >= 3) {
    for (const l1 of LANCERS) {
      for (const l2 of LANCERS) {
        const reste = score - l1.valeur - l2.valeur;
        if (reste <= 0) continue;
        (parValeur.get(reste) || []).forEach(l3 => considerer([l1, l2, l3]));
      }
    }
  }
  cacheCheckout.set(cle, meilleur);
  return meilleur;
}
function texteCheckout(chemin) { return chemin ? chemin.map(l => l.notation).join(' → ') : ''; }

/* =====================================================================
   5. STATS — agrégats de fin de partie et d'accueil
   ===================================================================== */
function statsAccueil(games, joueurs) {
  const parJoueur = new Map(joueurs.map(j => [j.id, { joueur: j, victoires: 0, parties: 0 }]));
  games.forEach(g => {
    const vainqueurs = new Set(g.vainqueurs || []);
    g.joueurs.forEach(j => {
      const s = parJoueur.get(j.id);
      if (!s) return;
      s.parties++;
      if (vainqueurs.has(j.id)) s.victoires++;
    });
  });
  const victoires = [...parJoueur.values()].filter(s => s.parties > 0)
    .sort((a, b) => (b.victoires - a.victoires) || (a.parties - b.parties) || a.joueur.nom.localeCompare(b.joueur.nom));
  return { total: games.length, dernieres: games.slice(-5).reverse(), victoires };
}

function statsJoueurPartie(etat, j) {
  if (etat.type === 'x01') {
    return [
      ['Moyenne / volée', formaterNombre(moyenneVolee(j))],
      ['Meilleure volée', j.meilleureVolee],
      ['Fléchettes', j.flechettes],
      ['Volées 100+', j.volees100],
      ['Volées 180', j.volees180],
      ['Meilleur checkout', j.meilleurCheckout || '—'],
    ];
  }
  if (etat.type === 'cricket') {
    const l = [
      ['Marques / volée', formaterNombre(moyenneMarques(j))],
      ['Meilleure volée', j.meilleureVoleeMarques + ' marques'],
      ['Cibles fermées', nbFermees(j) + '/7'],
    ];
    if (etat.options.avecPoints) l.push([etat.options.cutThroat ? 'Points reçus' : 'Points marqués', j.score]);
    return l;
  }
  return [
    ['Numéros / volée', formaterNombre(moyenneProgression(j))],
    ['Meilleure volée', j.meilleureVoleeProgression],
    ['Fléchettes', j.flechettes],
    ['Atteint', j.cible >= SEQUENCE_HORLOGE.length ? 'Terminé' : String(SEQUENCE_HORLOGE[j.cible])],
  ];
}

/* =====================================================================
   6. RENDU — fonctions render* par écran, DOM impératif
   Le rendu est toujours render(calculerEtat(...)) : aucune règle ici.
   ===================================================================== */
function pastille(couleur) { return `<span class="pastille" style="background:${h(couleur)}"></span>`; }
function styleTeinte(couleur, alpha = 0.18) { return `style="--c:${h(couleur)};--teinte:${hexVersRgba(couleur, alpha)}"`; }
function joueurParId(id) { return app.joueurs.find(j => j.id === id) || null; }
function etatCourant() {
  const p = app.partie;
  return p ? calculerEtat(p.mode, p.options, p.joueurs, p.volees) : null;
}
function nomsJoueurs(joueurs) { return joueurs.map(j => h(j.nom)).join(', '); }

function render() {
  const racine = document.getElementById('app');
  let scroll = null;
  const g = document.getElementById('grille');
  if (g) scroll = { left: g.scrollLeft, top: g.scrollTop };
  let html = '';
  switch (app.ecran) {
    case 'joueurs': html = renderJoueurs(); break;
    case 'config': html = renderConfig(); break;
    case 'partie': html = renderPartie(); break;
    case 'fin': html = renderFin(); break;
    case 'reglages': html = renderReglages(); break;
    default: html = renderAccueil();
  }
  racine.innerHTML = html;
  if (app.ecran === 'partie') apresRenderPartie(scroll);
  renderModal();
}

/* ---- 5.1 Accueil ---- */
function renderAccueil() {

  if (app.partie) {

    html += `<div class="carte" ${styleTeinte('#f59e0b', 0.12)} style="border-color:var(--warn);background:var(--teinte)">

      <div class="petit muted">${h(MODES[p.mode].libelle)} · ${h(libelleOptions(p.mode, p.options))}</div>
      <div class="petit">${p.joueurs.map(j => pastille(j.couleur) + h(j.nom)).join(' · ')}</div>
      <div class="petit muted">Commencée le ${h(formaterDate(p.dateDebut))} · ${p.volees.length} volée${p.volees.length > 1 ? 's' : ''}</div>
      <div class="rangee-boutons"><button class="primaire" data-action="reprendre">Reprendre</button>
        <button class="danger" data-action="abandonner-courante">Abandonner</button></div>
    </div>`;
  }
  html += `<div class="rangee-boutons">
    <button data-action="aller" data-ecran="joueurs">Joueurs</button>
    <button class="primaire" data-action="nouvelle-partie">Nouvelle partie</button></div>`;

  const s = statsAccueil(app.games, app.joueurs);
  if (s.total === 0) {
    html += `<div class="carte vide"><div class="gros">🎯</div><p>Aucune partie jouée pour l'instant.</p>
      <p class="petit">Crée des joueurs, lance une partie, et les statistiques apparaîtront ici.</p></div>`;
  } else {
    html += `<h2>${s.total} partie${s.total > 1 ? 's' : ''} jouée${s.total > 1 ? 's' : ''}</h2><div class="carte">`;
    s.dernieres.forEach(g => {
      const vainqueurs = g.joueurs.filter(j => (g.vainqueurs || []).includes(j.id));
      html += `<div class="ligne-partie tactile" data-action="ouvrir-resume" data-id="${h(g.id)}">
        <div class="info"><div><b>${h(MODES[g.mode].libelle)}</b> <span class="muted petit">${h(libelleOptions(g.mode, g.options))}</span></div>
          <div class="date">${h(formaterDate(g.dateFin || g.dateDebut))}</div></div>
        <div class="pastilles">${g.joueurs.map(j => pastille(j.couleur)).join('')}</div>
        <div class="petit">🏆 ${vainqueurs.length ? nomsJoueurs(vainqueurs) : '—'}</div></div>`;
    });
    html += `</div>`;
    if (s.victoires.length) {
      html += `<h2>Victoires par joueur</h2><div class="carte"><table class="stats"><thead><tr><th>Joueur</th><th class="num">Victoires</th><th class="num">Parties</th></tr></thead><tbody>`;
      s.victoires.forEach(v => {
        html += `<tr><td>${pastille(v.joueur.couleur)}${h(v.joueur.nom)}</td><td class="num">${v.victoires}</td><td class="num">${v.parties}</td></tr>`;
      });
      html += `</tbody></table></div>`;
    }
  }
  return html + `</div>`;
}

/* ---- 5.2 Joueurs ---- */
function renderJoueurs() {
  const e = app.edition;
  let html = `<div class="ecran"><header class="entete-app"><h1>Joueurs</h1>
    <button class="discret" data-action="aller" data-ecran="accueil">Accueil</button></header>`;

      <div class="palette">${PALETTE.map(c => `<button class="${c.hex === e.couleur ? 'actif' : ''} ${couleursPrises.has(c.hex) ? 'prise' : ''}" style="background:${c.hex}" data-action="choisir-couleur" data-hex="${c.hex}" aria-label="${c.nom}" title="${c.nom}"></button>`).join('')}</div>
      ${couleursPrises.has(e.couleur) ? `<div class="avertissement">Cette couleur est déjà utilisée par un autre joueur.</div>` : ''}

/* ---- 5.3 Configuration ---- */
function toggleHtml(libelle, cle, coche, desactive, dataChange = 'option') {
  return `<label class="toggle ${desactive ? 'desactive' : ''}"><span>${h(libelle)}</span>
    <input type="checkbox" data-change="${dataChange}" data-cle="${cle}" ${coche ? 'checked' : ''} ${desactive ? 'disabled' : ''}><span class="interrupteur"></span></label>`;
}
function validerConfig(c) {
  if (!app.joueurs.length) return 'Crée d\'abord des joueurs.';
  if (c.selection.length < 1) return 'Sélectionne au moins un joueur.';
  if (c.selection.length > MAX_JOUEURS_PARTIE) return `Maximum ${MAX_JOUEURS_PARTIE} joueurs par partie.`;
  return '';
}
function renderConfig() {
  const c = app.config;
  const type = MODES[c.mode].type;
  const erreur = validerConfig(c);
  let html = `<div class="ecran"><header class="entete-app"><h1>Nouvelle partie</h1>
    <button class="discret" data-action="aller" data-ecran="accueil">Accueil</button></header>`;

  html += `<h2>Joueurs (dans l'ordre d'ajout)</h2><div class="carte">`;
  if (!app.joueurs.length) {
    html += `<p class="muted">Aucun joueur enregistré.</p><button data-action="aller" data-ecran="joueurs" style="width:100%">Créer des joueurs</button>`;
  } else {
    html += `<div class="selection-joueurs">` + app.joueurs.map(j => {
      const pos = c.selection.indexOf(j.id);
      return `<button class="${pos >= 0 ? 'actif' : ''}" ${styleTeinte(j.couleur)} data-action="basculer-joueur" data-id="${h(j.id)}">${pastille(j.couleur)}${h(j.nom)}</button>`;
    }).join('') + `</div>`;
    html += `<div class="file-ordre">` + (c.selection.length
      ? c.selection.map((id, i) => { const j = joueurParId(id); return j ? `<span class="puce"><b>${i + 1}.</b>${pastille(j.couleur)}${h(j.nom)}</span>` : ''; }).join('')
      : `<span class="muted petit">Touche un joueur pour l'ajouter. Le premier ajouté commence.</span>`) + `</div>`;
  }
  html += `</div>`;

  html += `<h2>Mode</h2><div class="carte"><select data-change="mode">${ORDRE_MODES.map(m => `<option value="${m}" ${m === c.mode ? 'selected' : ''}>${h(MODES[m].libelle)}</option>`).join('')}</select>`;
  if (type === 'x01') {
    html += toggleHtml('Double in', 'doubleIn', c.options.doubleIn, false)
      + `<div class="explication">Il faut un double pour commencer à compter.</div>`
      + toggleHtml('Double out', 'doubleOut', c.options.doubleOut, false)
      + `<div class="explication">Il faut finir sur un double (la bulle compte). Sinon : straight out.</div>`;
  } else if (type === 'cricket') {
    html += toggleHtml('Avec points', 'avecPoints', c.options.avecPoints, c.options.cutThroat)
      + `<div class="explication">Les marques en trop sur une cible fermée rapportent des points.</div>`
      + toggleHtml('Cut throat', 'cutThroat', c.options.cutThroat, false)
      + `<div class="explication">Les points vont aux adversaires. Le score le plus bas gagne.</div>`;
  } else {
    html += `<div class="explication" style="margin-top:8px">Toucher 1, 2, … 20, puis la demi-bulle, puis la bulle. Tout multiplicateur valide.</div>`;
  }
  html += `</div>`;

  html += `<div class="erreur" style="text-align:center">${h(erreur)}</div>
    <button class="primaire" style="width:100%;min-height:54px;font-size:1.05rem" data-action="lancer-partie" ${erreur ? 'disabled' : ''}>Lancer la partie</button>`;

  const cutThroat = type === 'cricket' && c.options.cutThroat;
  html += `<div class="carte" style="margin-top:16px" data-action="${cutThroat ? 'expliquer-rencontre' : ''}">`
