<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0E1114">
<meta name="description" content="Feuille de score fléchettes : 501, cricket, horloge, finish conseillé, hors ligne.">
<title>Fléchettes — feuille de score</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23ECE7DC'/%3E%3Cg fill='%230E1114'%3E%3Cpath d='M16 16L24.49 7.51A12 12 0 0 1 24.49 24.49Z'/%3E%3Cpath d='M16 16L7.51 24.49A12 12 0 0 1 7.51 7.51Z'/%3E%3C/g%3E%3Ccircle cx='16' cy='16' r='12' fill='none' stroke='%230E1114' stroke-width='1.6'/%3E%3Ccircle cx='16' cy='16' r='6.4' fill='%23ECE7DC' stroke='%230E1114' stroke-width='1.6'/%3E%3Ccircle cx='16' cy='16' r='2.6' fill='%230E1114'/%3E%3C/svg%3E">
<style>
/* ============================================================
   JETONS — ardoise, filets, craie. La couleur est réservée aux joueurs.
   ============================================================ */
:root{
  --bg:#0E1114;
  --surface:#161A1F;
  --band:#1A1F25;
  --raise:#1F252C;
  --rule:#2A3138;
  --rule-2:#3C454F;
  --chalk:#ECE7DC;
  --muted:#8C949D;
  --faint:#5B636C;
  --danger:#E4665A;

  --label-w:clamp(78px,26vw,108px);
  --row-h:46px;
  --head-h:58px;
  --head-h-x01:96px;
  --tot-h:54px;

  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{
  background:var(--bg);color:var(--chalk);font-family:var(--font);font-size:15px;line-height:1.35;
  -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none;touch-action:manipulation;
}
button{font:inherit;color:inherit;background:none;border:0;margin:0;padding:0;cursor:pointer;touch-action:manipulation}
input{font:inherit;-webkit-user-select:text;user-select:text}
h1,h2,h3,p{margin:0}
:focus{outline:none}
:focus-visible{outline:2px solid var(--chalk);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.grow{flex:1}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* ============================================================
   COQUE
   ============================================================ */
#app{
  position:fixed;inset:0;display:flex;flex-direction:column;
  padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);
}
.screen{display:flex;flex-direction:column;flex:1;min-height:0}
.scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}

.bar{padding-top:env(safe-area-inset-top);background:var(--bg);border-bottom:1px solid var(--rule);flex:none}
.bar-in{display:flex;align-items:center;gap:4px;height:52px;padding:0 6px}
.brand{display:flex;align-items:center;gap:8px;padding-left:6px;font-size:17px;font-weight:700;letter-spacing:-.01em}
.brand svg{color:var(--muted)}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;gap:4px;min-width:44px;min-height:44px;padding:0 10px;border-radius:10px;font-size:14px;font-weight:600;color:var(--muted)}
.iconbtn:active{background:var(--raise)}
.iconbtn.strong{color:var(--chalk)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 16px;border-radius:12px;font-size:15px;font-weight:600;background:var(--raise);color:var(--chalk);border:1px solid transparent}
.btn:active{filter:brightness(1.25)}
.btn-primary{background:var(--chalk);color:var(--bg)}
.btn-ghost{background:transparent;border-color:var(--rule-2);color:var(--chalk)}
.btn-danger{background:transparent;border-color:rgba(228,102,90,.45);color:var(--danger)}
.btn-lg{width:100%;min-height:54px;font-size:16px}
.btn:disabled{opacity:.35;cursor:default}

.footer{flex:none;padding:12px 14px max(12px,env(safe-area-inset-bottom));border-top:1px solid var(--rule);background:var(--bg)}
.hint{font-size:12.5px;color:var(--muted);text-align:center;padding-bottom:8px}

/* ============================================================
   ACCUEIL
   ============================================================ */
.home{padding-bottom:8px}
.sec{padding:18px 14px 16px;border-bottom:1px solid var(--rule)}
.sec:last-child{border-bottom:0}
.shead{display:flex;align-items:baseline;gap:8px;margin-bottom:10px}
.shead h2{font-size:13px;font-weight:600;color:var(--muted)}
.shead-x{margin-left:auto;font-size:12px;color:var(--faint)}

.empty{font-size:14px;color:var(--muted);line-height:1.5}

.resume{display:block;width:100%;text-align:left;padding:14px;border-bottom:1px solid var(--rule);background:var(--surface)}
.resume:active{background:var(--raise)}
.resume-h{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:700}
.resume-h .chev{margin-left:auto;color:var(--muted)}
.resume-p{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:8px;font-size:13px;color:var(--muted)}
.resume-p i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--pc);margin-right:4px;vertical-align:middle}

.stat-line{font-size:14.5px;color:var(--chalk);line-height:1.5}
.stat-line b{font-weight:700}
.record{margin-top:6px;font-size:14.5px;color:var(--muted)}
.record b{font-size:19px;font-weight:700;color:var(--chalk)}
.record .who{font-weight:600;color:var(--pc,var(--chalk))}

.lb{margin-top:14px;border-top:1px solid var(--rule)}
.lb-r{display:grid;grid-template-columns:1fr 34px 34px;align-items:center;gap:6px;height:38px;border-bottom:1px solid var(--rule)}
.lb-h{height:26px;font-size:11px;color:var(--faint)}
.lb-r>span{text-align:right}
.lb-r>span:first-child{text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-n{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600}
.lb-n i{width:9px;height:9px;border-radius:50%;background:var(--pc);flex:none}
.lb-v{font-size:14px}
.lb-r .dim{color:var(--muted)}

.plist{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
.prow{display:flex;align-items:stretch;border-bottom:1px solid var(--rule)}
.prow-main{display:flex;align-items:center;gap:12px;flex:1;min-width:0;min-height:56px;padding:0 4px 0 12px;text-align:left;border-left:3px solid transparent}
.prow-main:active{background:var(--surface)}
.prow.on .prow-main{border-left-color:var(--pc);background-color:var(--surface);background-image:linear-gradient(rgb(var(--pc-rgb)/.07),rgb(var(--pc-rgb)/.07))}
.swatch{width:16px;height:16px;border-radius:50%;flex:none;border:2px solid var(--pc)}
.prow.on .swatch{background:var(--pc)}
.pname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:16px;font-weight:600}
.badge{flex:none;min-width:26px;height:26px;border-radius:13px;display:inline-flex;align-items:center;justify-content:center;padding:0 7px;font-size:13px;font-weight:700;background:var(--pc);color:#0E1114}
.prow-more{width:52px;flex:none;display:flex;align-items:center;justify-content:center;color:var(--faint)}
.prow-more:active{color:var(--chalk)}
.addrow{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:0 12px;font-size:15px;font-weight:600;color:var(--muted);border-bottom:1px solid var(--rule)}
.addrow:active{color:var(--chalk)}
.addrow .plus{width:16px;height:16px;display:flex;align-items:center;justify-content:center;color:var(--muted)}

.setting{display:flex;align-items:center;gap:14px;min-height:56px;cursor:pointer}
.setting-t{font-size:16px;font-weight:600}
.setting-d{display:block;margin-top:2px;font-size:12.5px;color:var(--muted)}
.setting .pick{flex:none;display:flex;align-items:center;gap:6px;font-size:16px;font-weight:600;color:var(--muted)}
.switch{position:relative;flex:none;width:50px;height:30px;border-radius:15px;background:var(--raise);border:1px solid var(--rule-2);transition:background .15s ease}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--muted);transition:transform .15s ease,background .15s ease}
.setting input:checked+.switch{background:var(--chalk);border-color:var(--chalk)}
.setting input:checked+.switch::after{transform:translateX(20px);background:var(--bg)}
.setting input:focus-visible+.switch{outline:2px solid var(--chalk);outline-offset:2px}
/* Réglage indisponible : la même atténuation que `.btn:disabled`. */
.setting.locked{opacity:.45}

/* ============================================================
   GRILLE DE PARTIE
   ============================================================ */
.turn{display:flex;align-items:center;gap:9px;flex:none;height:34px;padding:0 14px;border-bottom:1px solid var(--rule);
  background-color:var(--bg);background-image:linear-gradient(rgb(var(--pc-rgb)/.16),rgb(var(--pc-rgb)/.16))}
.turn i{width:9px;height:9px;border-radius:50%;background:var(--pc);flex:none}
.turn span{font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.sheet{
  flex:1;min-height:0;display:grid;
  grid-template-rows:var(--head-h) repeat(7,var(--row-h));
  overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
  scroll-snap-type:x mandatory;scroll-padding-left:var(--label-w);
  background:var(--surface);
}
.cell{position:relative;border-bottom:1px solid var(--rule);border-right:1px solid var(--rule);background-color:var(--surface)}
.cell.band{background-color:var(--band)}
.cell.col-active{background-image:linear-gradient(rgb(var(--pc-rgb)/.10),rgb(var(--pc-rgb)/.10))}

.lab,.corner,.totlab{position:sticky;left:0;z-index:3;border-right:1px solid var(--rule-2)}
.corner{top:0;z-index:6;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;padding:0 10px;border-bottom:1px solid var(--rule-2)}
.corner .k{font-size:10.5px;color:var(--faint)}
.corner .v{font-size:15px;font-weight:700}
.phead{position:sticky;top:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:6px 6px 0;border-bottom:1px solid var(--rule-2);overflow:hidden}
.phead::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--pc);opacity:.3}
.phead.col-active::before{opacity:1}
.phead .pn{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14.5px;font-weight:700;color:var(--pc)}
.phead .pt{font-size:12px;color:var(--muted)}

.lab{display:flex;align-items:center;gap:6px;padding:0 8px 0 10px}
.lab .lname{font-size:13px;font-weight:500;line-height:1.05}

.val{display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:600;color:var(--chalk);
  font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;scroll-snap-align:start}
.val .v{position:relative;z-index:1}
.val.empty::after{content:"";position:absolute;left:32%;right:32%;bottom:32%;height:1px;background:var(--faint);opacity:.55}

.bcell{display:flex;align-items:center;justify-content:center;background-color:var(--band);scroll-snap-align:start;font-size:12.5px;color:var(--muted)}

.totlab{bottom:0;z-index:6;border-top:2px solid var(--rule-2)}
.totlab .lname{font-size:13px;font-weight:700}
.tot{position:sticky;bottom:0;z-index:4;display:flex;align-items:center;justify-content:center;border-top:2px solid var(--rule-2);font-size:22px;font-weight:700;color:var(--pc)}

.dots{flex:none;display:flex;align-items:center;justify-content:center;gap:6px;padding:8px 0 max(8px,env(safe-area-inset-bottom));background:var(--bg)}
.dots i{width:18px;height:3px;border-radius:2px;background:var(--pc);opacity:.22;transition:opacity .15s ease}
.dots i.on{opacity:1}

/* --- les trois seuls ajouts au système du Yam's --- */

/* 1. En-tête x01 : le score restant se lit à trois mètres de la cible. */
.phead.x01{gap:2px;padding-top:9px}
.phead.x01 .pn{font-size:13px}
.phead .px{font-size:clamp(30px,9vw,40px);font-weight:700;line-height:1;color:var(--chalk);
  font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.phead .pf{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11.5px;color:var(--muted)}
/* Une volée x01 porte deux informations : ce qui vient d'être marqué, ce qui reste. */
.val.two{flex-direction:column;gap:1px;line-height:1.05}
.val .rest{font-size:11px;font-weight:500;color:var(--muted)}
.val.bust .v{font-size:13px;font-weight:600;letter-spacing:.06em;color:var(--muted)}

/* 2. Marques de cricket : dessinées, jamais typographiées — le rendu des
      caractères varie trop d'un appareil à l'autre. Cible fermée par tous :
      elle ne rapporte plus rien, la ligne s'efface. */
.cell.shut{opacity:.4}
.lab.shut .lname{text-decoration:line-through}

/* 3. Barre d'actions de partie : le Yam's n'en a pas, on y tape dans les cases. */
.acts{display:flex;flex-direction:column;gap:8px}
.screen.game .dots{padding-bottom:6px}

/* ============================================================
   RÉSUMÉ
   ============================================================ */
.sum{padding:16px 14px 20px}
.sum-h{font-size:22px;font-weight:700;margin-bottom:2px}
.sum-s{font-size:13.5px;color:var(--muted);margin-bottom:18px}
.rank{display:flex;gap:12px;padding:14px 0;border-top:1px solid var(--rule)}
.rank:last-of-type{border-bottom:1px solid var(--rule)}
.rank-n{flex:none;width:26px;font-size:15px;font-weight:700;color:var(--muted);padding-top:2px}
.rank-b{flex:none;width:3px;border-radius:2px;background:var(--pc)}
.rank-m{flex:1;min-width:0}
.rank-t{display:flex;align-items:baseline;gap:8px}
.rank-t .nm{font-size:17px;font-weight:700;color:var(--pc);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank-t .sc{margin-left:auto;font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.rank-d{margin-top:4px;font-size:12.5px;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.tag{font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:20px;border:1px solid var(--rule-2);color:var(--chalk)}
.tag.gold{border-color:var(--chalk)}
.sum-a{display:flex;flex-direction:column;gap:10px;margin-top:22px}

/* ============================================================
   FEUILLES ET DIALOGUES
   ============================================================ */
#modal{position:fixed;inset:0;z-index:100;display:none}
#modal.open{display:block}
.scrim{position:absolute;inset:0;background:rgba(6,8,10,.66)}
.sheetp{
  position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;max-height:88%;
  background:var(--surface);border-top:1px solid var(--rule-2);border-radius:16px 16px 0 0;
  padding-bottom:max(14px,env(safe-area-inset-bottom));
  padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);
  transform:translateY(calc(var(--drag,0px) - var(--kb,0px)));
  animation:sheetUp .2s cubic-bezier(.2,.8,.3,1);
}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.grab{width:38px;height:4px;border-radius:2px;background:var(--rule-2);margin:8px auto 2px}
.mhead{flex:none;padding:0 6px 8px}
.mhead-row{display:flex;align-items:flex-start;gap:8px;padding:4px 4px 0 12px}
.mtitle{font-size:18px;font-weight:700}
.msub{font-size:13px;color:var(--muted);margin-top:2px}
.mbody{overflow-y:auto;overscroll-behavior:contain;padding:4px 14px 0}
.mactions{flex:none;display:flex;gap:10px;padding:12px 14px 0;margin-top:12px;border-top:1px solid var(--rule)}
.mactions .btn{flex:1}
.lock{font-size:14px;color:var(--muted);line-height:1.5;padding:2px 0 14px}

.pills{display:grid;gap:8px;padding-bottom:4px}
.pills.long{max-height:min(44vh,320px);overflow-y:auto;overscroll-behavior:contain;padding-right:2px}
.pill{display:flex;align-items:center;justify-content:center;min-height:56px;border-radius:12px;background:var(--raise);font-size:19px;font-weight:600;color:var(--chalk);border:1px solid transparent}
.pills.long .pill{min-height:48px;font-size:17px}
.pill:active{filter:brightness(1.3)}
.pill.sel{background:var(--chalk);color:var(--bg)}
.pill:disabled{opacity:.35}
.strike{position:relative;color:var(--muted);background:transparent;border:1px dashed var(--rule-2);font-size:15px}
.strike.sel{background:var(--raise);color:var(--chalk);border-style:solid;border-color:var(--chalk)}

.dlg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(340px,calc(100% - 36px));background:var(--surface);border:1px solid var(--rule-2);border-radius:14px;padding:18px 18px 14px}
.dlg h3{font-size:17px;font-weight:700;margin-bottom:8px}
.dlg p{font-size:14px;color:var(--muted);line-height:1.5}
.dlg-a{display:flex;gap:10px;margin-top:18px}
.dlg-a .btn{flex:1}

.field{display:block;width:100%;min-height:52px;padding:0 14px;border-radius:12px;background:var(--raise);border:1px solid var(--rule-2);color:var(--chalk);font-size:17px}
.field:focus{border-color:var(--chalk)}
.warn{font-size:12.5px;color:var(--muted);padding:8px 2px 0;min-height:20px}
.swatches{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;padding:14px 0 2px}
.sw{height:48px;border-radius:12px;border:2px solid transparent;background:var(--raise);display:flex;align-items:center;justify-content:center}
.sw i{width:24px;height:24px;border-radius:50%;background:var(--pc)}
.sw.sel{border-color:var(--chalk)}
.menu{display:flex;flex-direction:column;padding-bottom:6px}
.menu button{display:flex;align-items:center;min-height:54px;padding:0 4px;font-size:16px;font-weight:600;text-align:left;border-bottom:1px solid var(--rule)}
.menu button:last-child{border-bottom:0}
.menu .dang{color:var(--danger)}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:200;
  max-width:82%;padding:11px 15px;border-radius:11px;background:var(--raise);border:1px solid var(--rule-2);
  font-size:13.5px;font-weight:500;text-align:center;animation:toastIn .16s ease-out}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}

/* ============================================================
   RENCONTRE
   ============================================================ */
.flash{position:fixed;inset:0;z-index:300;display:grid;place-items:center;background:#0B0E11;animation:flashPop .1s ease-out;
  padding:20px calc(20px + env(safe-area-inset-right)) calc(20px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left))}
.flash b{display:block;text-align:center;font-size:clamp(52px,19vw,150px);font-weight:800;letter-spacing:-.035em;line-height:.92;transform:rotate(-4deg);color:var(--chalk)}
.flash.bad b{color:var(--danger)}
@keyframes flashPop{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<script>
"use strict";
/* ============================================================
   CONSTANTES / RÈGLES
   ============================================================ */

const SCHEMA_VERSION = 1;
const PREFIX = "flechettes:";
const K = {
  schema:    PREFIX + "schemaVersion",
  players:   PREFIX + "players",
  selection: PREFIX + "selection",
  settings:  PREFIX + "settings",
  game:      PREFIX + "currentGame",
  history:   PREFIX + "history"
};

const MAX_PLAYERS = 8;
const MAX_NAME = 14;
const HISTORY_CAP = 200;          // borne la taille du stockage, sans écran d'historique détaillé
const DARTS_PER_TURN = 3;

/* Palette fixe : 10 teintes, toutes ≥ 4,5:1 sur le fond ardoise. */
const PALETTE = ["#E5564B","#EE8B3F","#E7BC3E","#A8CC52","#3FC08D","#3FBBD0","#5B9BF0","#A78BFA","#E86AB8","#C9AE8C"];

/* Suite d'entiers, bornes comprises. */
function seq(from, to, step){ const a = []; for (let v = from; v <= to; v += (step || 1)) a.push(v); return a; }

/* Les quatre modes. `kind` porte la règle, `id` la clé stockée. */
const MODES = [
  { id:"501",     label:"501",     kind:"x01",     start:501 },
  { id:"301",     label:"301",     kind:"x01",     start:301 },
  { id:"cricket", label:"Cricket", kind:"cricket" },
  { id:"horloge", label:"Horloge", kind:"clock"   }
];
const MODE_BY_ID = {};
MODES.forEach(m => { MODE_BY_ID[m.id] = m; });
function modeOf(id){ return MODE_BY_ID[id] || MODES[0]; }
function kindOf(id){ return modeOf(id).kind; }

/* Cricket : les 7 cibles, la bulle valant 25. L'ordre est celui de la grille. */
const CRICKET_TARGETS = [20, 19, 18, 17, 16, 15, 25];
const CRICKET_LABELS  = { 20:"20", 19:"19", 18:"18", 17:"17", 16:"16", 15:"15", 25:"Bulle" };
const MARKS_TO_CLOSE = 3;

/* Horloge : 1 à 20, puis la demi-bulle, puis la bulle centrale. */
const CLOCK_SEQ = seq(1, 20).concat([25, 50]);

/* --- modèle de la cible ---
   Une fléchette est {s, m} : s ∈ 1..20 avec m ∈ 1,2,3 ; ou 25, ou 50, ou 0
   pour un raté. Une ratée vaut zéro mais compte comme lancée. */
function dartValue(d){
  if (!d || d.s === 0) return 0;
  if (d.s === 25 || d.s === 50) return d.s;
  return d.s * d.m;
}
/* La bulle centrale compte comme un double 25 : elle ferme un double out. */
function dartIsDouble(d){
  if (!d) return false;
  if (d.s === 50) return true;
  return d.s >= 1 && d.s <= 20 && d.m === 2;
}
function dartLabel(d){
  if (!d || d.s === 0) return "—";
  if (d.s === 25 || d.s === 50) return String(d.s);
  return (d.m === 2 ? "D" : d.m === 3 ? "T" : "") + d.s;
}
/* Cricket : demi-bulle = 1 marque, bulle centrale = 2. */
function dartMarks(d){
  if (!d || d.s === 0) return 0;
  if (d.s === 50) return 2;
  if (d.s === 25) return 1;
  return d.m;
}
function dartTarget(d){
  if (!d || d.s === 0) return 0;
  if (d.s === 25 || d.s === 50) return 25;
  return CRICKET_TARGETS.indexOf(d.s) >= 0 ? d.s : 0;
}
/* Horloge : n'importe quel multiplicateur valide le numéro. Une fléchette
   dans la bulle centrale est aussi dans la bulle : elle valide le 25. */
function clockHit(d, target){
  if (!d || d.s === 0) return false;
  if (target === 50) return d.s === 50;
  if (target === 25) return d.s === 25 || d.s === 50;
  return d.s === target;
}

function randInt(a, b){ return a + Math.floor(Math.random() * (b - a)); }
function hexToRgb(hex){
  const m = /^#([0-9a-f]{6})$/i.exec(hex || "");
  const n = m ? parseInt(m[1], 16) : 0;
  return (n >> 16) + " " + ((n >> 8) & 255) + " " + (n & 255);
}
function h(tag, props){
  const e = document.createElement(tag);
  if (props) for (const k in props){
    const v = props[k];
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") e.className = v;
    else if (k === "text") e.textContent = v;
    else if (k === "html") e.innerHTML = v;
    else if (k.slice(0, 2) === "on") e.addEventListener(k.slice(2), v);
    else if (k === "style"){ for (const p in v) e.style.setProperty(p, v[p]); }
    else if (v === true) e.setAttribute(k, "");
    else e.setAttribute(k, v);
  }
  for (let i = 2; i < arguments.length; i++){
    const kid = arguments[i];
    if (kid === null || kid === undefined || kid === false) continue;
    if (Array.isArray(kid)) kid.forEach(c => { if (c) e.append(c); });
    else e.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return e;
}

/* ============================================================
   STOCKAGE
   Toutes les clés sont préfixées `flechettes:` — l'origine est partagée
   avec le Yam's. Chaque lecture est isolée : une donnée cassée retombe
   sur son défaut.
   ============================================================ */

const memStore = new Map();     // repli quand localStorage est absent ou plein (mode privé iOS)
let lsAvailable = (function(){
  try { localStorage.setItem(PREFIX + "__probe", "1"); localStorage.removeItem(PREFIX + "__probe"); return true; }
  catch (e){ return false; }
})();

function rawGet(key){
  if (lsAvailable){
    try { const v = localStorage.getItem(key); if (v !== null) return v; }
    catch (e){ lsAvailable = false; }
  }
  return memStore.has(key) ? memStore.get(key) : null;
}
function rawSet(key, value){
  memStore.set(key, value);
  if (!lsAvailable) return;
  try { localStorage.setItem(key, value); }
  catch (e){ /* quota atteint : la session continue en mémoire */ }
}
function rawDel(key){
  memStore.delete(key);
  if (!lsAvailable) return;
  try { localStorage.removeItem(key); } catch (e){}
}
function wipeOurKeys(){
  memStore.clear();
  if (!lsAvailable) return;
  try {
    const doomed = [];
    for (let i = 0; i < localStorage.length; i++){
      const k = localStorage.key(i);
      if (k && k.indexOf(PREFIX) === 0) doomed.push(k);
    }
    doomed.forEach(k => localStorage.removeItem(k));
  } catch (e){}
}
/* Lit, parse, valide. `sanitize` renvoie une valeur propre, ou null si irrécupérable. */
function load(key, sanitize, fallback){
  try {
    const raw = rawGet(key);
    if (raw === null) return fallback();
    const parsed = JSON.parse(raw);
    const clean = sanitize(parsed);
    return clean === null || clean === undefined ? fallback() : clean;
  } catch (e){ return fallback(); }
}
function store(key, value){ try { rawSet(key, JSON.stringify(value)); } catch (e){} }

const isNum = v => typeof v === "number" && isFinite(v);
const isStr = v => typeof v === "string";

function sanPlayers(v){
  if (!Array.isArray(v)) return null;
  const out = [], seen = new Set();
  for (const p of v){
    if (!p || typeof p !== "object") continue;
    if (!isStr(p.id) || !p.id || seen.has(p.id)) continue;
    const name = isStr(p.name) ? p.name.trim().slice(0, MAX_NAME) : "";
    if (!name) continue;
    seen.add(p.id);
    out.push({
      id: p.id,
      name: name,
      color: (isStr(p.color) && PALETTE.indexOf(p.color) >= 0) ? p.color : PALETTE[out.length % PALETTE.length],
      createdAt: isNum(p.createdAt) ? p.createdAt : Date.now()
    });
  }
  return out;
}
function sanSelection(v){
  if (!Array.isArray(v)) return null;
  const out = [];
  for (const id of v) if (isStr(id) && out.indexOf(id) < 0) out.push(id);
  return out.slice(0, MAX_PLAYERS);
}
function sanSettings(v){
  if (!v || typeof v !== "object") return null;
  const cut = v.cutThroat === true;
  return {
    mode:      (isStr(v.mode) && MODE_BY_ID[v.mode]) ? v.mode : "501",
    doubleIn:  v.doubleIn === true,
    doubleOut: v.doubleOut === true,
    points:    cut ? true : v.points !== false,     // cut throat force le décompte
    cutThroat: cut,
    meet:      v.meet === true
  };
}
function defaultSettings(){
  return { mode:"501", doubleIn:false, doubleOut:false, points:true, cutThroat:false, meet:false };
}
function sanSnapshot(p, i){
  if (!p || typeof p !== "object" || !isStr(p.id) || !p.id) return null;
  const name = isStr(p.name) ? p.name.trim().slice(0, MAX_NAME) : "";
  if (!name) return null;
  return { id:p.id, name:name, color:(isStr(p.color) && PALETTE.indexOf(p.color) >= 0) ? p.color : PALETTE[i % PALETTE.length] };
}
function sanDart(d){
  if (!d || typeof d !== "object" || !isNum(d.s)) return null;
  const s = Math.floor(d.s);
  if (s === 0) return { s:0, m:1 };
  if (s === 25 || s === 50) return { s:s, m:1 };
  const m = Math.floor(d.m);
  if (s >= 1 && s <= 20 && (m === 1 || m === 2 || m === 3)) return { s:s, m:m };
  return null;
}
/* Une volée : soit des fléchettes, soit un total direct. Le `p` doit suivre
   l'ordre circulaire, sinon la partie est tronquée là où elle diverge. */
function sanVolleys(v, players){
  if (!Array.isArray(v)) return [];
  const out = [], n = players.length;
  for (const raw of v){
    if (!raw || typeof raw !== "object") break;
    if (raw.p !== players[out.length % n].id) break;
    const darts = [];
    if (Array.isArray(raw.darts)){
      for (const d of raw.darts.slice(0, DARTS_PER_TURN)){
        const c = sanDart(d);
        if (c) darts.push(c);
      }
    }
    const total = isNum(raw.total) ? Math.round(raw.total) : null;
    if (!darts.length && total === null) break;
    out.push({ p:raw.p, darts:darts, total:darts.length ? null : total, dbl:raw.dbl === true });
  }
  return out;
}
function sanOptions(mode, v){
  const o = (v && typeof v === "object") ? v : {};
  const kind = kindOf(mode);
  if (kind === "x01") return { doubleIn:o.doubleIn === true, doubleOut:o.doubleOut === true };
  if (kind === "cricket"){
    const cut = o.cutThroat === true;
    return { points: cut ? true : o.points !== false, cutThroat:cut };
  }
  return {};
}
function sanGame(v){
  if (!v || typeof v !== "object" || !isStr(v.id) || !Array.isArray(v.players)) return null;
  if (!isStr(v.mode) || !MODE_BY_ID[v.mode]) return null;
  const players = [], seen = new Set();
  for (let i = 0; i < v.players.length; i++){
    const p = sanSnapshot(v.players[i], i);
    if (p && !seen.has(p.id)){ seen.add(p.id); players.push(p); }
  }
  if (players.length < 1 || players.length > MAX_PLAYERS) return null;
  return {
    id: v.id,
    startedAt: isNum(v.startedAt) ? v.startedAt : Date.now(),
    mode: v.mode,
    options: sanOptions(v.mode, v.options),
    meet: v.meet === true,
    players: players,
    volleys: sanVolleys(v.volleys, players)
  };
}
function sanStats(v){
  const o = (v && typeof v === "object") ? v : {};
  const out = {};
  for (const k in o) if (isNum(o[k])) out[k] = o[k];
  return out;
}
function sanHistory(v){
  if (!Array.isArray(v)) return null;
  const out = [];
  for (const e of v){
    if (!e || typeof e !== "object" || !isStr(e.id) || !Array.isArray(e.results)) continue;
    if (!isStr(e.mode) || !MODE_BY_ID[e.mode]) continue;
    const results = [];
    for (let i = 0; i < e.results.length; i++){
      const r = e.results[i];
      if (!r || typeof r !== "object" || !isStr(r.playerId)) continue;
      results.push({
        playerId: r.playerId,
        name: isStr(r.name) ? r.name.slice(0, MAX_NAME) : "?",
        color: (isStr(r.color) && PALETTE.indexOf(r.color) >= 0) ? r.color : PALETTE[i % PALETTE.length],
        rank: isNum(r.rank) ? Math.round(r.rank) : i + 1,
        value: isNum(r.value) ? Math.round(r.value) : 0,
        detail: isStr(r.detail) ? r.detail : "",
        tags: Array.isArray(r.tags) ? r.tags.filter(t => t && isStr(t.t)).map(t => ({ t:t.t.slice(0, 60), gold:t.gold === true })) : [],
        stats: sanStats(r.stats)
      });
    }
    if (!results.length) continue;
    out.push({
      id: e.id,
      endedAt: isNum(e.endedAt) ? e.endedAt : 0,
      mode: e.mode,
      options: sanOptions(e.mode, e.options),
      meets: isNum(e.meets) ? Math.max(0, Math.round(e.meets)) : 0,
      results: results,
      winnerIds: Array.isArray(e.winnerIds) ? e.winnerIds.filter(isStr) : []
    });
    if (out.length >= HISTORY_CAP) break;
  }
  return out;
}

/* ============================================================
   ÉTAT
   Un seul objet en mémoire. Toute mutation : persister puis rendre.
   La partie ne garde que ses volées : aucun score n'est stocké.
   ============================================================ */

const state = {
  screen: "home",      // "home" | "game" | "summary"
  players: [],
  selection: [],
  settings: defaultSettings(),
  game: null,
  history: [],
  summary: null        // résumé de fin de partie, non persisté
};

function loadAll(){
  const v = load(K.schema, x => (isNum(x) ? x : null), () => null);
  if (v !== SCHEMA_VERSION){
    wipeOurKeys();                       // version inconnue : on repart propre, pas de migration
    store(K.schema, SCHEMA_VERSION);
  }
  state.players   = load(K.players,   sanPlayers,   () => []);
  state.selection = load(K.selection, sanSelection, () => []);
  state.settings  = load(K.settings,  sanSettings,  defaultSettings);
  state.game      = load(K.game,      sanGame,      () => null);
  state.history   = load(K.history,   sanHistory,   () => []);
  pruneSelection();
}
/* La sélection ne référence que des joueurs existants. */
function pruneSelection(){
  const ids = new Set(state.players.map(p => p.id));
  const kept = state.selection.filter(id => ids.has(id));
  if (kept.length !== state.selection.length){ state.selection = kept; saveSelection(); }
}
function findPlayer(id){ return state.players.find(p => p.id === id) || null; }

/* ============================================================
   MOTEUR DE RÈGLES
   Une fonction pure rejoue la partie depuis ses volées. Rien n'est muté,
   rien n'est stocké : annuler, c'est retirer la dernière volée et
   recalculer. Aucune désynchronisation n'est possible.
   ============================================================ */

function blankPlayer(p, i, mode, options){
  const kind = kindOf(mode);
  const st = {
    id:p.id, name:p.name, color:p.color, index:i,
    darts:0, volleys:0, rows:[],
    score: kind === "x01" ? modeOf(mode).start : 0,
    open: !(kind === "x01" && options.doubleIn),   // double in : le joueur entre sur un double
    scored:0, bestVolley:0, ton80:0, checkout:0, busts:0,
    marks:{}, closed:0, points:0, totalMarks:0, bestMarks:0, nineMarks:0,
    prog:0, bestNumbers:0,
    qualified:false, qualifiedAt:-1
  };
  CRICKET_TARGETS.forEach(t => { st.marks[t] = 0; });
  return st;
}

/* --- x01 : une volée, résolue d'un bloc --- */
function applyX01(P, v, options, start){
  let s = start, open = P.open, thrown = 0, bust = false, won = false;

  if (v.total !== null && v.total !== undefined){
    /* Saisie au total : on ne connaît pas le détail, on compte trois fléchettes. */
    thrown = DARTS_PER_TURN;
    if (!open){
      /* Un total direct ne peut pas ouvrir un double in : la volée ne compte pas. */
      P.rows.push({ pts:0, left:s, bust:false, total:true, idle:true });
      P.darts += thrown;
      return { bust:false, won:false };
    }
    const ns = s - v.total;
    if (ns < 0 || (options.doubleOut && ns === 1)) bust = true;
    else if (ns === 0){
      if (!options.doubleOut || v.dbl){ s = 0; won = true; }
      else bust = true;
    }
    else s = ns;
  } else {
    for (let i = 0; i < v.darts.length; i++){
      const d = v.darts[i];
      if (!d) continue;
      thrown++;
      if (!open){
        if (!dartIsDouble(d)) continue;              // hors jeu tant que le double n'est pas fait
        open = true;                                 // et cette fléchette-là compte déjà
      }
      const ns = s - dartValue(d);
      if (ns < 0 || (options.doubleOut && ns === 1)){ bust = true; break; }
      if (ns === 0){
        if (!options.doubleOut || dartIsDouble(d)){ s = 0; won = true; break; }
        bust = true; break;                          // zéro atteint sans double
      }
      s = ns;
    }
  }

  if (bust){
    /* La volée entière est annulée : le score revient au début du tour,
       et l'ouverture faite dans cette volée avec elle. */
    P.rows.push({ pts:0, left:start, bust:true, total:v.total !== null && v.total !== undefined });
    P.busts++;
    P.darts += thrown;
    return { bust:true, won:false };
  }

  const pts = start - s;
  P.score = s;
  P.open = open;
  P.scored += pts;
  P.darts += thrown;
  if (pts > P.bestVolley) P.bestVolley = pts;
  if (pts === 180) P.ton80++;
  if (won) P.checkout = pts;
  P.rows.push({ pts:pts, left:s, bust:false, total:v.total !== null && v.total !== undefined });
  return { bust:false, won:won };
}

/* --- cricket : marques, puis points sur les cibles encore ouvertes --- */
function applyCricket(P, v, options, per, pi){
  let marks = 0;
  for (const d of v.darts){
    if (!d) continue;
    P.darts++;
    const t = dartTarget(d);
    if (!t) continue;                                // hors des 7 cibles : sans effet, sans pénalité
    const mk = dartMarks(d);
    marks += mk;
    const used = Math.min(mk, Math.max(0, MARKS_TO_CLOSE - P.marks[t]));
    P.marks[t] += used;
    const excess = mk - used;
    if (excess > 0 && options.points){
      /* Une cible fermée par tout le monde ne rapporte plus rien. */
      const owed = per.filter((x, i) => i !== pi && x.marks[t] < MARKS_TO_CLOSE);
      if (owed.length){
        if (options.cutThroat) owed.forEach(x => { x.points += excess * t; });
        else P.points += excess * t;
      }
    }
  }
  P.closed = CRICKET_TARGETS.filter(t => P.marks[t] >= MARKS_TO_CLOSE).length;
  P.totalMarks += marks;
  if (marks > P.bestMarks) P.bestMarks = marks;
  if (marks === 9) P.nineMarks++;
  P.rows.push({ marks:marks });
}

/* --- horloge : le numéro validé fait viser le suivant dès la fléchette d'après --- */
function applyClock(P, v){
  let gained = 0;
  for (const d of v.darts){
    if (!d) continue;
    P.darts++;
    if (P.prog >= CLOCK_SEQ.length) continue;
    if (clockHit(d, CLOCK_SEQ[P.prog])){ P.prog++; gained++; }
  }
  if (gained > P.bestNumbers) P.bestNumbers = gained;
  P.rows.push({ gained:gained });
}

/* Condition de victoire, évaluée à la fin de la volée du joueur qui vient de lancer. */
function hasWon(kind, options, P, per){
  if (kind === "x01") return P.score === 0;
  if (kind === "clock") return P.prog >= CLOCK_SEQ.length;
  if (P.closed < CRICKET_TARGETS.length) return false;
  if (!options.points) return true;
  /* Fermer les 7 ne suffit pas : il faut aussi être devant. */
  if (options.cutThroat) return per.every(x => x === P || P.points <= x.points);
  return per.every(x => x === P || P.points >= x.points);
}

/* Valeur comparée par la rencontre, selon le mode. */
function meetValue(kind, options, P){
  if (kind === "x01") return P.score;
  if (kind === "clock") return P.prog;
  return options.points ? P.points : P.totalMarks;
}

function computeState(mode, options, players, volleys){
  const kind = kindOf(mode);
  const opt = options || {};
  const n = players.length;
  const per = players.map((p, i) => blankPlayer(p, i, mode, opt));
  const vols = volleys || [];

  let firstWin = -1, endAt = Infinity, played = 0;
  let lastBust = false;

  for (let vi = 0; vi < vols.length && vi < endAt; vi++){
    const P = per[vi % n];                          // l'ordre de jeu est strictement circulaire
    const v = vols[vi];
    lastBust = false;
    if (kind === "x01") lastBust = applyX01(P, v, opt, P.score).bust;
    else if (kind === "cricket") applyCricket(P, v, opt, per, vi % n);
    else applyClock(P, v);
    P.volleys++;
    played++;
    if (!P.qualified && hasWon(kind, opt, P, per)){
      P.qualified = true;
      P.qualifiedAt = vi;
      if (firstWin < 0){
        firstWin = vi;
        /* Fin de manche : le tour en cours se termine, chacun aura joué autant. */
        endAt = (Math.floor(vi / n) + 1) * n;
      }
    }
  }

  const over = played >= endAt;
  const lastTurn = firstWin >= 0 && !over;
  const turnIndex = over ? -1 : played % n;
  const round = Math.floor(played / n) + (over ? 0 : 1);

  /* Plusieurs qualifiés dans le même tour : on départage selon le mode. */
  const qualified = per.filter(p => p.qualified);
  let winners = qualified;
  if (qualified.length > 1){
    let key;
    if (kind === "x01" || kind === "clock") key = p => p.darts;
    else if (opt.points && opt.cutThroat) key = p => p.points;
    else if (opt.points) key = p => -p.points;
    else key = () => 0;
    const best = Math.min.apply(null, qualified.map(key));
    winners = qualified.filter(p => key(p) === best);
  }
  const winSet = new Set(winners.map(p => p.id));

  return {
    kind: kind, mode: mode, options: opt,
    perPlayer: per,
    turnIndex: turnIndex,
    round: round,
    lastTurn: lastTurn,
    over: over,
    lastBust: lastBust,
    winnerIds: over ? winners.map(p => p.id) : [],
    ranking: rankPlayers(kind, opt, per, winSet),
    meets: meetGroups(kind, opt, per)
  };
}

/* Classement final de tous les joueurs. Les ex æquo partagent leur rang. */
function rankPlayers(kind, opt, per, winSet){
  const keyOf = function(p){
    const w = winSet.has(p.id) ? 0 : 1;
    if (kind === "x01") return [w, p.score, -avg3(p)];
    if (kind === "clock") return [w, -p.prog, p.darts];
    if (!opt.points) return [w, -p.closed, -p.totalMarks];
    return [w, -p.closed, opt.cutThroat ? p.points : -p.points];
  };
  const rows = per.map(p => ({ p:p, key:keyOf(p) }));
  rows.sort(function(a, b){
    for (let i = 0; i < a.key.length; i++) if (a.key[i] !== b.key[i]) return a.key[i] - b.key[i];
    return a.p.index - b.p.index;
  });
  return rows.map(function(r, i){
    let rank = i + 1;
    const sig = r.key.join("|");
    for (let j = 0; j < i; j++) if (rows[j].key.join("|") === sig){ rank = j + 1; break; }
    return { player:r.p, rank:rank, won:winSet.has(r.p.id) };
  });
}

/* Moyenne à trois fléchettes. Une volée saisie au total y entre pour trois. */
function avg3(p){ return p.darts ? (p.scored / p.darts) * DARTS_PER_TURN : 0; }

/* Groupes de joueurs à égalité. Un joueur qui n'a pas encore lancé n'en est
   jamais : au coup d'envoi, tout le monde est à 501. */
function meetGroups(kind, opt, per){
  const by = new Map();
  per.forEach(function(p){
    if (!p.volleys) return;
    const v = meetValue(kind, opt, p);
    if (!by.has(v)) by.set(v, []);
    by.get(v).push(p.id);
  });
  const groups = [];
  by.forEach(function(ids, v){ if (ids.length > 1) groups.push({ value:v, ids:ids.slice().sort() }); });
  groups.sort((a, b) => a.value - b.value);
  return { groups:groups, sig:groups.map(g => g.ids.join(",") + "@" + g.value).join(";") };
}

/* ============================================================
   FINISH
   Recherche exhaustive des chemins de sortie. Aucune table en dur :
   les nombres impossibles tombent d'eux-mêmes.
   ============================================================ */

/* Les 62 lancers d'une cible : S1..S20, D1..D20, T1..T20, 25, 50. */
const THROWS = (function(){
  const t = [];
  for (let s = 1; s <= 20; s++) t.push({ label:String(s), v:s, dbl:false });
  for (let s = 1; s <= 20; s++) t.push({ label:"D" + s, v:s * 2, dbl:true });
  for (let s = 1; s <= 20; s++) t.push({ label:"T" + s, v:s * 3, dbl:false });
  t.push({ label:"25", v:25, dbl:false });
  t.push({ label:"50", v:50, dbl:true });          // la bulle centrale compte comme un double
  return t;
})();

const FIRST_PREF = ["T20", "T19", "T18"];
const LAST_PREF  = ["D20", "D16", "D8", "D4", "D2", "D10", "D12"];
const finishCache = new Map();

/* Heuristique : la première fléchette d'abord, puis le double de sortie,
   puis le refus d'un reliquat impair. */
function finishRating(path, score, doubleOut){
  let r = 0;
  const f = FIRST_PREF.indexOf(path[0].label);
  if (f >= 0) r += (FIRST_PREF.length - f) * 100;
  const l = LAST_PREF.indexOf(path[path.length - 1].label);
  if (l >= 0) r += (LAST_PREF.length - l) * 10;
  if (doubleOut && path.length > 1 && (score - path[0].v) % 2 === 0) r += 5;
  return r;
}

function finish(score, dartsLeft, doubleOut){
  if (!isNum(score) || score <= 0 || dartsLeft < 1) return null;
  const key = score + ":" + dartsLeft + ":" + (doubleOut ? 1 : 0);
  if (finishCache.has(key)) return finishCache.get(key);

  let best = null, bestRating = -1;
  const path = [];
  const walk = function(rest, depth, len){
    if (depth === len - 1){
      for (const t of THROWS){
        if (t.v !== rest) continue;
        if (doubleOut && !t.dbl) continue;
        path.push(t);
        const rating = finishRating(path, score, doubleOut);
        if (rating > bestRating){ bestRating = rating; best = path.map(x => x.label); }
        path.pop();
      }
      return;
    }
    for (const t of THROWS){
      /* Il doit rester de quoi finir : au moins un double en double out. */
      if (rest - t.v < (doubleOut ? 2 : 1)) continue;
      path.push(t);
      walk(rest - t.v, depth + 1, len);
      path.pop();
    }
  };
  for (let len = 1; len <= dartsLeft; len++){
    walk(score, 0, len);
    if (best) break;                                 // le moins de fléchettes possible
  }
  finishCache.set(key, best);
  return best;
}
function finishText(score, dartsLeft, doubleOut){
  const f = finish(score, dartsLeft, doubleOut);
  return f ? f.join(" · ") : "";
}

function brandBar(right){
  return h("header", { class:"bar" }, h("div", { class:"bar-in" },
    h("div", { class:"brand" }, h("span", { html:boardSVG(22) }), h("span", { text:"Fléchettes" })),
    right ? h("div", { class:"grow" }) : null, right || null));

/* Options d'une partie, dérivées des réglages d'accueil. */
function optionsFor(mode, s){
  const kind = kindOf(mode);
  if (kind === "x01") return { doubleIn:!!s.doubleIn, doubleOut:!!s.doubleOut };
  if (kind === "cricket") return { points: s.cutThroat ? true : !!s.points, cutThroat:!!s.cutThroat };
  return {};
}
/* La rencontre n'a pas de sens en cut throat : les scores y montent tout seuls. */
function meetAllowed(mode, s){ return !(kindOf(mode) === "cricket" && s.cutThroat); }

function modeTag(mode, options){
  const parts = [modeOf(mode).label];
  if (kindOf(mode) === "x01"){
    if (options.doubleIn) parts.push("double in");
    if (options.doubleOut) parts.push("double out");
  } else if (kindOf(mode) === "cricket"){
    if (options.cutThroat) parts.push("cut throat");
    else if (!options.points) parts.push("sans points");
  }
  return parts.join(" · ");
}
/* Où en est la partie en cours, en une poignée de chiffres. */
function liveLine(g){
  const cs = computeState(g.mode, g.options, g.players, g.volleys);
  const vals = cs.perPlayer.map(function(P){
    if (cs.kind === "x01") return String(P.score);
    if (cs.kind === "clock") return String(P.prog);
    return g.options.points ? String(P.points) : P.closed + "/7";
  });
  return vals.join(" / ");
}

      h("button", { class:"prow-main", "aria-pressed": on ? "true" : "false",
                    "aria-label": p.name + (on ? ", sélectionné en position " + (rank + 1) : ", non sélectionné"),
                    onclick:function(){ toggleSelection(p.id); } },
        h("span", { class:"swatch" }),
        h("span", { class:"pname", text:p.name }),
        on ? h("span", { class:"badge num", text:String(rank + 1) }) : null),
      h("button", { class:"prow-more", "aria-label":"Options pour " + p.name, onclick:function(){ openPlayerMenu(p.id); } }, icon(IC_MORE, 20))));
  });
  secPlayers.append(list);

  const secGame = h("div", { class:"sec" }, h("div", { class:"shead" }, h("h2", { text:"Partie" })));
  secGame.append(h("button", { class:"setting", style:{ width:"100%", "text-align":"left" }, onclick:openModePicker },
    h("span", { class:"grow" },

      h("span", { class:"setting-d", text:MODE_DESC[s.mode] })),
    h("span", { class:"pick" }, modeOf(s.mode).label, icon(IC_CHEV_R, 18))));

  optionRows(s).forEach(o => secGame.append(o));
  scroll.append(secGame);

  /* Rencontre : de l'ambiance, aucun effet. */
  const allowed = meetAllowed(s.mode, s);
  const meetBox = h("label", { class:"setting" + (allowed ? "" : " locked") },
    h("span", { class:"grow" },
      h("span", { class:"setting-t", text:"Rencontre" }),
      h("span", { class:"setting-d", text:"Signale à l'écran quand deux joueurs se retrouvent au même score, sans aucun effet sur la partie." })),
    h("input", { type:"checkbox", class:"sr", checked: allowed && s.meet === true, disabled: !allowed,
      onchange:function(e){ state.settings.meet = e.target.checked; saveSettings(); } }),
    h("span", { class:"switch", "aria-hidden":"true" }));
  if (!allowed) meetBox.addEventListener("click", function(){ toast("En cut throat les scores montent : l'égalité n'y veut rien dire."); });
  scroll.append(h("div", { class:"sec" }, meetBox));

  /* Lancer. */
  const n = state.selection.length;
  const footer = h("div", { class:"footer" });
  if (!n) footer.append(h("p", { class:"hint", text:"Choisir au moins un joueur dans la liste." }));
  footer.append(h("button", { class:"btn btn-primary btn-lg", disabled: n === 0, onclick:onLaunch },
    n ? "Lancer la partie · " + modeOf(s.mode).label + " · " + plural(n, "joueur", "joueurs") : "Lancer la partie"));

  appEl.replaceChildren(h("div", { class:"screen" }, brandBar(null), scroll, footer));
}

const MODE_DESC = {
  "501":     "Descendre de 501 à zéro pile.",
  "301":     "Le même, en plus court : on part de 301.",
  "cricket": "Fermer 20 à 15 et la bulle, trois marques chacune.",
  "horloge": "Valider 1 à 20, puis les deux bulles, dans l'ordre."
};
/* Les options changent avec le mode ; l'horloge n'en a aucune et la zone se replie. */
function optionRows(s){
  const kind = kindOf(s.mode);
  const row = function(key, title, desc, opts){
    const o = opts || {};
    const box = h("label", { class:"setting" + (o.locked ? " locked" : "") },
      h("span", { class:"grow" },
        h("span", { class:"setting-t", text:title }),
        h("span", { class:"setting-d", text:desc })),
      h("input", { type:"checkbox", class:"sr", checked: s[key] === true, disabled: !!o.locked,
        onchange:function(e){
          state.settings[key] = e.target.checked;
          if (key === "cutThroat" && e.target.checked) state.settings.points = true;
          saveSettings();
          if (o.rerender) renderHome();
        } }),
      h("span", { class:"switch", "aria-hidden":"true" }));
    if (o.locked && o.why) box.addEventListener("click", function(){ toast(o.why); });
    return box;
  };
  if (kind === "x01") return [
    row("doubleIn", "Double in", "Les fléchettes ne comptent qu'à partir du premier double."),
    row("doubleOut", "Double out", "La fléchette qui amène à zéro doit être un double.")
  ];
  if (kind === "cricket") return [
    row("points", "Avec points", "Les marques en trop sur une cible non fermée par tous rapportent.",
        { locked:s.cutThroat, why:"Le cut throat se joue forcément aux points." }),
    row("cutThroat", "Cut throat", "Les points vont aux adversaires : le plus bas score gagne.", { rerender:true })
  ];
  return [];
}
function shortDate(ts){
  try { return new Date(ts).toLocaleDateString("fr-FR", { day:"2-digit", month:"2-digit" }); }
  catch (e){ return ""; }
}
/* Le classement ne nomme que les joueurs encore présents au référentiel. */
function computeStats(){
  if (!state.history.length) return { games:0 };
  const byId = new Map();
  state.history.forEach(function(e){
    e.results.forEach(function(r){
      const cur = findPlayer(r.playerId);
      if (!cur) return;
      let x = byId.get(cur.id);
      if (!x){ x = { id:cur.id, name:cur.name, color:cur.color, games:0, wins:0 }; byId.set(cur.id, x); }
      x.games++;
      if (e.winnerIds.indexOf(cur.id) >= 0) x.wins++;
    });
  });
  return {
    games: state.history.length,
    board: Array.from(byId.values()).sort((a, b) => (b.wins - a.wins) || (b.games - a.games)),
    recent: state.history.slice(0, 5)
  };
}

let gridBuiltFor = null;   // id de la partie dont la grille est en place
let sheetEl = null;
let refs = null;           // références des cellules pour la mise à jour

function gameState(){
  const g = state.game;
  return computeState(g.mode, g.options, g.players, g.volleys);
}
function renderGame(){
  if (gridBuiltFor !== state.game.id || !sheetEl || !document.contains(sheetEl)) buildGame();
  updateGame();
}

function buildGame(){
  const g = state.game;
  const n = g.players.length;
  const kind = kindOf(g.mode);
  refs = { kind:kind, heads:{}, headScore:{}, headSub:{}, rows:[], marks:{}, points:{}, totals:{},
           clock:{}, clockLabs:[], markLabs:{}, cols:{}, dots:[] };
  g.players.forEach(function(p){ refs.cols[p.id] = []; refs.marks[p.id] = {}; refs.clock[p.id] = []; });

  const sheet = h("div", { class:"sheet", "aria-label":"Feuille de score" });
  /* Libellés figés + exactement deux colonnes de joueurs (une seule en solo,
     pour ne pas laisser un vide). */
  sheet.style.gridTemplateColumns =
    "var(--label-w) repeat(" + n + ", calc((100% - var(--label-w)) / " + Math.min(2, n) + "))";

  const corner = h("div", { class:"cell corner" },
    h("span", { class:"k", text: kind === "x01" ? "Volée" : "Tour" }),
    h("span", { class:"v num", text:"1" }));
  refs.corner = corner.lastChild;
  sheet.append(corner);

  g.players.forEach(function(p){
    const style = { "--pc":p.color, "--pc-rgb":hexToRgb(p.color) };
    let head;
    if (kind === "x01"){
      /* Le score restant est l'information principale : il se lit de loin. */
      const px = h("span", { class:"px", text:"0" });
      const pf = h("span", { class:"pf" });
      head = h("button", { class:"cell phead x01", style:style, "aria-label":"Colonne de " + p.name,
        onclick:function(){ onCellTap(p.id); } }, h("span", { class:"pn", text:p.name }), px, pf);
      refs.headScore[p.id] = px; refs.headSub[p.id] = pf;
    } else {
      const pt = h("span", { class:"pt num" });
      head = h("button", { class:"cell phead", style:style, "aria-label":"Colonne de " + p.name,
        onclick:function(){ onCellTap(p.id); } }, h("span", { class:"pn", text:p.name }), pt);
      refs.headSub[p.id] = pt;
    }
    refs.heads[p.id] = head;
    sheet.append(head);
  });
  refs.headEnd = sheet.lastChild;

  sheetEl = sheet;
  if (kind === "cricket") buildCricketRows(g);
  else if (kind === "clock") buildClockRows(g);
  else sheet.style.gridTemplateRows = "var(--head-h-x01) repeat(1, var(--row-h))";

  sheet.addEventListener("scroll", updateDots, { passive:true });

  const turn = h("div", { class:"turn" }, h("i", {}), h("span", {}));
  refs.turnBar = turn; refs.turnName = turn.lastChild;

  const dots = h("div", { class:"dots" });
  if (n > 2){
    g.players.forEach(function(p){
      const d = h("i", { style:{ "--pc":p.color } });
      refs.dots.push(d); dots.append(d);
    });
  }

  const act = h("button", { class:"btn btn-primary btn-lg", onclick:openVolleySheet });
  const undo = h("button", { class:"btn btn-ghost btn-lg", onclick:undoVolley }, "Annuler la dernière volée");
  refs.act = act; refs.undo = undo;

  appEl.replaceChildren(h("div", { class:"screen game" },
    h("header", { class:"bar" }, h("div", { class:"bar-in" },
      h("button", { class:"iconbtn", onclick:goHome }, icon(IC_CHEV_L, 20), "Accueil"),
      h("div", { class:"grow" }),
      h("button", { class:"iconbtn", "aria-label":"Options de la partie", onclick:openGameMenu }, icon(IC_MORE, 20)))),
    turn, sheet, dots,
    h("div", { class:"footer" }, h("div", { class:"acts" }, act, undo))));

  gridBuiltFor = g.id;
  requestAnimationFrame(function(){ ensureActiveVisible(false); updateDots(); });
}

function buildCricketRows(g){
  const withPoints = g.options.points;

  });
}

function buildClockRows(g){
  sheetEl.style.gridTemplateRows = "var(--head-h) repeat(" + CLOCK_SEQ.length + ",var(--row-h))";
  CLOCK_SEQ.forEach(function(num, i){
    const band = (i % 2) === 1;
    const lab = h("div", { class:"cell lab" + (band ? " band" : "") },
      h("span", { class:"lname num", text:String(num) }));
    refs.clockLabs.push(lab);
    sheetEl.append(lab);
    g.players.forEach(function(p){
      const c = mkCell(p, "val" + (band ? " band" : ""), onCellTap);
      refs.clock[p.id].push(c);
      sheetEl.append(c);
    });
  });
}

/* x01 : le nombre de lignes croît d'une volée à l'autre. On insère la
   nouvelle ligne en tête, on ne reconstruit jamais la grille. */
function x01SetRows(count){
  const g = state.game;
  let added = false;
  while (refs.rows.length < count){
    added = true;
    const frag = document.createDocumentFragment();
    const lab = h("div", { class:"cell lab" }, h("span", { class:"lname num" }));
    const cells = {};
    frag.append(lab);
    g.players.forEach(function(p){
      const c = mkCell(p, "val two", onCellTap);
      c.append(h("span", { class:"v" }), h("span", { class:"rest num" }));
      cells[p.id] = c;
      frag.append(c);
    });
    sheetEl.insertBefore(frag, refs.headEnd.nextSibling);
    refs.rows.unshift({ lab:lab, cells:cells });
  }
  while (refs.rows.length > count){
    const r = refs.rows.shift();
    r.lab.remove();
    for (const id in r.cells) r.cells[id].remove();
  }
  sheetEl.style.gridTemplateRows = "var(--head-h-x01) repeat(" + Math.max(1, count) + ", var(--row-h))";
  refs.rows.forEach(function(r, i){
    /* Le libellé suit le numéro de tour, la bande suit sa parité : une ligne
       posée garde son fond quand une nouvelle s'insère au-dessus d'elle. */
    const round = refs.rows.length - 1 - i;
    r.lab.firstChild.textContent = "T" + (round + 1);
    r.lab.classList.toggle("band", (round % 2) === 1);
    for (const id in r.cells) r.cells[id].classList.toggle("band", (round % 2) === 1);
  });
  /* La volée qui vient d'être jouée est la ligne du haut : on la montre. */
  if (added) sheetEl.scrollTop = 0;
  g.players.forEach(function(p){
    const arr = [refs.heads[p.id]];
    refs.rows.forEach(r => arr.push(r.cells[p.id]));
    refs.cols[p.id] = arr;
  });
}

function updateGame(){
  const g = state.game;
  if (!g || !refs) return;
  const cs = gameState();
  const active = cs.turnIndex >= 0 ? g.players[cs.turnIndex] : g.players[0];

  refs.corner.textContent = String(cs.round);
  refs.turnBar.style.setProperty("--pc", active.color);
  refs.turnBar.style.setProperty("--pc-rgb", hexToRgb(active.color));
  refs.turnName.textContent = "Au tour de " + active.name + (cs.lastTurn ? " · Dernier tour" : "");

  if (cs.kind === "x01") updateX01(g, cs);
  else if (cs.kind === "cricket") updateCricket(g, cs);
  else updateClock(g, cs);

  g.players.forEach(function(p){
    const on = p.id === active.id;
    (refs.cols[p.id] || []).forEach(function(el){ el.classList.toggle("col-active", on); });
  });

  refs.act.textContent = "Saisir la volée · " + active.name;
  refs.undo.disabled = g.volleys.length === 0;
  updateDots();
}

function updateX01(g, cs){
  /* Une ligne par tour commencé : celui qui se joue est déjà là, vide. */
  const n = g.players.length;
  const count = cs.over ? Math.ceil(g.volleys.length / n) : Math.floor(g.volleys.length / n) + 1;
  x01SetRows(Math.max(1, count));
  const dbl = !!g.options.doubleOut;
  g.players.forEach(function(p, pi){
    const P = cs.perPlayer[pi];
    refs.headScore[p.id].textContent = String(P.score);
    refs.headSub[p.id].textContent = !P.open ? "DOUBLE IN" : finishText(P.score, DARTS_PER_TURN, dbl);
    refs.rows.forEach(function(r, i){
      const row = P.rows[refs.rows.length - 1 - i];
      const cell = r.cells[p.id];
      const v = cell.firstChild, rest = cell.lastChild;
      cell.classList.toggle("empty", !row);
      cell.classList.toggle("bust", !!(row && row.bust));
      if (!row){ v.textContent = ""; rest.textContent = ""; return; }
      v.textContent = row.bust ? "BUST" : String(row.pts);
      rest.textContent = String(row.left);
      cell.setAttribute("aria-label", p.name + ", " + (row.bust ? "volée cassée" : row.pts + " points") + ", reste " + row.left);
    });
  });
}

function updateCricket(g, cs){
  const withPoints = g.options.points;
  const shut = {};
  CRICKET_TARGETS.forEach(function(t){
    shut[t] = cs.perPlayer.every(P => P.marks[t] >= MARKS_TO_CLOSE);
    refs.markLabs[t].classList.toggle("shut", shut[t]);
  });
  g.players.forEach(function(p, pi){
    const P = cs.perPlayer[pi];
    refs.headSub[p.id].textContent = withPoints ? String(P.points) : P.closed + "/7";
    CRICKET_TARGETS.forEach(function(t){
      const c = refs.marks[p.id][t];
      const m = P.marks[t];
      c.classList.toggle("empty", m === 0);
      c.classList.toggle("shut", shut[t]);
      c.replaceChildren(m === 0 ? "" : icon(m === 1 ? IC_MARK_1 : m === 2 ? IC_MARK_2 : IC_MARK_3, 26));
      c.setAttribute("aria-label", CRICKET_LABELS[t] + ", " + p.name + ", " +
        (m >= MARKS_TO_CLOSE ? "fermé" : plural(m, "marque", "marques")));
    });
    if (withPoints){
      refs.points[p.id].textContent = String(P.points);
      refs.totals[p.id].textContent = String(P.points);
    }
  });
}

function updateClock(g, cs){
  g.players.forEach(function(p, pi){
    const P = cs.perPlayer[pi];
    refs.headSub[p.id].textContent = P.prog >= CLOCK_SEQ.length ? "Terminé" : "Vise " + CLOCK_SEQ[P.prog];
    refs.clock[p.id].forEach(function(c, i){
      const got = i < P.prog;
      c.classList.toggle("empty", !got);
      c.replaceChildren(got ? icon(IC_CHECK, 24) : "");
      c.setAttribute("aria-label", CLOCK_SEQ[i] + ", " + p.name + ", " + (got ? "validé" : "à valider"));
    });
  });
}

/* Géométrie du défilement horizontal : largeur d'une colonne de joueur. */
function colMetrics(){
  if (!sheetEl || !state.game) return null;
  const n = state.game.players.length;
  const labelW = sheetEl.firstChild.offsetWidth;
  const colW = (sheetEl.scrollWidth - labelW) / n;
  return { labelW:labelW, colW:colW, n:n, visible:Math.min(2, n) };
}
function updateDots(){
  if (!refs || !refs.dots.length) return;
  const m = colMetrics();
  if (!m || !m.colW) return;
  const first = Math.round(sheetEl.scrollLeft / m.colW);
  refs.dots.forEach(function(d, i){ d.classList.toggle("on", i >= first && i < first + m.visible); });
}
/* Si la colonne du joueur actif n'est pas entièrement visible, on y va. */
function ensureActiveVisible(smooth){
  if (!sheetEl || !state.game || !refs) return;
  const m = colMetrics();
  if (!m || !m.colW) return;
  const cs = gameState();
  const idx = cs.turnIndex >= 0 ? cs.turnIndex : 0;
  const left = idx * m.colW;
  const view = sheetEl.clientWidth - m.labelW;
  const sl = sheetEl.scrollLeft;
  if (!(left >= sl - 1 && left + m.colW <= sl + view + 1)){
    const target = Math.max(0, Math.min(left, m.colW * m.n - view));
    if (smooth && !reduceMotion) sheetEl.scrollTo({ left:target, behavior:"smooth" });
    else sheetEl.scrollLeft = target;
  }
  /* En horloge, la ligne utile est celle du numéro visé par le joueur actif. */
  if (refs.kind === "clock" && refs.clockLabs.length){
    const P = cs.perPlayer[idx];
    const lab = refs.clockLabs[Math.min(P.prog, CLOCK_SEQ.length - 1)];
    const headH = sheetEl.firstChild.offsetHeight;
    const y = lab.offsetTop - sheetEl.offsetTop - headH - (sheetEl.clientHeight - headH - lab.offsetHeight) / 2;
    const top = Math.max(0, y);
    if (smooth && !reduceMotion) sheetEl.scrollTo({ top:top, behavior:"smooth" });
    else sheetEl.scrollTop = top;
  }
}

/* --- résumé de fin de partie -------------------------------- */

/* Le détail d'un joueur, écrit une seule fois : le résumé rouvert depuis
   l'historique doit se relire à l'identique des mois plus tard. */
function detailLine(mode, options, st){
  const kind = kindOf(mode);
  if (kind === "x01") return "Moyenne " + fr1(st.avg) + " · Meilleure volée " + st.best + " · " + plural(st.darts, "fléchette", "fléchettes");
  if (kind === "clock") return plural(st.prog, "numéro", "numéros") + " · " + fr1(st.perVolley) + " par volée · " + plural(st.darts, "fléchette", "fléchettes");
  return plural(st.closed, "cible fermée", "cibles fermées") + (options.points ? " · " + plural(st.points, "point", "points") : "") +
         " · " + fr1(st.mpv) + " marques par volée";
}

function buildEntry(g, cs){
  const kind = cs.kind;
  /* Records mesurés avant l'ajout de cette partie à l'historique, et à mode
     comparable : une moyenne de 501 ne se compare pas à un score de cricket. */
  let prevBest = null;
  const prevPersonal = {};
  state.history.forEach(function(e){
    if (kindOf(e.mode) !== kind) return;
    e.results.forEach(function(r){
      const v = kind === "x01" ? r.stats.avg : null;
      if (v === null || v === undefined) return;
      if (prevBest === null || v > prevBest) prevBest = v;
      if (prevPersonal[r.playerId] === undefined || v > prevPersonal[r.playerId]) prevPersonal[r.playerId] = v;
    });
  });

  const results = cs.ranking.map(function(r){
    const P = r.player;
    let st, value;
    if (kind === "x01"){
      st = { avg:avg3(P), best:P.bestVolley, darts:P.darts, ton80:P.ton80, checkout:P.checkout, left:P.score };
      value = P.score;
    } else if (kind === "clock"){
      st = { prog:P.prog, darts:P.darts, perVolley:P.volleys ? P.prog / P.volleys : 0, triple:P.bestNumbers };
      value = P.prog;
    } else {
      st = { closed:P.closed, points:P.points, marks:P.totalMarks, bestMarks:P.bestMarks, nine:P.nineMarks,
             mpv:P.volleys ? P.totalMarks / P.volleys : 0 };
      value = g.options.points ? P.points : P.closed;
    }

    const tags = [];
    if (kind === "x01"){
      if (prevBest !== null && st.avg > prevBest) tags.push({ t:"Meilleure moyenne de tous les temps", gold:true });
      else if (prevPersonal[P.id] !== undefined && st.avg > prevPersonal[P.id]) tags.push({ t:"Record personnel", gold:false });
      if (P.ton80) tags.push({ t: P.ton80 > 1 ? P.ton80 + " × 180" : "Un 180", gold:false });
      if (P.checkout > 100) tags.push({ t:"Sortie à " + P.checkout, gold:false });
    } else if (kind === "cricket"){
      if (P.bestMarks >= 4) tags.push({ t:"Meilleure volée : " + plural(P.bestMarks, "marque", "marques"), gold:false });
      if (P.nineMarks) tags.push({ t:"Tour à neuf marques", gold:false });
    } else {
      if (P.bestNumbers >= 3) tags.push({ t:"Trois numéros en une volée", gold:false });
    }

    return { playerId:P.id, name:P.name, color:P.color, rank:r.rank, value:value,
             detail:detailLine(g.mode, g.options, st), tags:tags, stats:st };
  });

  return {
    id: g.id,
    endedAt: Date.now(),
    mode: g.mode,
    options: g.options,
    meets: meetTally(g),
    results: results,
    winnerIds: cs.winnerIds.slice()
  };
}

function renderSummary(){
  gridBuiltFor = null;
  const s = state.summary, e = s.entry;
  const first = e.results[0];

  const scroll = h("div", { class:"scroll" });
  const box = h("div", { class:"sum" },
    h("h1", { class:"sum-h", text:"Partie terminée" }),
    h("p", { class:"sum-s", text: e.winnerIds.length > 1
        ? "Égalité en tête, personne ne décroche les fléchettes."
        : "Bravo " + first.name + "." }));

  const head = h("div", { class:"tags" }, h("span", { class:"tag", text:modeTag(e.mode, e.options) }));
  if (e.meets) head.append(h("span", { class:"tag num", text:plural(e.meets, "rencontre", "rencontres") }));
  box.append(head);

  e.results.forEach(function(r){
    const tags = h("div", { class:"tags" });
    r.tags.forEach(t => tags.append(h("span", { class:"tag" + (t.gold ? " gold" : ""), text:t.t })));
    box.append(h("div", { class:"rank", style:{ "--pc":r.color } },
      h("div", { class:"rank-n num", text:String(r.rank) }),
      h("div", { class:"rank-b" }),
      h("div", { class:"rank-m" },
        h("div", { class:"rank-t" },
          h("span", { class:"nm", text:r.name }),
          h("span", { class:"sc num", text:String(r.value) })),
        h("div", { class:"rank-d num", text:r.detail }),
        tags.childNodes.length ? tags : null)));
  });

  const actions = h("div", { class:"sum-a" });
  if (!s.readOnly) actions.append(h("button", { class:"btn btn-primary btn-lg", onclick:replaySameLineup }, "Rejouer avec les mêmes joueurs"));
  actions.append(h("button", { class:"btn btn-ghost btn-lg",
    onclick:function(){ state.summary = null; goHome(); } }, "Revenir à l'accueil"));
  box.append(actions);

  scroll.append(box);
  appEl.replaceChildren(h("div", { class:"screen" }, brandBar(null), scroll));
}

let modalOpen = false;
let toastTimer = null;

function openModal(node){
  modalEl.replaceChildren(node);
  modalEl.classList.add("open");
  modalOpen = true;
  bindKeyboardInset();
}
function closeModal(){
  if (!modalOpen) return;
  modalEl.replaceChildren();
  modalEl.classList.remove("open");
  modalEl.style.removeProperty("--kb");
  modalOpen = false;
  unbindKeyboardInset();
}
function toast(msg){
  const old = document.querySelector(".toast");
  if (old) old.remove();
  clearTimeout(toastTimer);
  const t = h("div", { class:"toast", role:"status", text:msg });
  document.body.append(t);
  toastTimer = setTimeout(function(){ t.remove(); }, 2200);
}

/* Le clavier logiciel ne doit pas passer sous la feuille (iOS ne
   redimensionne pas la fenêtre : on suit le viewport visuel). */
function onViewportResize(){
  const vv = window.visualViewport;
  if (!vv) return;
  const kb = Math.max(0, window.innerHeight - (vv.height + vv.offsetTop));
  modalEl.style.setProperty("--kb", kb + "px");
}
function bindKeyboardInset(){
  if (!window.visualViewport) return;
  window.visualViewport.addEventListener("resize", onViewportResize);
  window.visualViewport.addEventListener("scroll", onViewportResize);
}
function unbindKeyboardInset(){
  if (!window.visualViewport) return;
  window.visualViewport.removeEventListener("resize", onViewportResize);
  window.visualViewport.removeEventListener("scroll", onViewportResize);
}

/* Feuille remontant du bas : fermable au geste bas, hors zone, ou au bouton. */
function sheetPanel(cfg){
  const panel = h("div", { class:"sheetp", role:"dialog", "aria-modal":"true", "aria-label":cfg.title });
  const sub = cfg.sub ? h("div", { class:"msub", text:cfg.sub }) : null;
  const head = h("div", { class:"mhead" },
    h("div", { class:"grab" }),
    h("div", { class:"mhead-row" },
      h("div", { class:"grow" },
        h("div", { class:"mtitle", text:cfg.title }),
        sub),
      h("button", { class:"iconbtn", "aria-label":"Fermer", onclick:closeModal }, icon(IC_CLOSE, 20))));
  attachDrag(head, panel);
  panel.append(head, h("div", { class:"mbody" }, cfg.body));
  if (cfg.actions && cfg.actions.length) panel.append(h("div", { class:"mactions" }, cfg.actions));
  const wrap = h("div", {}, h("div", { class:"scrim", onclick:closeModal }), panel);
  wrap.subEl = sub;
  return wrap;
}
function attachDrag(handle, panel){
  let start = null;
  handle.addEventListener("touchstart", function(e){
    start = e.touches[0].clientY;
    panel.style.transition = "none";
  }, { passive:true });
  handle.addEventListener("touchmove", function(e){
    if (start === null) return;
    const dy = Math.max(0, e.touches[0].clientY - start);
    panel.style.setProperty("--drag", dy + "px");
  }, { passive:true });
  handle.addEventListener("touchend", function(){
    if (start === null) return;
    const dy = parseFloat(panel.style.getPropertyValue("--drag")) || 0;
    panel.style.transition = "";
    start = null;
    if (dy > 80) closeModal();
    else panel.style.setProperty("--drag", "0px");
  });
}
function confirmDialog(cfg){
  const dlg = h("div", { class:"dlg", role:"dialog", "aria-modal":"true" },
    h("h3", { text:cfg.title }),
    h("p", { text:cfg.message }),
    h("div", { class:"dlg-a" },
      h("button", { class:"btn btn-ghost", onclick:function(){ closeModal(); if (cfg.onCancel) cfg.onCancel(); } }, cfg.cancel || "Annuler"),
      h("button", { class:"btn " + (cfg.danger ? "btn-danger" : "btn-primary"),
        onclick:function(){ closeModal(); cfg.onConfirm(); } }, cfg.confirm)));
  openModal(h("div", {}, h("div", { class:"scrim", onclick:closeModal }), dlg));
}

/* --- sélection et référentiel des joueurs --- */

/* L'ordre est celui de l'ajout : retirer puis remettre renvoie en fin de file. */
function toggleSelection(id){
  const i = state.selection.indexOf(id);
  if (i >= 0) state.selection.splice(i, 1);
  else {
    if (state.selection.length >= MAX_PLAYERS){ toast(MAX_PLAYERS + " joueurs au maximum."); return; }
    state.selection.push(id);
  }
  saveSelection();
  renderHome();
}
function defaultColor(){
  const used = new Set(state.players.map(p => p.color));
  return PALETTE.find(c => !used.has(c)) || PALETTE[state.players.length % PALETTE.length];
}
function openPlayerForm(playerId){
  const existing = playerId ? findPlayer(playerId) : null;
  let color = existing ? existing.color : defaultColor();

  const input = h("input", { class:"field", type:"text", maxlength:String(MAX_NAME), value: existing ? existing.name : "",
    placeholder:"Prénom", autocomplete:"off", autocapitalize:"words", autocorrect:"off", spellcheck:"false",
    enterkeyhint:"done", "aria-label":"Nom du joueur" });
  const warn = h("div", { class:"warn" });
  const swatches = h("div", { class:"swatches" });
  const submit = h("button", { class:"btn btn-primary", onclick:save }, existing ? "Renommer" : "Créer");

  PALETTE.forEach(function(c){
    swatches.append(h("button", { class:"sw" + (c === color ? " sel" : ""), style:{ "--pc":c }, "aria-label":"Couleur " + c,
      onclick:function(){ color = c; Array.from(swatches.children).forEach(function(x, i){ x.classList.toggle("sel", PALETTE[i] === color); }); } },
      h("i", {})));
  });

  function check(){
    const name = input.value.trim();
    submit.disabled = name.length === 0;
    const dup = state.players.some(p => p.id !== playerId && p.name.toLowerCase() === name.toLowerCase());
    if (name && dup){ warn.textContent = "Un joueur porte déjà ce nom."; submit.disabled = true; }
    else warn.textContent = "";
  }
  input.addEventListener("input", check);
  input.addEventListener("keydown", function(e){ if (e.key === "Enter") save(); });

  function save(){
    const name = input.value.trim().slice(0, MAX_NAME);
    if (!name) return;
    if (state.players.some(p => p.id !== playerId && p.name.toLowerCase() === name.toLowerCase())) return;
    if (existing){ existing.name = name; existing.color = color; }
    else state.players.push({ id:uid("p"), name:name, color:color, createdAt:Date.now() });
    savePlayers();
    closeModal();
    renderHome();
  }

  openModal(sheetPanel({
    title: existing ? "Renommer le joueur" : "Nouveau joueur",
    sub: MAX_NAME + " caractères au plus, une couleur pour la colonne.",
    body: [input, warn, swatches],
    actions: [submit]
  }));
  check();
  setTimeout(function(){ input.focus(); }, 60);
}
function openPlayerMenu(playerId){
  const p = findPlayer(playerId);
  if (!p) return;
  openModal(sheetPanel({
    title: p.name,
    body: [h("div", { class:"menu" },
      h("button", { onclick:function(){ closeModal(); openPlayerForm(playerId); } }, "Renommer ou changer la couleur"),
      h("button", { class:"dang", onclick:function(){ closeModal(); askDelete(playerId); } }, "Supprimer le joueur"))]
  }));
}
function askDelete(playerId){
  const p = findPlayer(playerId);
  if (!p) return;
  confirmDialog({
    title: "Supprimer " + p.name + " ?",
    message: "Le joueur quitte la liste et le classement. Les parties déjà enregistrées ne changent pas, et une partie en cours n'est pas interrompue.",
    confirm: "Supprimer", danger: true,
    onConfirm: function(){
      state.players = state.players.filter(x => x.id !== playerId);
      savePlayers();
      pruneSelection();
      renderHome();
    }
  });
}
