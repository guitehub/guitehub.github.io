/* --- cycle de vie d'une partie --- */

function onLaunch(){
  if (!state.selection.length) return;
  if (state.game){
    confirmDialog({
      title: "Lancer une nouvelle partie ?",
      message: "La partie en cours sera perdue : elle n'est pas enregistrée dans l'historique.",
      confirm: "Lancer quand même", danger: true,
      onConfirm: function(){ startGame(state.selection.slice()); }
    });
    return;
  }
  startGame(state.selection.slice());
}
function startGame(ids, snapshot){
  const s = state.settings;
  const players = snapshot || ids.map(function(id){
    const p = findPlayer(id);
    return { id:p.id, name:p.name, color:p.color };
  });
  state.game = {
    id: uid("g"),
    startedAt: Date.now(),
    mode: s.mode,
    options: optionsFor(s.mode, s),
    meet: s.meet === true && meetAllowed(s.mode, s),
    players: players,
    volleys: []
  };
  state.summary = null;
  gridBuiltFor = null;
  saveGame();
  state.screen = "game";
  render();
}
function resumeGame(){
  if (!state.game) return;
  state.screen = "game";
  render();
}
function goHome(){
  state.screen = "home";
  render();
}
function openPastGame(id){
  const e = state.history.find(x => x.id === id);
  if (!e) return;
  state.summary = { entry:e, readOnly:true };
  state.screen = "summary";
  render();
}
function openGameMenu(){
  openModal(sheetPanel({
    title: "Partie en cours",
    sub: "La feuille est conservée tant qu'elle n'est pas abandonnée.",
    body: [h("div", { class:"menu" },
      h("button", { onclick:function(){ closeModal(); goHome(); } }, "Revenir à l'accueil"),
      h("button", { class:"dang", onclick:function(){ closeModal(); askAbandon(); } }, "Abandonner la partie"))]
  }));
}
function askAbandon(){
  confirmDialog({
    title: "Abandonner la partie ?",
    message: "La feuille est effacée sans être enregistrée dans l'historique.",
    confirm: "Abandonner", danger: true,
    onConfirm: function(){
      state.game = null;
      saveGame();
      gridBuiltFor = null;
      goHome();
    }
  });
}

/* --- volées : on empile, on recalcule, on n'ajuste jamais --- */

function pushVolley(v){
  const g = state.game;
  const before = computeState(g.mode, g.options, g.players, g.volleys).meets.sig;
  g.volleys.push(v);
  const cs = gameState();
  saveGame();
  if (cs.over){ finishGame(cs); return; }
  renderGame();
  ensureActiveVisible(true);
  if (cs.lastBust) flashShow("CASSÉ !", true);
  else if (g.meet && cs.meets.sig && cs.meets.sig !== before) flashShow("RENCONTRE !", false);
}
/* Annuler, c'est retirer la dernière volée. Rien à défaire, rien à recoller. */
function undoVolley(){
  const g = state.game;
  if (!g || !g.volleys.length) return;
  g.volleys.pop();
  const who = g.players[g.volleys.length % g.players.length];
  saveGame();
  renderGame();
  ensureActiveVisible(true);
  toast("Volée de " + who.name + " annulée");
}
/* Combien de fois l'égalité a été signalée : recalculé, jamais compté au vol,
   pour qu'un rechargement en pleine partie ne perde pas le compte. */
function meetTally(g){
  if (!g.meet) return 0;
  let n = 0, prev = "";
  for (let i = 1; i <= g.volleys.length; i++){
    const sig = computeState(g.mode, g.options, g.players, g.volleys.slice(0, i)).meets.sig;
    if (sig && sig !== prev) n++;
    prev = sig;
  }
  return n;
}
function finishGame(cs){
  const g = state.game;
  flashClose();
  const entry = buildEntry(g, cs);
  state.history.unshift(entry);
  if (state.history.length > HISTORY_CAP) state.history.length = HISTORY_CAP;
  saveHistory();
  state.summary = { entry:entry, readOnly:false, lineup:g.players.slice() };
  state.game = null;
  saveGame();
  gridBuiltFor = null;
  state.screen = "summary";
  render();
}
function replaySameLineup(){
  const lineup = state.summary ? state.summary.lineup.slice() : null;
  if (!lineup){ goHome(); return; }
  /* La sélection d'accueil suit, pour les joueurs encore au référentiel. */
  const known = new Set(state.players.map(p => p.id));
  state.selection = lineup.map(p => p.id).filter(id => known.has(id));
  saveSelection();
  state.summary = null;
  startGame(null, lineup);
}
/* Taper dans la colonne du joueur actif ouvre la saisie ; ailleurs, rien :
   ici l'ordre du tour est une règle, pas une convention. */
function onCellTap(playerId){
  const cs = gameState();
  if (cs.turnIndex < 0) return;
  if (state.game.players[cs.turnIndex].id !== playerId){ ensureActiveVisible(true); return; }
  openVolleySheet();
}

/* Fermeture au clavier — le focus visible fait partie du plancher de qualité. */
document.addEventListener("keydown", function(e){
  if (e.key === "Escape" && modalOpen) closeModal();
});

/* --- saisie d'une volée --- */

function clockName(n){ return n === 25 ? "la demi-bulle" : n === 50 ? "la bulle" : "le " + n; }

function openVolleySheet(){
  const g = state.game;
  if (!g) return;
  const cs0 = gameState();
  if (cs0.over) return;
  const pi = cs0.turnIndex;
  const player = g.players[pi];
  const kind = cs0.kind;
  const dblOut = !!g.options.doubleOut;

  let darts = [null, null, null];
  let mult = 1;
  let entry = "darts";                 // "darts" | "total"

  /* Rejouer la partie avec la volée en cours donne l'état exact à cet instant :
     score restant, numéro visé, marques — sans rien mémoriser à côté. */
  function preview(list){
    const v = { p:player.id, darts:(list || darts).filter(d => d), total:null, dbl:false };
    const cs = computeState(g.mode, g.options, g.players, g.volleys.concat([v]));
    return cs.perPlayer[pi];
  }
  function thrown(){ return darts.filter(d => d).length; }

  function subText(){
    const P = preview();
    if (kind === "x01"){
      const base = player.name + " · " + P.score + " restants";
      if (!P.open) return base + " · double in";
      const left = DARTS_PER_TURN - thrown();
      const f = left > 0 ? finishText(P.score, left, dblOut) : "";
      return f ? base + " · " + f : base;
    }
    if (kind === "clock")
      return player.name + " · " + (P.prog >= CLOCK_SEQ.length ? "terminé" : "vise " + clockName(CLOCK_SEQ[P.prog]));
    return player.name + " · " + (g.options.points ? plural(P.points, "point", "points") : P.closed + "/7 cibles");
  }

  /* Bascule fléchettes / total : le total direct n'a de sens qu'en x01. */
  const tabs = h("div", { class:"pills", style:{ "grid-template-columns":"repeat(2,1fr)" } });
  const tabD = h("button", { class:"pill sel", onclick:function(){ setEntry("darts"); } }, "Fléchettes");
  const tabT = h("button", { class:"pill", onclick:function(){ setEntry("total"); } }, "Total");
  tabs.append(tabD, tabT);

  const slots = h("div", { class:"pills", style:{ "grid-template-columns":"repeat(3,1fr)" } });
  const slotEls = [0, 1, 2].map(function(i){
    const b = h("button", { class:"pill", "aria-label":"Fléchette " + (i + 1), onclick:function(){ clearSlot(i); } });
    slots.append(b);
    return b;
  });

  const mults = h("div", { class:"pills", style:{ "grid-template-columns":"repeat(3,1fr)" } });
  const multEls = [1, 2, 3].map(function(m){
    const b = h("button", { class:"pill", onclick:function(){ mult = m; refresh(); } }, ["Simple", "Double", "Triple"][m - 1]);
    mults.append(b);
    return b;
  });

  const sectors = h("div", { class:"pills long", style:{ "grid-template-columns":"repeat(5,1fr)" } });
  const sectorEls = seq(1, 20).map(function(s){
    const b = h("button", { class:"pill num", onclick:function(){ addDart({ s:s, m:mult }); } }, String(s));
    sectors.append(b);
    return b;
  });

  const specials = h("div", { class:"pills", style:{ "grid-template-columns":"repeat(3,1fr)" } });
  const bull25 = h("button", { class:"pill num", onclick:function(){ addDart({ s:25, m:1 }); } }, "25");
  const bull50 = h("button", { class:"pill num", onclick:function(){ addDart({ s:50, m:1 }); } }, "50");
  const missed = h("button", { class:"pill strike", onclick:function(){ addDart({ s:0, m:1 }); } }, "Raté");
  specials.append(bull25, bull50, missed);

  const dartsBox = h("div", {}, slots, mults, sectors, specials);

  const field = h("input", { class:"field num", type:"text", inputmode:"numeric", pattern:"[0-9]*",
    placeholder:"Points de la volée", autocomplete:"off", enterkeyhint:"done", "aria-label":"Total de la volée" });
  const warn = h("div", { class:"warn" });
  const totalBox = h("div", { hidden:true }, field, warn);

  const submit = h("button", { class:"btn btn-primary", onclick:validate }, "Valider");
  const back = h("button", { class:"btn btn-ghost", onclick:closeModal }, "Retour");

  const panel = sheetPanel({
    title: "Volée",
    sub: subText(),
    body: kind === "x01" ? [tabs, dartsBox, totalBox] : [dartsBox],
    actions: [submit, back]
  });

  function setEntry(which){
    entry = which;
    /* On ne garde jamais deux saisies en parallèle : changer d'onglet vide l'autre. */
    if (which === "total") darts = [null, null, null];
    else field.value = "";
    tabD.classList.toggle("sel", which === "darts");
    tabT.classList.toggle("sel", which === "total");
    dartsBox.hidden = which !== "darts";
    totalBox.hidden = which === "darts";
    refresh();
    if (which === "total") setTimeout(function(){ field.focus(); }, 60);
  }
  function clearSlot(i){
    if (!darts[i]) return;
    darts[i] = null;
    /* Les emplacements se remplissent de gauche à droite : vider, c'est
       replacer la saisie sur le trou. */
    darts = darts.filter(d => d).concat([null, null, null]).slice(0, 3);
    refresh();
  }
  function addDart(d){
    const i = darts.indexOf(null);
    if (i < 0) return;
    darts[i] = d;
    mult = 1;                          // sans ça on enchaîne des triples fantômes
    if (kind === "x01"){
      const P = preview();
      const row = P.rows[P.rows.length - 1];
      /* Un bust ou une sortie ferment le tour : les fléchettes restantes
         ne seront pas lancées. */
      if ((row && row.bust) || P.score === 0){ commit(); return; }
    }
    refresh();
  }
  function commit(){
    const list = darts.filter(d => d);
    if (!list.length) return;
    closeModal();
    pushVolley({ p:player.id, darts:list, total:null, dbl:false });
  }

  /* --- saisie au total : ce qui est refusé, ce qui casse, ce qui sort --- */
  function totalValue(){
    const raw = field.value.replace(/[^0-9]/g, "");
    return raw === "" ? null : parseInt(raw, 10);
  }
  function checkTotal(){
    const t = totalValue();
    if (t === null){ warn.textContent = ""; submit.disabled = true; return; }
    if (t > MAX_TOTAL || IMPOSSIBLE_TOTALS.indexOf(t) >= 0){
      warn.textContent = "Total impossible avec trois fléchettes.";
      submit.disabled = true;
      return;
    }
    submit.disabled = false;
    const P = cs0.perPlayer[pi];
    if (!P.open){ warn.textContent = "Le double in n'est pas ouvert : cette volée ne comptera pas."; return; }
    const ns = P.score - t;
    if (ns < 0 || (dblOut && ns === 1)) warn.textContent = "Volée cassée : le score restera à " + P.score + ".";
    else if (ns === 0 && dblOut) warn.textContent = "Sortie : la dernière fléchette devra être un double.";
    else if (ns === 0) warn.textContent = "Sortie : partie gagnée.";
    else warn.textContent = "Reste " + ns + ".";
  }
  function commitTotal(t, dbl){
    closeModal();
    pushVolley({ p:player.id, darts:[], total:t, dbl:!!dbl });
  }
  function validateTotal(){
    const t = totalValue();
    if (t === null || t > MAX_TOTAL || IMPOSSIBLE_TOTALS.indexOf(t) >= 0) return;
    const P = cs0.perPlayer[pi];
    if (!P.open){
      toast("Un total direct n'ouvre pas un double in.");
      commitTotal(t, false);
      return;
    }
    if (dblOut && P.score - t === 0){
      confirmDialog({
        title: "Terminé sur un double ?",
        message: "En double out, la fléchette qui amène à zéro doit être un double. Sinon la volée est cassée.",
        confirm: "Oui, sortie", cancel: "Non, cassée",
        onConfirm: function(){ commitTotal(t, true); },
        onCancel: function(){ commitTotal(t, false); }
      });
      return;
    }
    commitTotal(t, false);
  }
  function validate(){ if (entry === "total") validateTotal(); else commit(); }

  field.addEventListener("input", checkTotal);
  field.addEventListener("keydown", function(e){ if (e.key === "Enter") validateTotal(); });

  function refresh(){
    if (panel.subEl) panel.subEl.textContent = subText();
    slotEls.forEach(function(b, i){
      const d = darts[i];
      b.className = "pill num" + (d ? "" : " strike");
      b.textContent = d ? dartLabel(d) : "·";
    });
    multEls.forEach(function(b, i){ b.classList.toggle("sel", mult === i + 1); });

    /* Aide contextuelle : le pavé dit ce qui sert et ce qui ne sert à rien. */
    const P = preview();
    const target = (kind === "clock" && P.prog < CLOCK_SEQ.length) ? CLOCK_SEQ[P.prog] : 0;
    sectorEls.forEach(function(b, i){
      const s = i + 1;
      const dead = kind === "cricket" && CRICKET_TARGETS.indexOf(s) < 0;
      b.className = "pill num" + (dead ? " strike" : "") + (target === s ? " sel" : "");
    });
    bull25.className = "pill num" + (target === 25 ? " sel" : "");
    bull50.className = "pill num" + (target === 50 ? " sel" : "");
    /* Ni double ni triple dans la bulle : les deux ne se combinent pas. */
    bull25.disabled = mult !== 1;
    bull50.disabled = mult !== 1;

    const full = thrown() >= DARTS_PER_TURN;
    sectorEls.forEach(function(b){ b.disabled = full; });
    if (full){ bull25.disabled = true; bull50.disabled = true; }
    missed.disabled = full;

    if (entry === "total") checkTotal();
    else submit.disabled = thrown() === 0;
  }

  openModal(panel);
  if (kind !== "x01") setEntry("darts");
  refresh();
}

/* ============================================================
   RENCONTRE
   Deux joueurs au même score, et l'écran le dit. Aucun effet sur le
   déroulement ni sur le score : c'est de l'ambiance, rien d'autre.
   Une égalité qui persiste ne resonne pas — c'est la signature de
   l'égalité, et non son existence, qui déclenche.
   ============================================================ */

let flashEl = null;
let flashHold = null;

function flashShow(word, bad){
  flashClose();
  flashEl = h("div", { class:"flash" + (bad ? " bad" : ""), role:"alertdialog", "aria-label":word, onpointerdown:flashClose },
    h("b", { text:word }));
  document.body.append(flashEl);
  try { if (navigator.vibrate) navigator.vibrate(200); } catch (e){}
  flashHold = setTimeout(flashClose, FLASH_HOLD_MS);
}
function flashClose(){
  clearTimeout(flashHold);
  flashHold = null;
  if (flashEl){ flashEl.remove(); flashEl = null; }
}

/* ============================================================
   AUTOTEST
   `?autotest=1` rejoue les règles sans toucher au DOM. Un moteur juste
   avec une interface moyenne se rattrape ; l'inverse non.
   ============================================================ */

function runAutotest(){
  const out = [];
  const t = function(name, cond, got){ out.push({ name:name, ok:!!cond, got:got }); };

  const P = n => Array.from({ length:n }, (_, i) => ({ id:"p" + i, name:"J" + i, color:PALETTE[i] }));
  const pd = function(s){
    if (s === "X") return { s:0, m:1 };
    if (s === "25" || s === "50") return { s:parseInt(s, 10), m:1 };
    const m = /^([DT]?)(\d+)$/.exec(s);
    return { s:parseInt(m[2], 10), m:m[1] === "D" ? 2 : m[1] === "T" ? 3 : 1 };
  };
  const V = (p, i, a) => ({ p:p[i % p.length].id, darts:a.map(pd), total:null, dbl:false });
  const T = (p, i, n) => ({ p:p[i % p.length].id, darts:[], total:n, dbl:false });
  const CS = (mode, opt, p, v) => computeState(mode, opt, p, v);

  /* --- x01 --- */
  (function(){
    const p = P(1), cs = CS("501", {}, p, [V(p, 0, ["T20","T20","T20"])]);
    t("501 straight, T20 T20 T20 → 321, volée 180",
      cs.perPlayer[0].score === 321 && cs.perPlayer[0].rows[0].pts === 180, cs.perPlayer[0].score);
  })();
  (function(){
    const p = P(1), cs = CS("501", { doubleOut:true }, p, [T(p, 0, 461), V(p, 1, ["D20"])]);
    t("Double out, 40, D20 → victoire, reste 0",
      cs.perPlayer[0].score === 0 && cs.over && cs.winnerIds[0] === "p0", cs.perPlayer[0].score);
  })();
  (function(){
    const p = P(1), cs = CS("501", { doubleOut:true }, p, [T(p, 0, 469), V(p, 1, ["20","20","20"])]);
    t("Double out, 32, 20 20 20 → bust, reste 32",
      cs.perPlayer[0].rows[1].bust && cs.perPlayer[0].score === 32, cs.perPlayer[0].score);
  })();
  (function(){
    const p = P(1), cs = CS("501", { doubleOut:true }, p, [T(p, 0, 469), V(p, 1, ["16","16"])]);
    t("Double out, 32, 16 16 → bust (zéro sans double), reste 32",
      cs.perPlayer[0].rows[1].bust && cs.perPlayer[0].score === 32, cs.perPlayer[0].score);
  })();
  (function(){
    const p = P(1), cs = CS("501", {}, p, [T(p, 0, 469), V(p, 1, ["16","16"])]);
    t("Straight out, 32, 16 16 → victoire", cs.perPlayer[0].score === 0 && cs.over, cs.perPlayer[0].score);
  })();
  (function(){
    const p = P(1), cs = CS("501", { doubleOut:true }, p, [T(p, 0, 499), V(p, 1, ["1"])]);
    t("Double out, 2, 1 → bust (score à 1)",
      cs.perPlayer[0].rows[1].bust && cs.perPlayer[0].score === 2, cs.perPlayer[0].score);
  })();
  (function(){
    const p = P(1), cs = CS("501", { doubleIn:true }, p, [V(p, 0, ["20","T20","D5"])]);
    t("Double in, 501, 20 T20 D5 → reste 491", cs.perPlayer[0].score === 491, cs.perPlayer[0].score);
  })();
  (function(){
    const p = P(2), cs = CS("501", { doubleOut:true }, p, [T(p, 0, 469), V(p, 1, ["5"]), V(p, 2, ["20","20","20"])]);
    t("Après un bust, la main passe au joueur suivant",
      cs.turnIndex === 1 && cs.perPlayer[0].score === 32, cs.turnIndex);
  })();

  /* --- cricket --- */
  (function(){
    const p = P(2), cs = CS("cricket", { points:true }, p, [V(p, 0, ["20","20"]), V(p, 1, ["X"]), V(p, 2, ["T20"])]);
    t("Cricket, 2 marques puis T20, adversaire non fermé → 20 fermé + 40 points",
      cs.perPlayer[0].marks[20] === 3 && cs.perPlayer[0].points === 40, cs.perPlayer[0].points);
  })();
  (function(){
    const p = P(2), cs = CS("cricket", { points:true }, p, [V(p, 0, ["20","20"]), V(p, 1, ["T20"]), V(p, 2, ["T20"])]);
    t("Même cas, adversaire ayant déjà fermé → 20 fermé, 0 point",
      cs.perPlayer[0].marks[20] === 3 && cs.perPlayer[0].points === 0, cs.perPlayer[0].points);
  })();
  (function(){
    const p = P(3), cs = CS("cricket", { points:true, cutThroat:true }, p,
      [V(p, 0, ["20","20"]), V(p, 1, ["X"]), V(p, 2, ["X"]), V(p, 3, ["T20"])]);
    t("Cut throat → 0 pour le marqueur, +40 à chaque adversaire non fermé",
      cs.perPlayer[0].points === 0 && cs.perPlayer[1].points === 40 && cs.perPlayer[2].points === 40,
      cs.perPlayer.map(x => x.points).join("/"));
  })();
  (function(){
    const p = P(1), cs = CS("cricket", { points:true }, p, [V(p, 0, ["25","50"])]);
    t("Demi-bulle 1 marque, bulle centrale 2 → bulle fermée", cs.perPlayer[0].marks[25] === 3, cs.perPlayer[0].marks[25]);
  })();
  (function(){
    const p = P(2), cs = CS("cricket", { points:true }, p, [
      V(p, 0, ["T19","T18","T17"]), V(p, 1, ["T20","T20","T20"]),
      V(p, 2, ["T16","T15","50"]),  V(p, 3, ["X"]), V(p, 4, ["25","T20","T20"])]);
    t("Fermer les 7 en étant mené aux points → pas vainqueur, la partie continue",
      cs.perPlayer[0].closed === 7 && !cs.over && !cs.winnerIds.length &&
      cs.perPlayer[0].points < cs.perPlayer[1].points, cs.perPlayer[0].closed + "/" + cs.over);
  })();

  /* --- horloge --- */
  (function(){
    const p = P(1), cs = CS("horloge", {}, p, [V(p, 0, ["1","2","3"]), V(p, 1, ["4"]), V(p, 2, ["5","D6","T7"])]);
    t("Horloge, sur le 5, volée 5 D6 T7 → vise ensuite le 8", CLOCK_SEQ[cs.perPlayer[0].prog] === 8, CLOCK_SEQ[cs.perPlayer[0].prog]);
  })();
  (function(){
    const p = P(1), cs = CS("horloge", {}, p, [V(p, 0, ["1","2","3"]), V(p, 1, ["4"]), V(p, 2, ["D5"])]);
    t("Horloge, sur le 5, volée D5 → validé, vise le 6", CLOCK_SEQ[cs.perPlayer[0].prog] === 6, CLOCK_SEQ[cs.perPlayer[0].prog]);
  })();

  /* --- finish --- */
  (function(){
    const f = finish(170, 3, true);
    t("finish(170, 3, double out) → T20 T20 50", f && f.join(" ") === "T20 T20 50", f);
  })();
  (function(){
    const f = finish(2, 1, true);
    t("finish(2, 1, double out) → D1", f && f.join(" ") === "D1", f);
  })();
  (function(){
    const none = [169, 168, 166, 165, 163, 162, 159];
    const bad = none.filter(s => finish(s, 3, true) !== null);
    t("169, 168, 166, 165, 163, 162, 159 → aucun finish en trois fléchettes", bad.length === 0, bad);
  })();
  (function(){
    t("finish(1, 3, double out) → rien", finish(1, 3, true) === null, finish(1, 3, true));
  })();

  /* --- rencontre --- */
  (function(){
    const p = P(2), cs = CS("301", {}, p, [V(p, 0, ["X","X","X"]), V(p, 1, ["X","X","X"])]);
    t("Deux joueurs à 301 après une volée chacun → rencontre",
      cs.meets.groups.length === 1 && cs.meets.groups[0].value === 301, cs.meets.sig);
  })();
  (function(){
    const p = P(2), cs = CS("501", {}, p, []);
    t("Deux joueurs à 501 avant toute volée → pas de rencontre", cs.meets.groups.length === 0, cs.meets.sig);
  })();

  /* --- annulation --- */
  (function(){
    const p = P(2), o = {};
    const vs = [V(p, 0, ["20","20","20"]), V(p, 1, ["19","19","19"]), V(p, 2, ["T20"]), V(p, 3, ["5","5"]), V(p, 4, ["1"])];
    const two = JSON.stringify(CS("501", o, p, vs.slice(0, 2)));
    const undone = vs.slice(); undone.pop(); undone.pop(); undone.pop();
    t("Cinq volées, trois annulations → état strictement identique",
      two === JSON.stringify(CS("501", o, p, undone)), null);
  })();

  const passed = out.filter(r => r.ok).length;
  out.forEach(function(r){
    if (r.ok) console.log("ok   " + r.name);
    else console.error("ÉCHEC " + r.name + "  → " + JSON.stringify(r.got));
  });
  console.log(passed + "/" + out.length + " tests passés.");

  /* Bandeau en styles inline : l'autotest n'alourdit pas la feuille de style. */
  const ok = passed === out.length;
  const bar = document.createElement("div");
  bar.setAttribute("style", "position:fixed;left:0;right:0;top:0;z-index:400;max-height:52%;overflow:auto;" +
    "padding:10px 12px;font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;" +
    "background:" + (ok ? "#12321F" : "#3A1714") + ";color:#ECE7DC;border-bottom:1px solid #3C454F");
  const head = document.createElement("div");
  head.setAttribute("style", "font-weight:700;font-size:13px;margin-bottom:6px");
  head.textContent = "Autotest — " + passed + "/" + out.length + (ok ? " · tout passe" : " · échecs");
  bar.append(head);
  out.forEach(function(r){
    const line = document.createElement("div");
    line.setAttribute("style", "opacity:" + (r.ok ? ".72" : "1") + ";padding:1px 0");
    line.textContent = (r.ok ? "ok   " : "ÉCHEC ") + r.name + (r.ok ? "" : "  → " + JSON.stringify(r.got));
    bar.append(line);
  });
  bar.addEventListener("click", function(){ bar.remove(); });
  document.body.append(bar);
}

/* ============================================================
   INIT
   ============================================================ */

loadAll();
state.screen = "home";     // on rouvre toujours sur l'accueil, avec le bouton de reprise en tête
render();
if (location.search.indexOf("autotest=1") >= 0) runAutotest();

/* Recalcule la géométrie du défilement quand l'écran tourne. */
window.addEventListener("resize", function(){
  if (state.screen === "game" && sheetEl) requestAnimationFrame(function(){ ensureActiveVisible(false); updateDots(); });
});
</script>
