    + `<div class="explication">Affiche « Rencontre ! » quand deux joueurs se retrouvent exactement au même score.${cutThroat ? ' Sans objet en cut throat.' : ''}</div></div>`;
  return html + `</div>`;
}

/* ---- 5.4 Écran de partie ---- */
function libelleCibleCricket(c) { return c === 25 ? 'Bulle' : String(c); }
function symboleMarques(m) { return m >= 3 ? '⊗' : m === 2 ? 'X' : m === 1 ? '/' : ''; }

function celluleEnteteJoueur(etat, j) {
  const p = app.partie;
  const courant = etat.joueurCourant === j.index;
  let corps = '';
  if (etat.type === 'x01') {
    corps = `<div class="score-gros num">${j.score}</div><div class="moy num">moy. ${formaterNombre(moyenneVolee(j))}</div>`;
    if (!j.ouvert) corps += `<span class="badge">DOUBLE IN</span>`;
    if (courant && j.score > 0) {
      const ch = checkout(j.score, 3, !!p.options.doubleOut);
      if (ch) corps += `<div class="finish num">${h(texteCheckout(ch))}</div>`;
      else if (j.score <= 170) corps += `<div class="finish aucun">pas de finish</div>`;
    }
  } else if (etat.type === 'cricket') {
    corps = p.options.avecPoints
      ? `<div class="score-gros num">${j.score}</div><div class="moy num">${nbFermees(j)}/7 fermées</div>`
      : `<div class="score-gros num">${nbFermees(j)}<span class="moy">/7</span></div><div class="moy num">${formaterNombre(moyenneMarques(j))} m/volée</div>`;
  } else {
    const fini = j.cible >= SEQUENCE_HORLOGE.length;
    corps = `<div class="score-gros num">${fini ? '✓' : SEQUENCE_HORLOGE[j.cible]}</div><div class="moy">${fini ? 'terminé' : 'à viser'}</div>`;
  }
  return `<div class="cell entete joueur ${courant ? 'courant' : ''}" ${styleTeinte(j.couleur)} data-col="${j.index}">
    <div class="nom">${pastille(j.couleur)}${h(j.nom)}</div>${corps}</div>`;
}

function lignesX01(etat) {
  let html = '';
  for (let t = etat.nbTours - 1; t >= 0; t--) {
    html += `<div class="cell libelle num">V${t + 1}</div>`;
    etat.joueurs.forEach(j => {
      const d = j.volees[t];
      let contenu = '';
      if (d) {
        if (d.bust) contenu = `<div class="bust">BUST</div><div class="reste num">${d.scoreApres}</div>`;
        else contenu = `<div class="pts num">${d.total}</div><div class="reste num">→ ${d.scoreApres}</div>`;
        contenu += `<div class="details">${d.totalDirect != null ? 'total direct' : h(d.flechettes.map(notation).join(' '))}</div>`;
      }
      html += `<div class="cell joueur ${etat.joueurCourant === j.index ? 'courant' : ''}" ${styleTeinte(j.couleur, 0.1)}>${contenu}</div>`;
    });
  }
  return html;
}
function lignesCricket(etat) {
  let html = '';
  CIBLES_CRICKET.forEach(c => {
    const morte = etat.joueurs.every(j => j.marques[c] >= 3);
    html += `<div class="cell libelle num ${morte ? 'mort' : ''}">${libelleCibleCricket(c)}</div>`;
    etat.joueurs.forEach(j => {
      const m = j.marques[c];
      html += `<div class="cell joueur ${etat.joueurCourant === j.index ? 'courant' : ''} ${morte ? 'mort' : ''}" ${styleTeinte(j.couleur, 0.1)}>
        <span class="marque ${m >= 3 ? 'ferme' : ''}">${symboleMarques(m)}</span></div>`;
    });
  });
  if (etat.options.avecPoints) {
    html += `<div class="cell libelle">Points</div>`;
    etat.joueurs.forEach(j => {
      const d = j.volees[j.volees.length - 1];
      html += `<div class="cell joueur num ${etat.joueurCourant === j.index ? 'courant' : ''}" ${styleTeinte(j.couleur, 0.1)}>${d ? (d.points ? '+' + d.points : '—') : ''}</div>`;
    });
    html += `<div class="cell libelle ligne-total">Total</div>`;
    etat.joueurs.forEach(j => {
      html += `<div class="cell joueur ligne-total num ${etat.joueurCourant === j.index ? 'courant' : ''}" ${styleTeinte(j.couleur, 0.1)}>${j.score}</div>`;
    });
  }
  return html;
}
function lignesHorloge(etat) {
  let html = '';
  SEQUENCE_HORLOGE.forEach((num, idx) => {
    html += `<div class="cell libelle num" data-ligne="${idx}">${num === 25 ? '25' : num === 50 ? 'Bulle' : num}</div>`;
    etat.joueurs.forEach(j => {
      const contenu = j.cible > idx ? `<span class="coche">✓</span>` : j.cible === idx ? `<span class="vise">◎</span>` : '';
      html += `<div class="cell joueur ${etat.joueurCourant === j.index ? 'courant' : ''}" ${styleTeinte(j.couleur, 0.1)}>${contenu}</div>`;
    });
  });
  return html;
}

function renderPartie() {
  const p = app.partie;
  if (!p) { app.ecran = 'accueil'; return renderAccueil(); }
  const etat = etatCourant();
  const n = p.joueurs.length;
  const colonnes = n === 1
    ? 'var(--largeur-libelle) calc(100% - var(--largeur-libelle))'
    : `var(--largeur-libelle) repeat(${n}, calc((100% - var(--largeur-libelle)) / 2))`;
  const courant = etat.joueurCourant != null ? etat.joueurs[etat.joueurCourant] : null;

  let html = `<div class="partie">
    <div class="partie-haut"><span><b>${h(MODES[p.mode].libelle)}</b> · ${h(libelleOptions(p.mode, p.options))}</span><span class="num">Tour ${etat.tour}</span></div>`;
  if (etat.dernierTour) html += `<div class="bandeau-dernier-tour">DERNIER TOUR</div>`;
  if (n > 2) html += `<div class="points-indicateur" id="points-indicateur">${etat.joueurs.map(j => `<span class="point" data-point="${j.index}"></span>`).join('')}</div>`;
  html += `<div class="grille-conteneur" id="grille"><div class="grille" style="grid-template-columns:${colonnes}">`;
  html += `<div class="cell libelle entete">${etat.type === 'x01' ? 'Volée' : etat.type === 'cricket' ? 'Cible' : 'N°'}</div>`;
  etat.joueurs.forEach(j => { html += celluleEnteteJoueur(etat, j); });
  if (etat.type === 'x01') html += lignesX01(etat);
  else if (etat.type === 'cricket') html += lignesCricket(etat);
  else html += lignesHorloge(etat);
  html += `</div></div>`;

  html += `<div class="actions">
    <button class="quitter discret" data-action="quitter" aria-label="Quitter la partie" title="Quitter">✕</button>
    <button class="secondaire" data-action="annuler-volee" ${p.volees.length ? '' : 'disabled'}>Annuler</button>
    <button class="saisir" data-action="ouvrir-saisie" ${courant ? `style="background:${h(courant.couleur)}"` : 'disabled'}>Saisir la volée<span class="qui">${courant ? h(courant.nom) : ''}</span></button>
  </div></div>`;
  return html;
}

function apresRenderPartie(scroll) {
  const g = document.getElementById('grille');
  if (!g) return;
  const etat = etatCourant();
  if (scroll) { g.scrollLeft = scroll.left; g.scrollTop = scroll.top; }
  const n = etat.joueurs.length;
  const idx = etat.joueurCourant;
  const largeurLibelle = (g.querySelector('.cell.libelle') || {}).offsetWidth || 64;
  const colonne = g.querySelector('.cell.joueur');
  const largeurCol = colonne ? colonne.offsetWidth : 0;

  // Défilement horizontal vers la colonne du joueur courant si elle n'est pas visible.
  if (idx != null && n > 2 && largeurCol > 0 && app.dernierJoueurAffiche !== idx) {
    const debut = largeurLibelle + idx * largeurCol;
    const visibleDebut = g.scrollLeft + largeurLibelle, visibleFin = g.scrollLeft + g.clientWidth;
    if (debut < visibleDebut - 2 || debut + largeurCol > visibleFin + 2) {
      g.scrollTo({ left: idx * largeurCol, behavior: scroll ? 'smooth' : 'auto' });
    }
  }
  app.dernierJoueurAffiche = idx;

  // Horloge : défilement vertical vers le numéro visé par le joueur actif.
  if (etat.type === 'horloge' && idx != null) {
    const j = etat.joueurs[idx];
    const ligne = g.querySelector(`[data-ligne="${Math.min(j.cible, SEQUENCE_HORLOGE.length - 1)}"]`);
    const entete = g.querySelector('.cell.entete');
    if (ligne && entete) {
      const haut = ligne.offsetTop - entete.offsetHeight, bas = ligne.offsetTop + ligne.offsetHeight;
      if (haut < g.scrollTop || bas > g.scrollTop + g.clientHeight) {
        g.scrollTo({ top: Math.max(0, haut - g.clientHeight / 3), behavior: scroll ? 'smooth' : 'auto' });
      }
    }
  }
  majIndicateurPoints();
}
function majIndicateurPoints() {
  const g = document.getElementById('grille');
  const ind = document.getElementById('points-indicateur');
  if (!g || !ind) return;
  const colonne = g.querySelector('.cell.joueur');
  if (!colonne || !colonne.offsetWidth) return;
  const premier = Math.round(g.scrollLeft / colonne.offsetWidth);
  ind.querySelectorAll('.point').forEach(pt => {
    const i = Number(pt.dataset.point);
    pt.classList.toggle('actif', i === premier || i === premier + 1);
  });
}

/* ---- 5.5 Modale de saisie ---- */
function flechettesSaisies() { return app.saisie ? app.saisie.flechettes.filter(Boolean) : []; }
// État provisoire : la partie rejouée avec la volée en cours de saisie.
function etatProvisoire() {
  const p = app.partie, s = app.saisie;
  const fl = flechettesSaisies();
  const volees = fl.length ? [...p.volees, { joueurIndex: s.joueurIndex, flechettes: fl, totalDirect: null }] : p.volees;
  return calculerEtat(p.mode, p.options, p.joueurs, volees);
}

function renderModal() {
  const m = document.getElementById('modal');
  const s = app.saisie;
  if (!s || !app.partie) { m.hidden = true; m.innerHTML = ''; return; }
  const p = app.partie;
  const type = MODES[p.mode].type;
  const etat = etatProvisoire();
  const j = etat.joueurs[s.joueurIndex];
  const fl = flechettesSaisies();
  const restantes = 3 - fl.length;

  let etatTxt = '';
  if (type === 'x01') etatTxt = `Reste <b class="num">${j.score}</b>`;
  else if (type === 'cricket') etatTxt = p.options.avecPoints ? `<b class="num">${j.score}</b> pts · ${nbFermees(j)}/7` : `${nbFermees(j)}/7 fermées`;
  else etatTxt = j.cible >= SEQUENCE_HORLOGE.length ? 'Terminé' : `Vise le <b class="num">${SEQUENCE_HORLOGE[j.cible]}</b>`;

  let html = `<div class="feuille"><div class="feuille-entete"><span class="qui">${pastille(j.couleur)}${h(j.nom)}</span><span class="etat">${etatTxt}</span></div>`;
  if (type === 'x01') {
    html += `<div class="onglets"><button class="${s.onglet === 'flechettes' ? 'actif' : ''}" data-action="onglet" data-onglet="flechettes">Fléchettes</button>
      <button class="${s.onglet === 'total' ? 'actif' : ''}" data-action="onglet" data-onglet="total">Total</button></div>`;
  }

  if (s.onglet === 'total' && type === 'x01') {
    if (s.confirmDouble) {
      html += `<div class="confirmation"><div class="question">Terminé sur un double ?</div>
        <div class="rangee-boutons"><button class="danger" data-action="confirmer-double" data-reponse="non">Non (bust)</button>
        <button class="primaire" data-action="confirmer-double" data-reponse="oui">Oui, gagné !</button></div></div>`;
    } else {
      const total = s.total === '' ? null : Number(s.total);
      let indication = '', classe = '';
      if (total != null) {
        if (total > 180 || TOTAUX_IMPOSSIBLES.has(total)) { indication = 'Total impossible avec 3 fléchettes'; classe = 'erreur'; }
        else if (p.options.doubleIn && !j.ouvert) { indication = 'Double in non ouvert : un total direct ne peut pas ouvrir (compte 0).'; classe = 'avertissement'; }
        else if (j.score - total < 0 || (p.options.doubleOut && j.score - total === 1)) { indication = 'Bust : ' + (j.score - total < 0 ? 'dépassement' : 'reste 1'); classe = 'avertissement'; }
        else if (j.score - total === 0) { indication = p.options.doubleOut ? 'Arrivée à 0 : confirmation demandée' : 'Terminé !'; classe = 'finish'; }
        else indication = `→ reste ${j.score - total}`;
      }
      const valide = total != null && total <= 180 && !TOTAUX_IMPOSSIBLES.has(total);
      html += `<div class="affichage-total num">${s.total === '' ? '<span class="muted">0</span>' : h(s.total)}</div>
        <div class="indication ${classe}">${h(indication)}</div>
        <div class="pave pave-total">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(d => `<button data-action="chiffre" data-chiffre="${d}">${d}</button>`).join('')}
          <button data-action="effacer-total">⌫</button><button data-action="chiffre" data-chiffre="0">0</button><button data-action="chiffre" data-chiffre="00">00</button></div>
        <div class="rangee-boutons"><button data-action="fermer-saisie">Retour</button>
          <button class="primaire" data-action="valider-total" ${valide ? '' : 'disabled'}>Valider</button></div>`;
    }
    return void (m.innerHTML = html + `</div>`, m.hidden = false);
  }

  // Onglet Fléchettes
  html += `<div class="emplacements">` + [0, 1, 2].map(i => {
    const f = s.flechettes[i];
    return `<div class="emplacement ${f ? 'rempli' : ''} ${s.curseur === i ? 'actif' : ''}" data-action="emplacement" data-index="${i}">${f ? h(notation(f)) : `<span class="indice">${i + 1}</span>`}</div>`;
  }).join('') + `</div>`;
  html += `<div class="mults">${[[1, 'Simple'], [2, 'Double'], [3, 'Triple']].map(([v, l]) => `<button class="${s.mult === v ? 'actif' : ''}" data-action="mult" data-mult="${v}">${l}</button>`).join('')}</div>`;

  const plein = s.curseur >= 3;
  let classeNum = () => '';
  if (type === 'cricket') classeNum = n => (CIBLES_CRICKET.includes(n) || n === 50) ? 'cible' : 'attenue';
  else if (type === 'horloge') classeNum = n => (j.cible < SEQUENCE_HORLOGE.length && SEQUENCE_HORLOGE[j.cible] === n) ? 'vise' : '';
  html += `<div class="pave">${NUMEROS_PAVE.map(n => `<button class="num ${classeNum(n)}" data-action="secteur" data-secteur="${n}" ${plein ? 'disabled' : ''}>${n}</button>`).join('')}
    <button class="num ${classeNum(25) === 'attenue' ? '' : classeNum(25)}" data-action="secteur" data-secteur="25" ${plein ? 'disabled' : ''}>25</button>
    <button class="num ${classeNum(50) === 'attenue' ? '' : classeNum(50)}" data-action="secteur" data-secteur="50" ${plein ? 'disabled' : ''}>50</button>
    <button class="large rate" data-action="secteur" data-secteur="0" ${plein ? 'disabled' : ''}>Raté</button></div>`;

  let indication = '', classe = '';
  if (type === 'x01') {
    if (restantes > 0 && j.score > 0) {
      const ch = checkout(j.score, restantes, !!p.options.doubleOut);
      if (ch) { indication = 'Finish : ' + texteCheckout(ch); classe = 'finish'; }
      else if (j.score <= 170 && restantes === 3) indication = 'Pas de finish en 3 fléchettes';
      else indication = `${restantes} fléchette${restantes > 1 ? 's' : ''} restante${restantes > 1 ? 's' : ''}`;
    }
    if (p.options.doubleIn && !j.ouvert) indication = 'Double in : il faut un double pour ouvrir. ' + indication;
  } else if (type === 'cricket') {
    const d = etat.volees[etat.volees.length - 1];
    indication = fl.length && d && d.joueurIndex === s.joueurIndex && etat.volees.length > p.volees.length
      ? `${d.marques} marque${d.marques > 1 ? 's' : ''}${p.options.avecPoints && d.points ? ` · ${p.options.cutThroat ? '+' + d.points + ' aux adversaires' : '+' + d.points + ' pts'}` : ''}`
      : 'Cibles : 20 à 15 et la bulle';
  } else {
    indication = j.cible >= SEQUENCE_HORLOGE.length ? 'Horloge terminée !' : `Vise le ${SEQUENCE_HORLOGE[j.cible]}`;
  }
  html += `<div class="indication ${classe}">${h(indication)}</div>
    <div class="rangee-boutons"><button data-action="fermer-saisie">Retour</button>
      <button class="primaire" data-action="valider-volee" ${fl.length ? '' : 'disabled'}>Valider${fl.length && fl.length < 3 ? ` (${fl.length} fl.)` : ''}</button></div>`;
  m.innerHTML = html + `</div>`;
  m.hidden = false;
}

/* ---- Overlays et toast ---- */
let minuteurOverlay = null;
function afficherOverlay(classe, titre, sousHtml, duree) {
  const o = document.getElementById('overlay');
  if (minuteurOverlay) clearTimeout(minuteurOverlay);
  o.className = 'overlay ' + classe;
  o.innerHTML = `<div class="boite" data-action="fermer-overlay"><div class="titre">${h(titre)}</div>${sousHtml ? `<div class="sous">${sousHtml}</div>` : ''}</div>`;
  o.hidden = false;
  minuteurOverlay = setTimeout(cacherOverlay, duree);
}
function cacherOverlay() {
  const o = document.getElementById('overlay');
  if (minuteurOverlay) { clearTimeout(minuteurOverlay); minuteurOverlay = null; }
  o.hidden = true; o.innerHTML = '';
}
let minuteurToast = null;
function toast(msg, duree = 2200) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.hidden = false;
  if (minuteurToast) clearTimeout(minuteurToast);
  minuteurToast = setTimeout(() => { t.hidden = true; }, duree);
}

/* ---- 5.6 Fin de partie / résumé ---- */
function renderFin() {
  const f = app.fin;
  if (!f) { app.ecran = 'accueil'; return renderAccueil(); }
  const g = f.partie;
  const etat = calculerEtat(g.mode, g.options, g.joueurs, g.volees);
  const vainqueurs = new Set(g.vainqueurs || etat.vainqueurs.map(i => g.joueurs[i].id));
  let html = `<div class="ecran"><header class="entete-app"><h1>${f.historique ? 'Résumé' : 'Fin de partie'}</h1>
    <button class="discret" data-action="accueil">Accueil</button></header>
    <p class="muted petit">${h(MODES[g.mode].libelle)} · ${h(libelleOptions(g.mode, g.options))} · ${h(formaterDate(g.dateFin || g.dateDebut))} · ${etat.nbTours} tour${etat.nbTours > 1 ? 's' : ''}</p>`;

  html += `<h2>Classement</h2><div class="carte classement">`;
  etat.classement.forEach((idx, pos) => {
    const j = etat.joueurs[idx];
    const gagnant = vainqueurs.has(j.id);
    let detail = '';
    if (etat.type === 'x01') detail = j.score === 0 ? `fini en ${j.flechettes} fl.` : `reste ${j.score} · moy. ${formaterNombre(moyenneVolee(j))}`;
    else if (etat.type === 'cricket') detail = `${nbFermees(j)}/7 fermées` + (g.options.avecPoints ? ` · ${j.score} pts` : '');
    else detail = (j.cible >= SEQUENCE_HORLOGE.length ? 'terminé' : `arrivé au ${SEQUENCE_HORLOGE[j.cible]}`) + ` · ${j.flechettes} fl.`;
    html += `<div class="rang ${gagnant ? 'vainqueur' : ''}" ${styleTeinte(j.couleur, 0.15)}><span class="position num">${gagnant ? '🏆' : (pos + 1) + '.'}</span>
      <span class="nom">${pastille(j.couleur)}${h(j.nom)}</span><span class="detail num">${h(detail)}</span></div>`;
  });
  if (!vainqueurs.size) html += `<p class="muted petit" style="text-align:center">Partie sans vainqueur.</p>`;
  html += `</div>`;

  html += `<h2>Statistiques</h2><div class="carte table-scroll"><table class="stats"><thead><tr><th></th>${etat.joueurs.map(j => `<th class="num">${pastille(j.couleur)}${h(j.nom)}</th>`).join('')}</tr></thead><tbody>`;
  const lignes = etat.joueurs.map(j => statsJoueurPartie(etat, j));
  lignes[0].forEach((l, i) => {
    html += `<tr><td>${h(l[0])}</td>${lignes.map(lj => `<td class="num">${h(lj[i][1])}</td>`).join('')}</tr>`;
  });
  if (g.options.rencontre) html += `<tr><td>Rencontres</td><td class="num" colspan="${etat.joueurs.length}">${etat.rencontres}</td></tr>`;
  html += `</tbody></table></div>`;

  if (f.historique) {
    html += `<div class="rangee-boutons"><button class="primaire" data-action="accueil">Accueil</button></div>`;
  } else {
    html += `<div class="rangee-boutons"><button class="primaire" data-action="rejouer">Rejouer</button>
      <button data-action="nouvelle-partie-config">Nouvelle partie</button><button data-action="accueil">Accueil</button></div>`;
  }
  return html + `</div>`;
}

/* ---- Réglages ---- */
function renderReglages() {
  return `<div class="ecran"><header class="entete-app"><h1>Réglages</h1>
    <button class="discret" data-action="aller" data-ecran="accueil">Accueil</button></header>
    <div class="carte"><b>Sauvegarde</b>
      <p class="petit muted">${app.stockageOk ? 'Les données sont conservées dans ce navigateur.' : 'Stockage indisponible : rien ne sera conservé après la fermeture.'}
      Exporte régulièrement un fichier de secours (Safari iOS purge les données après ~7 jours sans visite).</p>
      <div class="rangee-boutons"><button data-action="exporter">Exporter</button><button data-action="importer">Importer</button></div>
      <input type="file" accept="application/json,.json" data-change="fichier-import" hidden>
      <p class="petit muted num">${app.joueurs.length} joueur${app.joueurs.length > 1 ? 's' : ''} · ${app.games.length} partie${app.games.length > 1 ? 's' : ''} en historique</p>
    </div>
    <div class="carte"><b>Historique</b>
      <p class="petit muted">Supprime toutes les parties terminées. Les joueurs sont conservés.</p>
      <button class="danger" style="width:100%" data-action="purger" ${app.games.length ? '' : 'disabled'}>Purger l'historique</button>
    </div>
    <p class="petit muted" style="text-align:center">Fonctionne hors ligne, sans serveur. Ajoute <code>?selftest=1</code> à l'adresse pour lancer les tests.</p>
  </div>`;
}

/* =====================================================================
   7. ÉVÉNEMENTS — délégation d'événements, routeur d'écrans
   ===================================================================== */
function aller(ecran) { app.ecran = ecran; app.edition = null; render(); try { window.scrollTo(0, 0); } catch (e) { /* */ } }

function nouvelleConfig(base) {
  const mode = base && MODES[base.mode] ? base.mode : '501';
  const options = { ...optionsParDefaut(mode) };
  if (base && base.options) Object.keys(options).forEach(k => { if (k in base.options) options[k] = !!base.options[k]; });
  const idsValides = new Set(app.joueurs.map(j => j.id));
  return {
    mode, options,
    selection: base ? base.joueurs.map(j => j.id).filter(id => idsValides.has(id)) : [],
    rencontre: !!(base && base.options && base.options.rencontre),
  };
}

function demarrerPartie() {
  const c = app.config;
  if (validerConfig(c)) return;
  const cutThroat = MODES[c.mode].type === 'cricket' && c.options.cutThroat;
  app.partie = {
    id: genererId(),
    dateDebut: new Date().toISOString(),
    mode: c.mode,
    options: { ...c.options, rencontre: cutThroat ? false : !!c.rencontre },
    joueurs: c.selection.map(id => { const j = joueurParId(id); return { id: j.id, nom: j.nom, couleur: j.couleur }; }),
    volees: [],
  };
  app.dernierJoueurAffiche = null;
  app.saisie = null;
  sauvegarderMaintenant();
  aller('partie');
}

function ouvrirSaisie() {
  const etat = etatCourant();
  if (!etat || etat.joueurCourant == null) return;
  app.saisie = { joueurIndex: etat.joueurCourant, onglet: 'flechettes', flechettes: [null, null, null], curseur: 0, mult: 1, total: '', confirmDouble: false };
  renderModal();
}
function fermerSaisie() { app.saisie = null; renderModal(); }

function terminerPartie(etat) {
  const p = app.partie;
  const entree = {
    id: p.id, dateDebut: p.dateDebut, dateFin: new Date().toISOString(), mode: p.mode, options: p.options,
    joueurs: p.joueurs, volees: p.volees,
    vainqueurs: etat.vainqueurs.map(i => p.joueurs[i].id),
    classement: etat.classement.map(i => p.joueurs[i].id),
  };
  app.games.push(entree);
  app.games = app.games.slice(-MAX_HISTORIQUE);
  app.partie = null;
  app.fin = { partie: entree, historique: false };
  sauvegarderMaintenant();
  vibrer([60, 40, 60, 40, 120]);
  aller('fin');
}

function ajouterVolee(volee) {
  const p = app.partie;
  p.volees.push(volee);
  const etat = etatCourant();
  const d = etat.volees[etat.volees.length - 1];
  const bust = !!(d && d.bust);
  if (bust) { afficherOverlay('bust', 'CASSÉ !', `${h(p.joueurs[volee.joueurIndex].nom)} reste à ${d.scoreApres}`, 1300); vibrer([90, 50, 90]); }
  else vibrer(25);
  if (p.options.rencontre && etat.rencontreVolee === p.volees.length - 1) {
    const sous = etat.rencontreGroupes.map(g => `<div>${g.indices.map(i => pastille(p.joueurs[i].couleur) + h(p.joueurs[i].nom)).join(' & ')}</div>`).join('');
    const montrer = () => { afficherOverlay('rencontre', 'RENCONTRE !', sous, 2000); vibrer([40, 40, 40]); };
    if (bust) setTimeout(montrer, 1300); else montrer();
  }
  fermerSaisie();
  if (etat.termine) terminerPartie(etat);
  else { sauvegarderDifferee(); render(); }
}

function validerVoleeFlechettes() {
  const s = app.saisie;
  const fl = flechettesSaisies();
  if (!s || !fl.length) return;
  ajouterVolee({ joueurIndex: s.joueurIndex, flechettes: fl, totalDirect: null });
}
function validerVoleeTotal(finiSurDouble) {
  const s = app.saisie;
  const total = Number(s.total);
  if (!(total >= 0) || total > 180 || TOTAUX_IMPOSSIBLES.has(total)) return;
  ajouterVolee({ joueurIndex: s.joueurIndex, flechettes: [], totalDirect: total, finiSurDouble: !!finiSurDouble });
}

function saisirFlechette(secteur) {
  const s = app.saisie, p = app.partie;
  if (!s || s.curseur >= 3) return;
  s.flechettes[s.curseur] = flechette(secteur, s.mult);
  s.mult = 1;
  const prochain = s.flechettes.findIndex(f => !f);
  s.curseur = prochain < 0 ? 3 : prochain;
  vibrer(12);
  // x01 : un bust ou une arrivée à 0 ferme immédiatement le tour.
  if (MODES[p.mode].type === 'x01') {
    const etat = etatProvisoire();
    const d = etat.volees[etat.volees.length - 1];
    if (d && etat.volees.length > p.volees.length && (d.bust || d.fini)) { validerVoleeFlechettes(); return; }
  }
  renderModal();
}

function enregistrerJoueur() {
  const e = app.edition;
  if (!e) return;
  const nom = (e.nom || '').trim();
  if (nom.length < 1 || nom.length > 20) { e.erreur = 'Le nom doit faire entre 1 et 20 caractères.'; render(); return; }
  const doublon = app.joueurs.find(j => j.id !== e.id && j.nom.toLowerCase() === nom.toLowerCase());
  if (doublon) { e.erreur = 'Ce nom existe déjà.'; render(); return; }
  if (e.id) {
    const j = joueurParId(e.id);
    if (j) { j.nom = nom; j.couleur = e.couleur; }
  } else {
    app.joueurs.push({ id: genererId(), nom, couleur: e.couleur, createdAt: new Date().toISOString() });
  }
  app.edition = null;
  sauvegarderMaintenant();
  render();
}
function couleurLibre() {
  const prises = new Set(app.joueurs.map(j => j.couleur));
  return (PALETTE.find(c => !prises.has(c.hex)) || PALETTE[0]).hex;
}

const ACTIONS = {
  'aller': el => aller(el.dataset.ecran),
  'accueil': () => { app.fin = null; aller('accueil'); },
  'nouvelle-partie': () => { app.config = nouvelleConfig(null); aller('config'); },
  'reprendre': () => { if (app.partie) { app.dernierJoueurAffiche = null; aller('partie'); } },
  'abandonner-courante': () => {
    if (!app.partie) return;
    if (!confirm('Abandonner la partie en cours ? Elle ne sera pas enregistrée.')) return;
    app.partie = null; sauvegarderMaintenant(); render();
  },
  'ouvrir-resume': el => {
    const g = app.games.find(x => x.id === el.dataset.id);
    if (!g) return;
    app.fin = { partie: g, historique: true };
    aller('fin');
  },
  // Joueurs
  'nouveau-joueur': () => { app.edition = { id: null, nom: '', couleur: couleurLibre(), erreur: '' }; render(); },
  'editer-joueur': el => { const j = joueurParId(el.dataset.id); if (j) { app.edition = { id: j.id, nom: j.nom, couleur: j.couleur, erreur: '' }; render(); } },
  'choisir-couleur': el => { if (app.edition) { app.edition.couleur = el.dataset.hex; render(); } },
  'enregistrer-joueur': enregistrerJoueur,
  'annuler-edition': () => { app.edition = null; render(); },
  'supprimer-joueur': el => {
    const j = joueurParId(el.dataset.id);
    if (!j) return;
    if (!confirm(`Supprimer ${j.nom} ? Ses parties passées restent dans l'historique.`)) return;
    app.joueurs = app.joueurs.filter(x => x.id !== j.id);
    app.edition = null; sauvegarderMaintenant(); render();
  },
  // Configuration
  'basculer-joueur': el => {
    const c = app.config, id = el.dataset.id;
    const pos = c.selection.indexOf(id);
    if (pos >= 0) c.selection.splice(pos, 1);
    else if (c.selection.length >= MAX_JOUEURS_PARTIE) { toast(`Maximum ${MAX_JOUEURS_PARTIE} joueurs par partie`); return; }
    else c.selection.push(id);
    render();
  },
  'lancer-partie': demarrerPartie,
  'expliquer-rencontre': () => toast('Rencontre indisponible en cut throat : on donne ses points aux autres.'),
  // Partie
  'ouvrir-saisie': ouvrirSaisie,
  'annuler-volee': () => {
    const p = app.partie;
    if (!p || !p.volees.length) return;
    p.volees.pop();
    app.saisie = null;
    cacherOverlay();
    sauvegarderDifferee();
    vibrer(15);
    render();
  },
  'quitter': () => {
    if (!app.partie) return;
    if (!confirm('Quitter et abandonner la partie ? Elle ne sera pas enregistrée.')) return;
    app.partie = null; app.saisie = null; sauvegarderMaintenant(); aller('accueil');
  },
  // Modale
  'onglet': el => { if (app.saisie) { app.saisie.onglet = el.dataset.onglet; app.saisie.confirmDouble = false; renderModal(); } },
  'emplacement': el => {
    const s = app.saisie; if (!s) return;
    const i = Number(el.dataset.index);
    if (s.flechettes[i]) { s.curseur = i; renderModal(); }
  },
  'mult': el => { if (app.saisie) { app.saisie.mult = Number(el.dataset.mult); renderModal(); } },
  'secteur': el => saisirFlechette(Number(el.dataset.secteur)),
  'valider-volee': validerVoleeFlechettes,
  'fermer-saisie': fermerSaisie,
  'chiffre': el => {
    const s = app.saisie; if (!s) return;
    const t = (s.total + el.dataset.chiffre).replace(/^0+(?=\d)/, '');
    if (t.length > 3) return;
    s.total = t; renderModal();
  },
  'effacer-total': () => { const s = app.saisie; if (!s) return; s.total = s.total.slice(0, -1); renderModal(); },
  'valider-total': () => {
    const s = app.saisie, p = app.partie; if (!s) return;
    const total = Number(s.total);
    if (!(total >= 0) || total > 180 || TOTAUX_IMPOSSIBLES.has(total)) return;
    const j = etatCourant().joueurs[s.joueurIndex];
    if (p.options.doubleOut && j.ouvert && j.score - total === 0) { s.confirmDouble = true; renderModal(); return; }
    validerVoleeTotal(false);
  },
  'confirmer-double': el => validerVoleeTotal(el.dataset.reponse === 'oui'),
  // Fin
  'rejouer': () => { if (app.fin) { app.config = nouvelleConfig(app.fin.partie); app.fin = null; if (validerConfig(app.config)) aller('config'); else demarrerPartie(); } },
  'nouvelle-partie-config': () => { app.config = nouvelleConfig(app.fin ? app.fin.partie : null); app.fin = null; aller('config'); },
  // Réglages
  'exporter': () => { try { exporterJson(); } catch (e) { toast('Export impossible'); } },
  'importer': () => { const inp = document.querySelector('input[data-change="fichier-import"]'); if (inp) inp.click(); },
  'purger': () => {
    if (!confirm('Purger tout l\'historique des parties ?')) return;
    if (!confirm('Vraiment ? Cette action est définitive.')) return;
    app.games = []; sauvegarderMaintenant(); toast('Historique purgé'); render();
  },
  'fermer-overlay': cacherOverlay,
};

const CHANGEMENTS = {
  'mode': el => { const c = app.config; c.mode = el.value; c.options = { ...optionsParDefaut(c.mode) }; render(); },
  'option': el => {
    const c = app.config, cle = el.dataset.cle;
    c.options[cle] = el.checked;
    if (cle === 'cutThroat' && el.checked) c.options.avecPoints = true;   // cut throat force « avec points »
    render();
  },
  'rencontre': el => { app.config.rencontre = el.checked; render(); },
  'fichier-import': el => {
    const fichier = el.files && el.files[0];
    if (!fichier) return;
    const lecteur = new FileReader();
    lecteur.onload = () => {
      try {
        const donnees = JSON.parse(lecteur.result);
        const joueurs = Array.isArray(donnees.players) ? donnees.players.filter(joueurValide).length : 0;
        const games = Array.isArray(donnees.games) ? donnees.games.filter(partieValide).length : 0;
        if (!confirm(`Importer ${joueurs} joueur${joueurs > 1 ? 's' : ''} et ${games} partie${games > 1 ? 's' : ''} ? Les éléments déjà présents sont conservés.`)) return;
        const r = fusionnerImport(donnees);
        sauvegarderMaintenant();
        toast(`Importé : ${r.joueurs} joueur${r.joueurs > 1 ? 's' : ''}, ${r.games} partie${r.games > 1 ? 's' : ''}`);
        render();
      } catch (e) { toast('Fichier invalide'); }
    };
    lecteur.onerror = () => toast('Lecture impossible');
    lecteur.readAsText(fichier);
    el.value = '';
  },
};

function installerEvenements() {
  document.addEventListener('click', ev => {
    const el = ev.target.closest('[data-action]');
    if (!el || el.disabled) return;
    const action = ACTIONS[el.dataset.action];
    if (!action) return;
    ev.preventDefault();
    action(el, ev);
  });
  document.addEventListener('change', ev => {
    const el = ev.target.closest('[data-change]');
    if (!el) return;
    const fn = CHANGEMENTS[el.dataset.change];
    if (fn) fn(el, ev);
  });
  document.addEventListener('input', ev => {
    const el = ev.target;
    if (el && el.dataset && el.dataset.input === 'nom-joueur' && app.edition) app.edition.nom = el.value;
  });
  document.addEventListener('keydown', ev => {
    if (ev.key === 'Enter' && ev.target && ev.target.dataset && ev.target.dataset.input === 'nom-joueur') { ev.preventDefault(); enregistrerJoueur(); }
    if (ev.key === 'Escape') { if (app.saisie) fermerSaisie(); cacherOverlay(); }
  });
  // Un tap n'importe où fait disparaître l'overlay plus tôt (sans bloquer le jeu derrière).
  document.addEventListener('pointerdown', () => { if (!document.getElementById('overlay').hidden) cacherOverlay(); }, true);
  // Indicateur de position des colonnes (délégué : la grille est recréée à chaque rendu).
  document.addEventListener('scroll', ev => { if (ev.target && ev.target.id === 'grille') majIndicateurPoints(); }, true);
  // Sauvegarde immédiate quand l'onglet est fermé ou mis en arrière-plan.
  window.addEventListener('pagehide', sauvegarderMaintenant);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') sauvegarderMaintenant(); });
}

function demarrer() {
  chargerTout();
  app.config = nouvelleConfig(null);
  installerEvenements();
  render();
  if (/[?&]selftest=1/.test(location.search)) {
    const r = selfTest();
    const b = document.getElementById('selftest');
    b.className = 'selftest ' + (r.echecs.length ? 'ko' : 'ok');
    b.textContent = `Self-test : ${r.reussis}/${r.total}` + (r.echecs.length ? '\n' + r.echecs.join('\n') : ' ✔');
    b.hidden = false;
    b.onclick = () => { b.hidden = true; };
  }
}

/* =====================================================================
   8. SELF-TEST — assertions sur le moteur pur (?selftest=1)
   ===================================================================== */
function selfTest() {
  const joueursTest = n => Array.from({ length: n }, (_, i) => ({ id: 'j' + i, nom: 'Joueur ' + (i + 1), couleur: PALETTE[i].hex }));
  const V = (joueurIndex, txt) => ({ joueurIndex, flechettes: txt.split(/\s+/).filter(Boolean).map(analyserNotation), totalDirect: null });
  const etat = (mode, options, n, volees) => calculerEtat(mode, options, joueursTest(n), volees);
  const X01 = { doubleIn: false, doubleOut: false };
  const DO = { doubleIn: false, doubleOut: true };
  const CR = { avecPoints: true, cutThroat: false };
  const assert = (cond, msg) => { if (!cond) throw new Error(msg); };
  const derniere = e => e.volees[e.volees.length - 1];
  // Amène le joueur 0 (partie à 1 joueur) à un score donné en straight out, via un total direct.
  const versScore = (depart, score) => ({ joueurIndex: 0, flechettes: [], totalDirect: depart - score });

  const tests = [
    ['x01 · 501, T20 T20 T20 → reste 321, total 180', () => {
      const e = etat('501', X01, 1, [V(0, 'T20 T20 T20')]);
      assert(e.joueurs[0].score === 321, 'reste ' + e.joueurs[0].score);
      assert(derniere(e).total === 180, 'total ' + derniere(e).total);
    }],
    ['x01 · double out, 40, D20 → victoire', () => {
      const e = etat('501', DO, 1, [versScore(501, 40), V(0, 'D20')]);
      assert(e.joueurs[0].score === 0 && e.termine && e.vainqueurs.length === 1 && e.vainqueurs[0] === 0, 'pas de victoire');
    }],
    ['x01 · double out, 32, 20 20 20 → bust, reste 32', () => {
      const e = etat('501', DO, 1, [versScore(501, 32), V(0, '20 20 20')]);
      assert(derniere(e).bust && e.joueurs[0].score === 32, 'reste ' + e.joueurs[0].score);
    }],
    ['x01 · double out, 32, 16 16 → bust (0 sans double), reste 32', () => {
      const e = etat('501', DO, 1, [versScore(501, 32), V(0, '16 16')]);
      assert(derniere(e).bust && e.joueurs[0].score === 32 && !e.termine, 'attendu bust');
    }],
    ['x01 · straight out, 32, 16 16 → victoire', () => {
      const e = etat('501', X01, 1, [versScore(501, 32), V(0, '16 16')]);
      assert(!derniere(e).bust && e.joueurs[0].score === 0 && e.termine, 'attendu victoire');
    }],
    ['x01 · double out, 2, 1 → bust (score = 1)', () => {
      const e = etat('501', DO, 1, [versScore(501, 2), V(0, '1')]);
      assert(derniere(e).bust && e.joueurs[0].score === 2, 'reste ' + e.joueurs[0].score);
    }],
    ['x01 · double in, 501, 20 T20 D5 → reste 491', () => {
      const e = etat('501', { doubleIn: true, doubleOut: false }, 1, [V(0, '20 T20 D5')]);
      assert(e.joueurs[0].score === 491 && e.joueurs[0].ouvert, 'reste ' + e.joueurs[0].score);
    }],
    ['x01 · après un bust, la main passe au joueur suivant', () => {
      const e = etat('301', DO, 2, [V(0, 'T20 T20 T20'), V(1, '20 20 20'), V(0, 'T20 T20 T20')]);
      const d = derniere(e);
      assert(d.bust && d.flechettes.length === 2, 'bust attendu dès la 2e fléchette (reste 1)');
      assert(e.joueurCourant === 1 && e.joueurs[0].score === 121, 'joueur courant ' + e.joueurCourant);
    }],
    ['cricket · 2 marques sur 20, T20, adversaire ouvert → fermé + 40 pts', () => {
      const e = etat('cricket', CR, 2, [V(0, 'D20'), V(1, '—'), V(0, 'T20')]);
      assert(e.joueurs[0].marques[20] === 3 && e.joueurs[0].score === 40, 'score ' + e.joueurs[0].score);
    }],
    ['cricket · même cas, adversaire a fermé le 20 → 0 point', () => {
      const e = etat('cricket', CR, 2, [V(0, 'D20'), V(1, 'T20'), V(0, 'T20')]);
      assert(e.joueurs[0].marques[20] === 3 && e.joueurs[0].score === 0, 'score ' + e.joueurs[0].score);
    }],
    ['cricket · cut throat : +40 à chaque adversaire non fermé', () => {
      const e = etat('cricket', { avecPoints: true, cutThroat: true }, 3, [V(0, 'D20'), V(1, 'T20'), V(2, '—'), V(0, 'T20')]);
      assert(e.joueurs[0].score === 0 && e.joueurs[1].score === 0 && e.joueurs[2].score === 40, 'scores ' + e.joueurs.map(j => j.score));
    }],
    ['cricket · demi-bulle = 1 marque, bulle = 2 marques', () => {
      const e = etat('cricket', CR, 2, [V(0, '25'), V(1, '50')]);
      assert(e.joueurs[0].marques[25] === 1 && e.joueurs[1].marques[25] === 2, 'marques ' + e.joueurs[0].marques[25] + '/' + e.joueurs[1].marques[25]);
    }],
    ['cricket · tout fermé mais mené aux points → pas vainqueur', () => {
      const e = etat('cricket', CR, 2, [V(0, 'T19 T18 T17'), V(1, 'T20 T20 T20'), V(0, 'T16 T15 50'), V(1, '— — —'), V(0, '25 T20 —'), V(1, '—')]);
      assert(nbFermees(e.joueurs[0]) === 7, 'fermées ' + nbFermees(e.joueurs[0]));
      assert(e.joueurs[1].score === 120 && e.joueurs[0].score === 0, 'points ' + e.joueurs[0].score + '/' + e.joueurs[1].score);
      assert(!e.termine && !e.dernierTour && e.vainqueurs.length === 0 && e.joueurCourant === 0, 'la partie devrait continuer');
    }],
    ['horloge · sur le 5, 5 D6 T7 → vise le 8', () => {
      const e = etat('horloge', {}, 1, [V(0, '1 2 3'), V(0, '4 — —'), V(0, '5 D6 T7')]);
      assert(SEQUENCE_HORLOGE[e.joueurs[0].cible] === 8, 'vise ' + SEQUENCE_HORLOGE[e.joueurs[0].cible]);
    }],
    ['horloge · sur le 5, D5 → vise le 6', () => {
      const e = etat('horloge', {}, 1, [V(0, '1 2 3'), V(0, '4 — —'), V(0, 'D5')]);
      assert(SEQUENCE_HORLOGE[e.joueurs[0].cible] === 6, 'vise ' + SEQUENCE_HORLOGE[e.joueurs[0].cible]);
    }],
    ['checkout · 170, 3 fl., double out → T20 T20 50', () => {
      assert(texteCheckout(checkout(170, 3, true)) === 'T20 → T20 → 50', texteCheckout(checkout(170, 3, true)));
    }],
    ['checkout · 2, 1 fl., double out → D1', () => {
      assert(texteCheckout(checkout(2, 1, true)) === 'D1', texteCheckout(checkout(2, 1, true)));
    }],
    ['checkout · 169, 3 fl., double out → aucun (bogey : 169 168 166 165 163 162 159)', () => {
      [169, 168, 166, 165, 163, 162, 159].forEach(b => assert(checkout(b, 3, true) === null, b + ' aurait un finish'));
      assert(checkout(167, 3, true) !== null && checkout(164, 3, true) !== null, '167/164 devraient avoir un finish');
    }],
    ['checkout · 1, 3 fl., double out → aucun', () => {
      assert(checkout(1, 3, true) === null, 'finish trouvé pour 1');
    }],
    ['rencontre · deux joueurs au même score après une volée chacun → déclenchement', () => {
      const e = etat('501', X01, 2, [V(0, 'T20 T20 D20'), V(1, 'T20 T20 D20')]);
      assert(e.rencontres === 1 && e.rencontreVolee === 1, 'rencontres ' + e.rencontres);
      assert(e.rencontreGroupes.length === 1 && e.rencontreGroupes[0].indices.join() === '0,1', 'groupes');
      // La même égalité non rompue ne se re-signale pas ; une nouvelle égalité, si.
      const e2 = etat('501', X01, 2, [V(0, 'T20 T20 D20'), V(1, 'T20 T20 D20'), V(0, '—'), V(1, '—')]);
      assert(e2.rencontres === 1 && e2.rencontreVolee === 1, 'ré-affichage parasite');
      const e3 = etat('501', X01, 2, [V(0, 'T20 T20 D20'), V(1, 'T20 T20 D20'), V(0, '20'), V(1, '20')]);
      assert(e3.rencontres === 2 && e3.rencontreVolee === 3, 'nouvelle égalité non signalée');
    }],
    ['rencontre · deux joueurs à 501 avant toute volée → pas de déclenchement', () => {
      const e = etat('501', X01, 2, []);
      assert(e.rencontres === 0 && e.rencontreVolee === -1, 'rencontres ' + e.rencontres);
      const e2 = etat('501', X01, 2, [V(0, '—')]);   // un seul a joué : toujours rien
      assert(e2.rencontres === 0, 'déclenché après une seule volée');
    }],
    ['annulation · 5 volées, 3 annulations ≡ état après 2 volées', () => {
      const volees = [V(0, 'T20 19 D7'), V(1, '20 20 20'), V(0, 'T19 T19 25'), V(1, '50 1 T3'), V(0, '5 5 5')];
      const attendu = JSON.stringify(etat('501', DO, 2, volees.slice(0, 2)));
      const copie = volees.slice();
      copie.pop(); copie.pop(); copie.pop();
      assert(JSON.stringify(etat('501', DO, 2, copie)) === attendu, 'états différents');
    }],
  ];

  const echecs = [];
  tests.forEach(([nom, fn], i) => {
    try { fn(); console.log(`✔ ${i + 1}. ${nom}`); }
    catch (e) { echecs.push(`✘ ${i + 1}. ${nom} — ${e.message}`); console.error(`✘ ${i + 1}. ${nom}`, e); }
  });
  const r = { total: tests.length, reussis: tests.length - echecs.length, echecs };
  console.log(`Self-test : ${r.reussis}/${r.total}`);
  return r;
}

if (typeof document !== 'undefined') {
  window.dartsSelfTest = selfTest;
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', demarrer);
  else demarrer();
}
</script>
