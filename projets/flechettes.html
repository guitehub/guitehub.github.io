    html += `<div class="cell lab ${band}" data-ligne="${idx}"><span class="lname num">${num === 50 ? 'Bulle' : num}</span></div>`;
    etat.joueurs.forEach(j => {
      const contenu = j.cible > idx ? `<span class="ok">✓</span>` : j.cible === idx ? `<span class="aim">◎</span>` : '';
      html += celluleVal(etat, j, contenu, band);
    });
  });
  return html;
}

function renderPartie() {
  const p = app.partie;
  if (!p) { app.ecran = 'accueil'; return renderAccueil(); }
  const etat = etatCourant();
  const n = p.joueurs.length;
  const colonnes = `var(--label-w) repeat(${n}, calc((100% - var(--label-w)) / ${Math.min(2, n)}))`;
  const courant = etat.joueurCourant != null ? etat.joueurs[etat.joueurCourant] : null;

  let corps = `<div class="turn" ${styleJoueur(courant ? courant.couleur : '#8C949D', 0.16)}><i></i><span>${courant ? 'Au tour de ' + h(courant.nom) : ''}</span>
    ${etat.dernierTour ? `<span class="last">DERNIER TOUR</span>` : `<span class="x num">Tour ${etat.tour}</span>`}</div>`;
  corps += `<div class="sheet ${etat.type}" id="grille" style="grid-template-columns:${colonnes}" aria-label="Feuille de score">`;
  corps += `<div class="cell corner"><span class="k">${etat.type === 'x01' ? 'Volée' : etat.type === 'cricket' ? 'Cible' : 'Numéro'}</span><span class="v num">Tour ${etat.tour}</span></div>`;
  etat.joueurs.forEach(j => { corps += celluleEnteteJoueur(etat, j); });
  if (etat.type === 'x01') corps += lignesX01(etat);
  else if (etat.type === 'cricket') corps += lignesCricket(etat);
  else corps += lignesHorloge(etat);
  corps += `</div>`;
  if (n > 2) corps += `<div class="dots" id="points-indicateur">${etat.joueurs.map(j => `<i data-point="${j.index}" style="--pc:${h(j.couleur)}"></i>`).join('')}</div>`;

  const pied = `<div class="footer"><div class="row">
    <button class="btn btn-ghost" data-action="annuler-volee" ${p.volees.length ? '' : 'disabled'}>Annuler</button>
    <button class="btn btn-player grow" data-action="ouvrir-saisie" ${courant ? styleJoueur(courant.couleur) : 'disabled'}>Saisir la volée<small>${courant ? h(courant.nom) : ''}</small></button>
  </div></div>`;
  const centre = `<div class="bar-title">${h(MODES[p.mode].libelle)}<span class="bar-sub">${h(libelleOptions(p.mode, p.options))}</span></div>`;
  const droite = `<button class="iconbtn" data-action="menu-partie" aria-label="Options de la partie">${icone(IC.more)}</button>`;
  // Le corps de cet écran n'est pas un .scroll : la grille est son propre défilement.
  const avert = app.stockageOk ? '' : `<div class="storage-warn">Stockage indisponible : la partie ne sera pas sauvegardée.</div>`;
  return `<div class="screen">${barre(boutonRetour(), centre, droite)}${avert}${corps}${pied}</div>`;
}

function apresRenderPartie(scroll) {
  const g = document.getElementById('grille');
  if (!g) return;
  const etat = etatCourant();
  if (scroll) { g.scrollLeft = scroll.left; g.scrollTop = scroll.top; }
  const n = etat.joueurs.length;
  const idx = etat.joueurCourant;
  const largeurLibelle = (g.querySelector('.lab') || {}).offsetWidth || 64;
  const colonne = g.querySelector('.val');
  const largeurCol = colonne ? colonne.offsetWidth : 0;

  // Défilement horizontal vers la colonne du joueur courant si elle n'est pas visible.
  if (idx != null && n > 2 && largeurCol > 0 && app.dernierJoueurAffiche !== idx) {
    const debut = largeurLibelle + idx * largeurCol;
    const visibleDebut = g.scrollLeft + largeurLibelle, visibleFin = g.scrollLeft + g.clientWidth;
    if (debut < visibleDebut - 2 || debut + largeurCol > visibleFin + 2) {
      g.scrollTo({ left: idx * largeurCol, behavior: scroll ? 'smooth' : 'auto' });
    }
  }
  app.dernierJoueurAffiche = idx;

  // Horloge : défilement vertical vers le numéro visé par le joueur actif.
  if (etat.type === 'horloge' && idx != null) {
    const j = etat.joueurs[idx];
    const ligne = g.querySelector(`[data-ligne="${Math.min(j.cible, SEQUENCE_HORLOGE.length - 1)}"]`);
    const entete = g.querySelector('.phead');
    if (ligne && entete && ligne.offsetHeight) {
      const haut = ligne.offsetTop - entete.offsetHeight, bas = ligne.offsetTop + ligne.offsetHeight;
      if (haut < g.scrollTop || bas > g.scrollTop + g.clientHeight) {
        g.scrollTo({ top: Math.max(0, haut - g.clientHeight / 3), behavior: scroll ? 'smooth' : 'auto' });
      }
    }
  }
  majIndicateurPoints();
}
function majIndicateurPoints() {
  const g = document.getElementById('grille');
  const ind = document.getElementById('points-indicateur');
  if (!g || !ind) return;
  const colonne = g.querySelector('.val');
  if (!colonne || !colonne.offsetWidth) return;
  const premier = Math.round(g.scrollLeft / colonne.offsetWidth);
  ind.querySelectorAll('i').forEach(pt => {
    const i = Number(pt.dataset.point);
    pt.classList.toggle('on', i === premier || i === premier + 1);
  });
}

/* ---- 5.5 Feuilles : saisie, formulaire joueur, menus, dialogues ---- */
function flechettesSaisies() { return app.saisie ? app.saisie.flechettes.filter(Boolean) : []; }
// État provisoire : la partie rejouée avec la volée en cours de saisie.
function etatProvisoire() {
  const p = app.partie, s = app.saisie;
  const fl = flechettesSaisies();
  const volees = fl.length ? [...p.volees, { joueurIndex: s.joueurIndex, flechettes: fl, totalDirect: null }] : p.volees;
  return calculerEtat(p.mode, p.options, p.joueurs, volees);
}

function feuilleHtml(titre, sous, corps, actions, fermer = 'fermer-feuille') {
  return `<div class="scrim" data-action="${fermer}"></div>
    <div class="sheetp" role="dialog" aria-modal="true">
      <div class="mhead"><div class="grab"></div><div class="mhead-row"><div class="grow"><div class="mtitle">${titre}</div>${sous ? `<div class="msub">${sous}</div>` : ''}</div>
        <button class="iconbtn" data-action="${fermer}" aria-label="Fermer">${icone(IC.close)}</button></div></div>
      <div class="mbody">${corps}</div>${actions ? `<div class="mactions">${actions}</div>` : ''}</div>`;
}

function renderModal() {
  const m = document.getElementById('modal');
  let html = '';
  if (app.dialogue) html = renderDialogue();
  else if (app.saisie && app.partie) html = renderSaisie();
  else if (app.edition) html = renderFormulaireJoueur();
  else if (app.feuille) html = renderMenu();
  m.innerHTML = html;
  m.classList.toggle('open', !!html);
  if (app.edition && app.edition.focus) {
    app.edition.focus = false;
    const inp = m.querySelector('input[data-input="nom-joueur"]');
    if (inp) { try { inp.focus(); } catch (e) { /* */ } }
  }
}

function renderDialogue() {
  const d = app.dialogue;
  return `<div class="scrim" data-action="dlg-annuler"></div><div class="dlg" role="alertdialog" aria-modal="true"><h3>${h(d.titre)}</h3><p>${h(d.texte)}</p>
    <div class="dlg-a"><button class="btn btn-ghost" data-action="dlg-annuler">Annuler</button>
    <button class="btn ${d.danger ? 'btn-danger' : 'btn-primary'}" data-action="dlg-ok">${h(d.ok || 'OK')}</button></div></div>`;
}

function renderMenu() {
  const f = app.feuille;
  if (f.type === 'reglages') {
    const corps = `<div class="menu">
      <button data-action="exporter">Exporter les données<small>fichier .json</small></button>
      <button data-action="importer">Importer un fichier<small>fusion par identifiant</small></button>
      ${app.partie ? `<button class="dang" data-action="abandonner-courante">Abandonner la partie en cours</button>` : ''}
      <button class="dang" data-action="purger" ${app.games.length ? '' : 'disabled'}>Purger l'historique</button></div>
      <p class="warn">Tout reste dans ce navigateur, hors ligne. Safari iOS efface les données d'un site non visité depuis 7 jours : exporter de temps en temps.</p>`;
    return feuilleHtml('Réglages', `${pluriel(app.joueurs.length, 'joueur')} · ${pluriel(app.games.length, 'partie')} en historique`, corps);
  }
  if (f.type === 'joueur') {
    const j = joueurParId(f.id);
    if (!j) return '';
    const corps = `<div class="menu"><button data-action="editer-joueur" data-id="${h(j.id)}">Modifier le nom ou la couleur</button>
      <button class="dang" data-action="supprimer-joueur" data-id="${h(j.id)}">Supprimer ce joueur</button></div>`;
    return feuilleHtml(`${puce(j.couleur)}${h(j.nom)}`, 'Ses parties passées restent dans l\'historique.', corps);
  }
  if (f.type === 'partie' && app.partie) {
    const p = app.partie;
    const corps = `<div class="menu"><button data-action="annuler-volee" ${p.volees.length ? '' : 'disabled'}>Annuler la dernière volée<small>${pluriel(p.volees.length, 'volée')}</small></button>
      <button data-action="aller" data-ecran="accueil">Mettre en pause<small>reprise depuis l'accueil</small></button>
      <button class="dang" data-action="quitter">Abandonner la partie</button></div>`;
    return feuilleHtml('Partie en cours', `${h(MODES[p.mode].libelle)} · ${h(libelleOptions(p.mode, p.options))}`, corps);
  }
  return '';
}

function renderFormulaireJoueur() {
  const e = app.edition;
  const prises = new Set(app.joueurs.filter(j => j.id !== e.id).map(j => j.couleur));
  let avert = e.erreur ? `<div class="warn bad">${h(e.erreur)}</div>` : prises.has(e.couleur) ? `<div class="warn">Cette couleur est déjà celle d'un autre joueur.</div>` : `<div class="warn"></div>`;
  const corps = `<input type="text" class="field" maxlength="20" placeholder="Nom du joueur" value="${h(e.nom)}" data-input="nom-joueur" autocomplete="off" autocapitalize="words" enterkeyhint="done">
    <div class="swatches">${PALETTE.map(c => `<button class="sw ${c.hex === e.couleur ? 'sel' : ''} ${prises.has(c.hex) ? 'taken' : ''}" style="--pc:${c.hex}" data-action="choisir-couleur" data-hex="${c.hex}" aria-label="${c.nom}"><i></i></button>`).join('')}</div>${avert}`;
  const actions = `<button class="btn btn-ghost" data-action="annuler-edition">Annuler</button><button class="btn btn-primary" data-action="enregistrer-joueur">${e.id ? 'Enregistrer' : 'Créer'}</button>`;
  return feuilleHtml(e.id ? 'Modifier le joueur' : 'Nouveau joueur', '1 à 20 caractères, nom unique.', corps, actions, 'annuler-edition');
}

function renderSaisie() {
  const s = app.saisie, p = app.partie;
  const type = MODES[p.mode].type;
  const etat = etatProvisoire();
  const j = etat.joueurs[s.joueurIndex];
  const fl = flechettesSaisies();
  const restantes = 3 - fl.length;

  let sous = '';
  if (type === 'x01') {
    sous = `Reste <b class="num">${j.score}</b>`;
    if (restantes > 0 && j.score > 0 && j.ouvert) {
      const ch = checkout(j.score, restantes, !!p.options.doubleOut);
      if (ch) sous += ` · Finish <b class="num">${h(texteCheckout(ch))}</b>`;
      else if (j.score <= 170 && restantes === 3) sous += ' · pas de finish';
    }
  } else if (type === 'cricket') sous = p.options.avecPoints ? `<b class="num">${j.score}</b> pts · ${nbFermees(j)}/7 fermées` : `${nbFermees(j)}/7 fermées`;
  else sous = j.cible >= SEQUENCE_HORLOGE.length ? 'Horloge terminée' : `Vise le <b class="num">${SEQUENCE_HORLOGE[j.cible]}</b>`;
  const titre = `${puce(j.couleur)}${h(j.nom)}`;

  let corps = '';
  if (type === 'x01') {
    corps += `<div class="tabs"><button class="tab ${s.onglet === 'flechettes' ? 'sel' : ''}" data-action="onglet" data-onglet="flechettes">Fléchettes</button>
      <button class="tab ${s.onglet === 'total' ? 'sel' : ''}" data-action="onglet" data-onglet="total">Total</button></div>`;
  }

  if (s.onglet === 'total' && type === 'x01') {
    if (s.confirmDouble) {
      corps += `<div class="ask"><h3>Terminé sur un double ?</h3><div class="row">
        <button class="btn btn-danger" data-action="confirmer-double" data-reponse="non">Non, c'est cassé</button>
        <button class="btn btn-primary" data-action="confirmer-double" data-reponse="oui">Oui, gagné</button></div></div>`;
      return feuilleHtml(titre, sous, corps, '', 'fermer-saisie');
    }
    const total = s.total === '' ? null : Number(s.total);
    let note = '', classe = '';
    if (total != null) {
      if (total > 180 || TOTAUX_IMPOSSIBLES.has(total)) { note = 'Total impossible avec 3 fléchettes'; classe = 'bad'; }
      else if (p.options.doubleIn && !j.ouvert) { note = 'Double in non ouvert : un total direct ne peut pas ouvrir, il comptera 0.'; }
      else if (j.score - total < 0 || (p.options.doubleOut && j.score - total === 1)) { note = 'Cassé : ' + (j.score - total < 0 ? 'dépassement' : 'il resterait 1'); classe = 'bad'; }
      else if (j.score - total === 0) { note = p.options.doubleOut ? 'Arrivée à 0 : on demandera si c\'était un double' : 'Terminé !'; classe = 'good'; }
      else { note = `Il restera ${j.score - total}`; classe = 'good'; }
    }
    const valide = total != null && total <= 180 && !TOTAUX_IMPOSSIBLES.has(total);
    corps += `<div class="tdisp num">${s.total === '' ? '<span class="ph">0</span>' : h(s.total)}</div><div class="note ${classe}">${h(note)}</div>
      <div class="keys k3">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(d => `<button class="key num" data-action="chiffre" data-chiffre="${d}">${d}</button>`).join('')}
        <button class="key miss" data-action="effacer-total" aria-label="Effacer">⌫</button><button class="key num" data-action="chiffre" data-chiffre="0">0</button><button class="key num" data-action="chiffre" data-chiffre="00">00</button></div>`;
    const actions = `<button class="btn btn-ghost" data-action="fermer-saisie">Retour</button><button class="btn btn-primary" data-action="valider-total" ${valide ? '' : 'disabled'}>Valider</button>`;
    return feuilleHtml(titre, sous, corps, actions, 'fermer-saisie');
  }

  // Onglet Fléchettes
  corps += `<div class="slots">` + [0, 1, 2].map(i => {
    const f = s.flechettes[i];
    return `<button class="slot ${f ? 'full' : ''} ${s.curseur === i ? 'cur' : ''}" data-action="emplacement" data-index="${i}" aria-label="Fléchette ${i + 1}">${f ? h(notation(f)) : i + 1}</button>`;
  }).join('') + `</div>`;
  corps += `<div class="seg">${[[1, 'Simple'], [2, 'Double'], [3, 'Triple']].map(([v, l]) => `<button class="pill ${s.mult === v ? 'sel' : ''}" data-action="mult" data-mult="${v}">${l}</button>`).join('')}</div>`;

  const plein = s.curseur >= 3;
  let classeNum = () => '';
  if (type === 'cricket') classeNum = n => (CIBLES_CRICKET.includes(n) || n === 50) ? 'hot' : 'faint';
  else if (type === 'horloge') classeNum = n => (j.cible < SEQUENCE_HORLOGE.length && SEQUENCE_HORLOGE[j.cible] === n) ? 'hot' : '';
  const touche = (n, libelle, extra = '') => `<button class="key num ${classeNum(n)} ${extra}" data-action="secteur" data-secteur="${n}" ${plein ? 'disabled' : ''}>${libelle}</button>`;
  corps += `<div class="keys" ${styleJoueur(j.couleur)}>${NUMEROS_PAVE.map(n => touche(n, n)).join('')}
    ${touche(25, '25')}${touche(50, '50')}<button class="key miss span2" data-action="secteur" data-secteur="0" ${plein ? 'disabled' : ''}>Raté</button><span></span></div>`;

  let note = '', classe = '';
  if (type === 'x01') {
    if (p.options.doubleIn && !j.ouvert) note = 'Double in : il faut un double pour ouvrir.';
    else if (fl.length) note = `${restantes ? pluriel(restantes, 'fléchette restante', 'fléchettes restantes') : 'Volée complète'}`;
    else note = 'Multiplicateur puis numéro. Le multiplicateur revient à Simple après chaque fléchette.';
  } else if (type === 'cricket') {
    const d = etat.volees[etat.volees.length - 1];
    if (fl.length && d && etat.volees.length > p.volees.length) {
      note = pluriel(d.marques, 'marque');
      if (p.options.avecPoints && d.points) note += p.options.cutThroat ? ` · +${d.points} aux adversaires` : ` · +${d.points} points`;
      classe = 'good';
    } else note = 'Cibles : 20 à 15 et la bulle. Le reste ne compte pas.';
  } else {
    note = j.cible >= SEQUENCE_HORLOGE.length ? 'Horloge terminée !' : `Vise le ${SEQUENCE_HORLOGE[j.cible]} — tout multiplicateur valide`;
  }
  corps += `<div class="note ${classe}">${h(note)}</div>`;
  const actions = `<button class="btn btn-ghost" data-action="fermer-saisie">Retour</button>
    <button class="btn btn-primary" data-action="valider-volee" ${fl.length ? '' : 'disabled'}>Valider${fl.length && fl.length < 3 ? ` · ${fl.length} fl.` : ''}</button>`;
  return feuilleHtml(titre, sous, corps, actions, 'fermer-saisie');
}

/* ---- Plein écran éphémère et message ---- */
let minuteurFlash = null;
function afficherFlash(classe, mot, nomsHtml, duree) {
  const f = document.getElementById('flash');
  if (minuteurFlash) clearTimeout(minuteurFlash);
  f.innerHTML = `<div class="flash ${classe}" data-action="fermer-flash" role="alert"><div class="in"><b>${h(mot)}</b>${nomsHtml ? `<div class="names">${nomsHtml}</div>` : ''}</div></div>`;
  f.hidden = false;
  minuteurFlash = setTimeout(cacherFlash, duree);
}
function cacherFlash() {
  const f = document.getElementById('flash');
  if (minuteurFlash) { clearTimeout(minuteurFlash); minuteurFlash = null; }
  f.hidden = true; f.innerHTML = '';
}
let minuteurToast = null;
function toast(msg, duree = 2200) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.hidden = false;
  if (minuteurToast) clearTimeout(minuteurToast);
  minuteurToast = setTimeout(() => { t.hidden = true; }, duree);
}

/* ---- 5.6 Fin de partie / résumé ---- */
function renderFin() {
  const f = app.fin;
  if (!f) { app.ecran = 'accueil'; return renderAccueil(); }
  const g = f.partie;
  const etat = calculerEtat(g.mode, g.options, g.joueurs, g.volees);
  const vainqueurs = new Set(g.vainqueurs || etat.vainqueurs.map(i => g.joueurs[i].id));
  const nomsVainqueurs = etat.joueurs.filter(j => vainqueurs.has(j.id)).map(j => j.nom);
  const sousTitre = !nomsVainqueurs.length ? 'Partie sans vainqueur.'
    : nomsVainqueurs.length > 1 ? `Égalité en tête : ${nomsVainqueurs.join(' et ')}.` : `Bravo ${nomsVainqueurs[0]}.`;

  let corps = `<div class="sum"><h1 class="sum-h">${f.historique ? 'Résumé' : 'Partie terminée'}</h1>
    <p class="sum-s">${h(sousTitre)} ${h(MODES[g.mode].libelle)} · ${h(libelleOptions(g.mode, g.options))} · ${h(formaterDate(g.dateFin || g.dateDebut))} · ${pluriel(etat.nbTours, 'tour')}.</p>`;

  etat.classement.forEach((idx, pos) => {
    const j = etat.joueurs[idx];
    let score = '', detail = '';
    const tags = [];
    if (etat.type === 'x01') {
      score = j.score === 0 ? `0` : `${j.score}<small> restants</small>`;
      detail = `Moyenne ${formaterNombre(moyenneVolee(j))} · ${pluriel(j.flechettes, 'fléchette')}`;
      if (j.meilleurCheckout) tags.push(`Checkout ${j.meilleurCheckout}`);
      if (j.volees180) tags.push(`180 ×${j.volees180}`);
      if (j.volees100) tags.push(`100+ ×${j.volees100}`);
      if (j.meilleureVolee) tags.push(`Meilleure volée ${j.meilleureVolee}`);
    } else if (etat.type === 'cricket') {
      score = g.options.avecPoints ? `${j.score}<small> pts</small>` : `${nbFermees(j)}<small>/7</small>`;
      detail = `${nbFermees(j)}/7 cibles fermées · ${formaterNombre(moyenneMarques(j))} marques par volée`;
      if (j.meilleureVoleeMarques) tags.push(`Meilleure volée ${pluriel(j.meilleureVoleeMarques, 'marque')}`);
    } else {
      score = j.cible >= SEQUENCE_HORLOGE.length ? '✓' : `${SEQUENCE_HORLOGE[j.cible]}<small> à viser</small>`;
      detail = `${pluriel(j.flechettes, 'fléchette')} · ${formaterNombre(moyenneProgression(j))} numéros par volée`;
      if (j.meilleureVoleeProgression) tags.push(`Meilleure volée ${pluriel(j.meilleureVoleeProgression, 'numéro')}`);
    }
    if (vainqueurs.has(j.id)) tags.unshift('Vainqueur');
    corps += `<div class="rank ${vainqueurs.has(j.id) ? 'win' : ''}" ${styleJoueur(j.couleur)}><div class="rank-n num">${pos + 1}</div><div class="rank-b"></div>
      <div class="rank-m"><div class="rank-t"><span class="nm">${h(j.nom)}</span><span class="sc num">${score}</span></div>
      <div class="rank-d num">${h(detail)}</div>
      ${tags.length ? `<div class="tags">${tags.map((t, i) => `<span class="tag ${i === 0 && vainqueurs.has(j.id) ? 'gold' : ''} num">${h(t)}</span>`).join('')}</div>` : ''}</div></div>`;
  });

  const lignes = etat.joueurs.map(j => statsJoueurPartie(etat, j));
  corps += `<div class="stats-wrap"><table class="stats"><thead><tr><th></th>${etat.joueurs.map(j => `<th class="pn" style="--pc:${h(j.couleur)}">${h(j.nom)}</th>`).join('')}</tr></thead><tbody>`;
  lignes[0].forEach((l, i) => { corps += `<tr><td>${h(l[0])}</td>${lignes.map(lj => `<td class="num">${h(lj[i][1])}</td>`).join('')}</tr>`; });
  if (g.options.rencontre) corps += `<tr><td>Rencontres</td><td class="num" colspan="${etat.joueurs.length}">${etat.rencontres}</td></tr>`;
  corps += `</tbody></table></div>`;

  corps += `<div class="sum-a">` + (f.historique
    ? `<button class="btn btn-ghost btn-lg" data-action="accueil">Revenir à l'accueil</button>`
    : `<button class="btn btn-primary btn-lg" data-action="rejouer">Rejouer avec les mêmes joueurs</button>
       <button class="btn btn-ghost btn-lg" data-action="nouvelle-partie-config">Nouvelle partie</button>
       <button class="btn btn-ghost btn-lg" data-action="accueil">Revenir à l'accueil</button>`) + `</div></div>`;
  return ecranHtml(barre(f.historique ? `<button class="iconbtn" data-action="accueil">${icone(IC.back)}Accueil</button>` : marque()), corps);
}

/* =====================================================================
   7. ÉVÉNEMENTS — délégation d'événements, routeur d'écrans
   ===================================================================== */
function aller(ecran) { app.ecran = ecran; app.edition = null; app.feuille = null; app.dialogue = null; render(); }
function fermerFeuille() { app.feuille = null; app.dialogue = null; renderModal(); }
// Dialogue de confirmation dessiné par l'app (pas de confirm() natif).
function confirmer(cfg, onOk) { app.dialogue = { ...cfg, onOk }; renderModal(); }

function nouvelleConfig(base) {
  const mode = base && MODES[base.mode] ? base.mode : '501';
  const options = { ...optionsParDefaut(mode) };
  if (base && base.options) Object.keys(options).forEach(k => { if (k in base.options) options[k] = !!base.options[k]; });
  const idsValides = new Set(app.joueurs.map(j => j.id));
  return {
    mode, options,
    selection: base ? base.joueurs.map(j => j.id).filter(id => idsValides.has(id)) : [],
    rencontre: !!(base && base.options && base.options.rencontre),
  };
}

function demarrerPartie() {
  const c = app.config;
  if (validerConfig(c)) return;
  const cutThroat = MODES[c.mode].type === 'cricket' && c.options.cutThroat;
  app.partie = {
    id: genererId(),
    dateDebut: new Date().toISOString(),
    mode: c.mode,
    options: { ...c.options, rencontre: cutThroat ? false : !!c.rencontre },
    joueurs: c.selection.map(id => { const j = joueurParId(id); return { id: j.id, nom: j.nom, couleur: j.couleur }; }),
    volees: [],
  };
  app.dernierJoueurAffiche = null;
  app.saisie = null;
  sauvegarderMaintenant();
  aller('partie');
}

function ouvrirSaisie() {
  const etat = etatCourant();
  if (!etat || etat.joueurCourant == null) return;
  app.saisie = { joueurIndex: etat.joueurCourant, onglet: 'flechettes', flechettes: [null, null, null], curseur: 0, mult: 1, total: '', confirmDouble: false };
  renderModal();
}
function fermerSaisie() { app.saisie = null; renderModal(); }

function terminerPartie(etat) {
  const p = app.partie;
  const entree = {
    id: p.id, dateDebut: p.dateDebut, dateFin: new Date().toISOString(), mode: p.mode, options: p.options,
    joueurs: p.joueurs, volees: p.volees,
    vainqueurs: etat.vainqueurs.map(i => p.joueurs[i].id),
    classement: etat.classement.map(i => p.joueurs[i].id),
  };
  app.games.push(entree);
  app.games = app.games.slice(-MAX_HISTORIQUE);
  app.partie = null;
  app.fin = { partie: entree, historique: false };
  sauvegarderMaintenant();
  vibrer([60, 40, 60, 40, 120]);
  aller('fin');
}

function ajouterVolee(volee) {
  const p = app.partie;
  p.volees.push(volee);
  const etat = etatCourant();
  const d = etat.volees[etat.volees.length - 1];
  const bust = !!(d && d.bust);
  if (bust) { afficherFlash('bust', 'CASSÉ !', `<span>${puce(p.joueurs[volee.joueurIndex].couleur)}${h(p.joueurs[volee.joueurIndex].nom)} reste à ${d.scoreApres}</span>`, 1300); vibrer([90, 50, 90]); }
  else vibrer(25);
  if (p.options.rencontre && etat.rencontreVolee === p.volees.length - 1) {
    const noms = etat.rencontreGroupes.map(g => g.indices.map(i => `<span>${puce(p.joueurs[i].couleur)}${h(p.joueurs[i].nom)}</span>`).join('')).join('');
    const montrer = () => { afficherFlash('rencontre', 'RENCONTRE !', noms, 2000); vibrer([40, 40, 40]); };
    if (bust) setTimeout(montrer, 1300); else montrer();
  }
  app.saisie = null;
  if (etat.termine) terminerPartie(etat);
  else { sauvegarderDifferee(); render(); }
}

function validerVoleeFlechettes() {
  const s = app.saisie;
  const fl = flechettesSaisies();
  if (!s || !fl.length) return;
  ajouterVolee({ joueurIndex: s.joueurIndex, flechettes: fl, totalDirect: null });
}
function validerVoleeTotal(finiSurDouble) {
  const s = app.saisie;
  const total = Number(s.total);
  if (!(total >= 0) || total > 180 || TOTAUX_IMPOSSIBLES.has(total)) return;
  ajouterVolee({ joueurIndex: s.joueurIndex, flechettes: [], totalDirect: total, finiSurDouble: !!finiSurDouble });
}

function saisirFlechette(secteur) {
  const s = app.saisie, p = app.partie;
  if (!s || s.curseur >= 3) return;
  s.flechettes[s.curseur] = flechette(secteur, s.mult);
  s.mult = 1;
  const prochain = s.flechettes.findIndex(f => !f);
  s.curseur = prochain < 0 ? 3 : prochain;
  vibrer(12);
  // x01 : un bust ou une arrivée à 0 ferme immédiatement le tour.
  if (MODES[p.mode].type === 'x01') {
    const etat = etatProvisoire();
    const d = etat.volees[etat.volees.length - 1];
    if (d && etat.volees.length > p.volees.length && (d.bust || d.fini)) { validerVoleeFlechettes(); return; }
  }
  renderModal();
}

function enregistrerJoueur() {
  const e = app.edition;
  if (!e) return;
  const nom = (e.nom || '').trim();
  if (nom.length < 1 || nom.length > 20) { e.erreur = 'Le nom doit faire entre 1 et 20 caractères.'; renderModal(); return; }
  const doublon = app.joueurs.find(j => j.id !== e.id && j.nom.toLowerCase() === nom.toLowerCase());
  if (doublon) { e.erreur = 'Ce nom existe déjà.'; renderModal(); return; }
  if (e.id) {
    const j = joueurParId(e.id);
    if (j) { j.nom = nom; j.couleur = e.couleur; }
  } else {
    app.joueurs.push({ id: genererId(), nom, couleur: e.couleur, createdAt: new Date().toISOString() });
  }
  app.edition = null;
  sauvegarderMaintenant();
  render();
}
function couleurLibre() {
  const prises = new Set(app.joueurs.map(j => j.couleur));
  return (PALETTE.find(c => !prises.has(c.hex)) || PALETTE[app.joueurs.length % PALETTE.length]).hex;
}
function abandonnerPartie() {
  app.partie = null; app.saisie = null; app.feuille = null; app.dialogue = null;
  sauvegarderMaintenant();
  aller('accueil');
}

const ACTIONS = {
  'aller': el => aller(el.dataset.ecran),
  'accueil': () => { app.fin = null; aller('accueil'); },
  'nouvelle-partie': () => { app.config = nouvelleConfig(null); aller('config'); },
  'reprendre': () => { if (app.partie) { app.dernierJoueurAffiche = null; aller('partie'); } },
  'abandonner-courante': () => {
    if (!app.partie) return;
    confirmer({ titre: 'Abandonner la partie ?', texte: 'Elle ne sera pas enregistrée dans l\'historique.', ok: 'Abandonner', danger: true }, abandonnerPartie);
  },
  'ouvrir-resume': el => {
    const g = app.games.find(x => x.id === el.dataset.id);
    if (!g) return;
    app.fin = { partie: g, historique: true };
    aller('fin');
  },
  // Joueurs
  'nouveau-joueur': () => { app.feuille = null; app.edition = { id: null, nom: '', couleur: couleurLibre(), erreur: '', focus: true }; renderModal(); },
  'editer-joueur': el => {
    const j = joueurParId(el.dataset.id);
    if (j) { app.feuille = null; app.edition = { id: j.id, nom: j.nom, couleur: j.couleur, erreur: '', focus: true }; renderModal(); }
  },
  'menu-joueur': el => { app.feuille = { type: 'joueur', id: el.dataset.id }; renderModal(); },
  'choisir-couleur': el => { if (app.edition) { app.edition.couleur = el.dataset.hex; renderModal(); } },
  'enregistrer-joueur': enregistrerJoueur,
  'annuler-edition': () => { app.edition = null; renderModal(); },
  'supprimer-joueur': el => {
    const j = joueurParId(el.dataset.id);
    if (!j) return;
    confirmer({ titre: `Supprimer ${j.nom} ?`, texte: 'Ses parties passées restent dans l\'historique, mais il disparaît du tableau des victoires.', ok: 'Supprimer', danger: true }, () => {
      app.joueurs = app.joueurs.filter(x => x.id !== j.id);
      if (app.config) app.config.selection = app.config.selection.filter(id => id !== j.id);
      app.edition = null; app.feuille = null; app.dialogue = null;
      sauvegarderMaintenant(); render();
    });
  },
  // Configuration
  'basculer-joueur': el => {
    const c = app.config, id = el.dataset.id;
    const pos = c.selection.indexOf(id);
    if (pos >= 0) c.selection.splice(pos, 1);
    else if (c.selection.length >= MAX_JOUEURS_PARTIE) { toast(`Maximum ${MAX_JOUEURS_PARTIE} joueurs par partie`); return; }
    else c.selection.push(id);
    render();
  },
  'lancer-partie': demarrerPartie,
  'expliquer-rencontre': () => toast('Rencontre indisponible en cut throat : on donne ses points aux autres.'),
  // Partie
  'menu-partie': () => { app.feuille = { type: 'partie' }; renderModal(); },
  'menu-reglages': () => { app.feuille = { type: 'reglages' }; renderModal(); },
  'fermer-feuille': fermerFeuille,
  'ouvrir-saisie': ouvrirSaisie,
  'annuler-volee': () => {
    const p = app.partie;
    if (!p || !p.volees.length) return;
    p.volees.pop();
    app.saisie = null; app.feuille = null;
    cacherFlash();
    sauvegarderDifferee();
    vibrer(15);
    render();
  },
  'quitter': () => {
    if (!app.partie) return;
    confirmer({ titre: 'Abandonner la partie ?', texte: 'Elle ne sera pas enregistrée dans l\'historique. Pour la reprendre plus tard, préférer « Mettre en pause ».', ok: 'Abandonner', danger: true }, abandonnerPartie);
  },
  // Saisie
  'onglet': el => { if (app.saisie) { app.saisie.onglet = el.dataset.onglet; app.saisie.confirmDouble = false; renderModal(); } },
  'emplacement': el => {
    const s = app.saisie; if (!s) return;
    const i = Number(el.dataset.index);
    if (s.flechettes[i]) { s.curseur = i; renderModal(); }
  },
  'mult': el => { if (app.saisie) { app.saisie.mult = Number(el.dataset.mult); renderModal(); } },
  'secteur': el => saisirFlechette(Number(el.dataset.secteur)),
  'valider-volee': validerVoleeFlechettes,
  'fermer-saisie': fermerSaisie,
  'chiffre': el => {
    const s = app.saisie; if (!s) return;
    const t = (s.total + el.dataset.chiffre).replace(/^0+(?=\d)/, '');
    if (t.length > 3) return;
    s.total = t; renderModal();
  },
  'effacer-total': () => { const s = app.saisie; if (!s) return; s.total = s.total.slice(0, -1); renderModal(); },
  'valider-total': () => {
    const s = app.saisie, p = app.partie; if (!s) return;
    const total = Number(s.total);
    if (!(total >= 0) || total > 180 || TOTAUX_IMPOSSIBLES.has(total)) return;
    const j = etatCourant().joueurs[s.joueurIndex];
    if (p.options.doubleOut && j.ouvert && j.score - total === 0) { s.confirmDouble = true; renderModal(); return; }
    validerVoleeTotal(false);
  },
  'confirmer-double': el => validerVoleeTotal(el.dataset.reponse === 'oui'),
  // Fin
  'rejouer': () => {
    if (!app.fin) return;
    app.config = nouvelleConfig(app.fin.partie); app.fin = null;
    if (validerConfig(app.config)) aller('config'); else demarrerPartie();
  },
  'nouvelle-partie-config': () => { app.config = nouvelleConfig(app.fin ? app.fin.partie : null); app.fin = null; aller('config'); },
  // Réglages
  'exporter': () => { try { exporterJson(); fermerFeuille(); } catch (e) { toast('Export impossible'); } },
  'importer': () => { const inp = document.getElementById('fichier-import'); if (inp) inp.click(); },
  'purger': () => {
    confirmer({ titre: 'Purger l\'historique ?', texte: 'Toutes les parties terminées seront supprimées. Les joueurs sont conservés.', ok: 'Continuer', danger: true }, () => {
      confirmer({ titre: 'Vraiment ?', texte: 'Cette action est définitive. Un export préalable est le seul moyen de revenir en arrière.', ok: 'Purger', danger: true }, () => {
        app.games = []; app.feuille = null; app.dialogue = null;
        sauvegarderMaintenant(); toast('Historique purgé'); render();
      });
    });
  },
  // Dialogues et plein écran
  'dlg-ok': () => { const d = app.dialogue; app.dialogue = null; if (d && d.onOk) d.onOk(); else renderModal(); },
  'dlg-annuler': () => { app.dialogue = null; renderModal(); },
  'fermer-flash': cacherFlash,
};

const CHANGEMENTS = {
  'mode': el => { const c = app.config; c.mode = el.value; c.options = { ...optionsParDefaut(c.mode) }; render(); },
  'option': el => {
    const c = app.config, cle = el.dataset.cle;
    c.options[cle] = el.checked;
    if (cle === 'cutThroat' && el.checked) c.options.avecPoints = true;   // cut throat force « avec points »
    render();
  },
  'rencontre': el => { app.config.rencontre = el.checked; render(); },
  'fichier-import': el => {
    const fichier = el.files && el.files[0];
    if (!fichier) return;
    const lecteur = new FileReader();
    lecteur.onload = () => {
      let donnees;
      try { donnees = JSON.parse(lecteur.result); } catch (e) { toast('Fichier invalide'); return; }
      const joueurs = donnees && Array.isArray(donnees.players) ? donnees.players.filter(joueurValide).length : 0;
      const games = donnees && Array.isArray(donnees.games) ? donnees.games.filter(partieValide).length : 0;
      if (!joueurs && !games) { toast('Aucune donnée reconnue dans ce fichier'); return; }
      confirmer({ titre: 'Importer ce fichier ?', texte: `${pluriel(joueurs, 'joueur')} et ${pluriel(games, 'partie')}. Les éléments déjà présents sont conservés.`, ok: 'Importer' }, () => {
        try {
          const r = fusionnerImport(donnees);
          sauvegarderMaintenant();
          app.feuille = null;
          toast(`Importé : ${pluriel(r.joueurs, 'joueur')}, ${pluriel(r.games, 'partie')}`);
          render();
        } catch (e) { toast('Import impossible'); }
      });
    };
    lecteur.onerror = () => toast('Lecture impossible');
    lecteur.readAsText(fichier);
    el.value = '';
  },
};

function installerEvenements() {
  document.addEventListener('click', ev => {
    const el = ev.target.closest('[data-action]');
    if (!el || el.disabled) return;
    const action = ACTIONS[el.dataset.action];
    if (!action) return;
    ev.preventDefault();
    action(el, ev);
  });
  document.addEventListener('change', ev => {
    const el = ev.target.closest('[data-change]');
    if (!el) return;
    const fn = CHANGEMENTS[el.dataset.change];
    if (fn) fn(el, ev);
  });
  document.addEventListener('input', ev => {
    const el = ev.target;
    if (el && el.dataset && el.dataset.input === 'nom-joueur' && app.edition) { app.edition.nom = el.value; app.edition.erreur = ''; }
  });
  document.addEventListener('keydown', ev => {
    if (ev.key === 'Enter' && ev.target && ev.target.dataset && ev.target.dataset.input === 'nom-joueur') { ev.preventDefault(); enregistrerJoueur(); }
    if (ev.key === 'Escape') { if (app.saisie) fermerSaisie(); else if (app.edition) { app.edition = null; renderModal(); } else fermerFeuille(); cacherFlash(); }
  });
  // Un tap n'importe où fait disparaître le plein écran plus tôt.
  document.addEventListener('pointerdown', () => { if (!document.getElementById('flash').hidden) cacherFlash(); }, true);
  // Indicateur de position des colonnes (délégué : la grille est recréée à chaque rendu).
  document.addEventListener('scroll', ev => { if (ev.target && ev.target.id === 'grille') majIndicateurPoints(); }, true);
  // Sauvegarde immédiate quand l'onglet est fermé ou mis en arrière-plan.
  window.addEventListener('pagehide', sauvegarderMaintenant);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') sauvegarderMaintenant(); });
}

function demarrer() {
  chargerTout();
  app.config = nouvelleConfig(null);
  app.feuille = null; app.dialogue = null;
  installerEvenements();
  render();
  if (/[?&]selftest=1/.test(location.search)) {
    const r = selfTest();
    const b = document.getElementById('selftest');
    b.className = 'selftest ' + (r.echecs.length ? 'ko' : 'ok');
    b.textContent = `Self-test : ${r.reussis}/${r.total}` + (r.echecs.length ? '\n' + r.echecs.join('\n') : ' ✔ (toucher pour fermer)');
    b.hidden = false;
    b.onclick = () => { b.hidden = true; };
  }
}

/* =====================================================================
   8. SELF-TEST — assertions sur le moteur pur (?selftest=1)
   ===================================================================== */
function selfTest() {
  const joueursTest = n => Array.from({ length: n }, (_, i) => ({ id: 'j' + i, nom: 'Joueur ' + (i + 1), couleur: PALETTE[i].hex }));
  const V = (joueurIndex, txt) => ({ joueurIndex, flechettes: txt.split(/\s+/).filter(Boolean).map(analyserNotation), totalDirect: null });
  const etat = (mode, options, n, volees) => calculerEtat(mode, options, joueursTest(n), volees);
  const X01 = { doubleIn: false, doubleOut: false };
  const DO = { doubleIn: false, doubleOut: true };
  const CR = { avecPoints: true, cutThroat: false };
  const assert = (cond, msg) => { if (!cond) throw new Error(msg); };
  const derniere = e => e.volees[e.volees.length - 1];
  // Amène le joueur 0 (partie à 1 joueur) à un score donné en straight out, via un total direct.
  const versScore = (depart, score) => ({ joueurIndex: 0, flechettes: [], totalDirect: depart - score });

  const tests = [
    ['x01 · 501, T20 T20 T20 → reste 321, total 180', () => {
      const e = etat('501', X01, 1, [V(0, 'T20 T20 T20')]);
      assert(e.joueurs[0].score === 321, 'reste ' + e.joueurs[0].score);
      assert(derniere(e).total === 180, 'total ' + derniere(e).total);
    }],
    ['x01 · double out, 40, D20 → victoire', () => {
      const e = etat('501', DO, 1, [versScore(501, 40), V(0, 'D20')]);
      assert(e.joueurs[0].score === 0 && e.termine && e.vainqueurs.length === 1 && e.vainqueurs[0] === 0, 'pas de victoire');
    }],
    ['x01 · double out, 32, 20 20 20 → bust, reste 32', () => {
      const e = etat('501', DO, 1, [versScore(501, 32), V(0, '20 20 20')]);
      assert(derniere(e).bust && e.joueurs[0].score === 32, 'reste ' + e.joueurs[0].score);
    }],
    ['x01 · double out, 32, 16 16 → bust (0 sans double), reste 32', () => {
      const e = etat('501', DO, 1, [versScore(501, 32), V(0, '16 16')]);
      assert(derniere(e).bust && e.joueurs[0].score === 32 && !e.termine, 'attendu bust');
    }],
    ['x01 · straight out, 32, 16 16 → victoire', () => {
      const e = etat('501', X01, 1, [versScore(501, 32), V(0, '16 16')]);
      assert(!derniere(e).bust && e.joueurs[0].score === 0 && e.termine, 'attendu victoire');
    }],
    ['x01 · double out, 2, 1 → bust (score = 1)', () => {
      const e = etat('501', DO, 1, [versScore(501, 2), V(0, '1')]);
      assert(derniere(e).bust && e.joueurs[0].score === 2, 'reste ' + e.joueurs[0].score);
    }],
    ['x01 · double in, 501, 20 T20 D5 → reste 491', () => {
      const e = etat('501', { doubleIn: true, doubleOut: false }, 1, [V(0, '20 T20 D5')]);
      assert(e.joueurs[0].score === 491 && e.joueurs[0].ouvert, 'reste ' + e.joueurs[0].score);
    }],
    ['x01 · après un bust, la main passe au joueur suivant', () => {
      const e = etat('301', DO, 2, [V(0, 'T20 T20 T20'), V(1, '20 20 20'), V(0, 'T20 T20 T20')]);
      const d = derniere(e);
      assert(d.bust && d.flechettes.length === 2, 'bust attendu dès la 2e fléchette (reste 1)');
      assert(e.joueurCourant === 1 && e.joueurs[0].score === 121, 'joueur courant ' + e.joueurCourant);
    }],
    ['cricket · 2 marques sur 20, T20, adversaire ouvert → fermé + 40 pts', () => {
      const e = etat('cricket', CR, 2, [V(0, 'D20'), V(1, '—'), V(0, 'T20')]);
      assert(e.joueurs[0].marques[20] === 3 && e.joueurs[0].score === 40, 'score ' + e.joueurs[0].score);
    }],
    ['cricket · même cas, adversaire a fermé le 20 → 0 point', () => {
      const e = etat('cricket', CR, 2, [V(0, 'D20'), V(1, 'T20'), V(0, 'T20')]);
      assert(e.joueurs[0].marques[20] === 3 && e.joueurs[0].score === 0, 'score ' + e.joueurs[0].score);
    }],
    ['cricket · cut throat : +40 à chaque adversaire non fermé', () => {
      const e = etat('cricket', { avecPoints: true, cutThroat: true }, 3, [V(0, 'D20'), V(1, 'T20'), V(2, '—'), V(0, 'T20')]);
      assert(e.joueurs[0].score === 0 && e.joueurs[1].score === 0 && e.joueurs[2].score === 40, 'scores ' + e.joueurs.map(j => j.score));
    }],
    ['cricket · demi-bulle = 1 marque, bulle = 2 marques', () => {
      const e = etat('cricket', CR, 2, [V(0, '25'), V(1, '50')]);
      assert(e.joueurs[0].marques[25] === 1 && e.joueurs[1].marques[25] === 2, 'marques ' + e.joueurs[0].marques[25] + '/' + e.joueurs[1].marques[25]);
    }],
    ['cricket · tout fermé mais mené aux points → pas vainqueur', () => {
      const e = etat('cricket', CR, 2, [V(0, 'T19 T18 T17'), V(1, 'T20 T20 T20'), V(0, 'T16 T15 50'), V(1, '— — —'), V(0, '25 T20 —'), V(1, '—')]);
      assert(nbFermees(e.joueurs[0]) === 7, 'fermées ' + nbFermees(e.joueurs[0]));
      assert(e.joueurs[1].score === 120 && e.joueurs[0].score === 0, 'points ' + e.joueurs[0].score + '/' + e.joueurs[1].score);
      assert(!e.termine && !e.dernierTour && e.vainqueurs.length === 0 && e.joueurCourant === 0, 'la partie devrait continuer');
    }],
    ['horloge · sur le 5, 5 D6 T7 → vise le 8', () => {
      const e = etat('horloge', {}, 1, [V(0, '1 2 3'), V(0, '4 — —'), V(0, '5 D6 T7')]);
      assert(SEQUENCE_HORLOGE[e.joueurs[0].cible] === 8, 'vise ' + SEQUENCE_HORLOGE[e.joueurs[0].cible]);
    }],
    ['horloge · sur le 5, D5 → vise le 6', () => {
      const e = etat('horloge', {}, 1, [V(0, '1 2 3'), V(0, '4 — —'), V(0, 'D5')]);
      assert(SEQUENCE_HORLOGE[e.joueurs[0].cible] === 6, 'vise ' + SEQUENCE_HORLOGE[e.joueurs[0].cible]);
    }],
    ['checkout · 170, 3 fl., double out → T20 T20 50', () => {
      assert(texteCheckout(checkout(170, 3, true)) === 'T20 → T20 → 50', texteCheckout(checkout(170, 3, true)));
    }],
    ['checkout · 2, 1 fl., double out → D1', () => {
      assert(texteCheckout(checkout(2, 1, true)) === 'D1', texteCheckout(checkout(2, 1, true)));
    }],
    ['checkout · 169, 3 fl., double out → aucun (bogey : 169 168 166 165 163 162 159)', () => {
      [169, 168, 166, 165, 163, 162, 159].forEach(b => assert(checkout(b, 3, true) === null, b + ' aurait un finish'));
      assert(checkout(167, 3, true) !== null && checkout(164, 3, true) !== null, '167/164 devraient avoir un finish');
    }],
    ['checkout · 1, 3 fl., double out → aucun', () => {
      assert(checkout(1, 3, true) === null, 'finish trouvé pour 1');
    }],
    ['rencontre · deux joueurs au même score après une volée chacun → déclenchement', () => {
      const e = etat('501', X01, 2, [V(0, 'T20 T20 D20'), V(1, 'T20 T20 D20')]);
      assert(e.rencontres === 1 && e.rencontreVolee === 1, 'rencontres ' + e.rencontres);
      assert(e.rencontreGroupes.length === 1 && e.rencontreGroupes[0].indices.join() === '0,1', 'groupes');
      // La même égalité non rompue ne se re-signale pas ; une nouvelle égalité, si.
      const e2 = etat('501', X01, 2, [V(0, 'T20 T20 D20'), V(1, 'T20 T20 D20'), V(0, '—'), V(1, '—')]);
      assert(e2.rencontres === 1 && e2.rencontreVolee === 1, 'ré-affichage parasite');
      const e3 = etat('501', X01, 2, [V(0, 'T20 T20 D20'), V(1, 'T20 T20 D20'), V(0, '20'), V(1, '20')]);
      assert(e3.rencontres === 2 && e3.rencontreVolee === 3, 'nouvelle égalité non signalée');
    }],
    ['rencontre · deux joueurs à 501 avant toute volée → pas de déclenchement', () => {
      const e = etat('501', X01, 2, []);
      assert(e.rencontres === 0 && e.rencontreVolee === -1, 'rencontres ' + e.rencontres);
      const e2 = etat('501', X01, 2, [V(0, '—')]);   // un seul a joué : toujours rien
      assert(e2.rencontres === 0, 'déclenché après une seule volée');
    }],
    ['annulation · 5 volées, 3 annulations ≡ état après 2 volées', () => {
      const volees = [V(0, 'T20 19 D7'), V(1, '20 20 20'), V(0, 'T19 T19 25'), V(1, '50 1 T3'), V(0, '5 5 5')];
      const attendu = JSON.stringify(etat('501', DO, 2, volees.slice(0, 2)));
      const copie = volees.slice();
      copie.pop(); copie.pop(); copie.pop();
      assert(JSON.stringify(etat('501', DO, 2, copie)) === attendu, 'états différents');
    }],
  ];

  const echecs = [];
  tests.forEach(([nom, fn], i) => {
    try { fn(); console.log(`✔ ${i + 1}. ${nom}`); }
    catch (e) { echecs.push(`✘ ${i + 1}. ${nom} — ${e.message}`); console.error(`✘ ${i + 1}. ${nom}`, e); }
  });
  const r = { total: tests.length, reussis: tests.length - echecs.length, echecs };
  console.log(`Self-test : ${r.reussis}/${r.total}`);
  return r;
}

  window.dartsSelfTest = selfTest;
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', demarrer);
  else demarrer();
