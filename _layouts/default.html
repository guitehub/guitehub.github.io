<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title and page.url != "/" %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
    <meta name="description" content="{{ page.subtitle | default: site.description }}">

    <!-- Anti-FOUC : applique le thème mémorisé avant le rendu -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (t) document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>

    <!-- Icônes uniquement (le framework Bootstrap n'est plus utilisé) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.9.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/style.css">
    {% feed_meta %}

    <!--
Un jour, un développeur web décide de se reposer et se rend au zoo. En se promenant, il remarque un panneau près de l'enclos des singes : "Notre nouvelle espèce de singe, le Singe Développeur Web !".
Intrigué, il s'approche et voit un singe assis devant un ordinateur portable, en train de taper du code. Il y a aussi une pancarte qui décrit les capacités de ces singes : "Capables de créer des sites web et des applications !".
Le développeur, amusé, décide de tester les compétences du singe. Il lui demande de créer un site web simple. À sa grande surprise, le singe développe un site web en quelques minutes, avec un design élégant et un code propre.
Impressionné, le développeur s'exclame : "C'est incroyable ! Quel est le secret de ces singes ?". Le gardien du zoo lui répond : "Eh bien, vous savez, ces singes ont été formés pour travailler rapidement et efficacement. Ils sont même capables de résoudre les problèmes les plus complexes !".
Le développeur réfléchit un instant et demande : "Est-ce qu'ils savent comment centrer un élément en CSS ?". Le gardien du zoo soupire et répond : "Eh bien, il y a des limites à ce que même les singes développeurs web peuvent faire !"
    -->
</head>

<body>
    {% include nav.html %}
    {% include header.html %}

    <main>
        <div class="wrap content">
            {{ content }}
        </div>
    </main>

    {% include footer.html %}

    <script>
      (function () {
        var btn = document.getElementById('theme-toggle');
        if (!btn) return;
        var root = document.documentElement;
        function current() {
          var saved = null;
          try { saved = localStorage.getItem('theme'); } catch (e) {}
          if (saved) return saved;
          return matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        function render() {
          var dark = current() === 'dark';
          btn.querySelector('i').className = dark ? 'bi bi-sun' : 'bi bi-moon-stars';
          btn.setAttribute('aria-label', dark ? 'Passer en clair' : 'Passer en sombre');
        }
        btn.addEventListener('click', function () {
          var next = current() === 'dark' ? 'light' : 'dark';
          root.setAttribute('data-theme', next);
          try { localStorage.setItem('theme', next); } catch (e) {}
          render();
        });
        render();
      })();
    </script>
</body>

</html>
