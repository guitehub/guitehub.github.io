# Contrôles du site : validation des données et tests de gueathub, absence de métadonnées dans toutes les images du site.
# Indépendant du déploiement GitHub Pages : un échec signale le problème
# mais ne bloque pas la publication.
name: site-check

on:
  push:
    paths:
      - "_data/gueathub/**"
      - "assets/**"
      - "outils/gueathub/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/site-check.yml"
  pull_request:
    paths:
      - "_data/gueathub/**"
      - "assets/**"
      - "outils/gueathub/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/site-check.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Images sans métadonnées (EXIF, GPS…)
        run: npm run strip-metadata -- --check
      - run: npm test
      - name: app.css et icons.js commités à jour
        run: |
          npm run icons
          npm run css:build
          git diff --exit-code -- outils/gueathub/app.css outils/gueathub/js/ui/icons.js
